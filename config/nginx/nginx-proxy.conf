# -----------------------------------------------------------------------------
# Real client IP recovery
# -----------------------------------------------------------------------------
# All public traffic reaches this proxy through the pinggy tunnel, which connects
# from inside the Docker network and injects the originating client address in the
# X-Forwarded-For header. Without real_ip, $remote_addr is the tunnel/container
# address (e.g. 127.0.0.1) and every access log line looks the same.
#
# Trust the loopback + private Docker ranges (nginx publishes no host ports, so
# only the pinggy container can reach it) and take the client IP from XFF. This
# rewrites $remote_addr to the true client, which then flows downstream via the
# X-Real-IP / X-Forwarded-For headers already set on each proxy_pass below.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Access log format that surfaces the recovered client IP plus the raw XFF chain.
log_format real_ip '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'xff="$http_x_forwarded_for"';
access_log /var/log/nginx/access.log real_ip;

# -----------------------------------------------------------------------------
# Runtime upstream resolution
# -----------------------------------------------------------------------------
# nginx resolves static `proxy_pass http://name:port` targets once at startup and
# ABORTS if any fails to resolve. With several upstreams that made a single stopped
# container prevent nginx booting at all — which also took Portainer offline,
# since it is only reachable through this proxy.
#
# Using a variable in proxy_pass defers resolution to request time, so nginx
# always starts and returns 502 for whichever upstream is actually down.
# 127.0.0.11 is Docker's embedded DNS server.
resolver 127.0.0.11 valid=10s ipv6=off;

# -----------------------------------------------------------------------------
# Default server: container healthcheck + catch-all
# -----------------------------------------------------------------------------
# Self-contained health endpoint for the container healthcheck. Deliberately does
# NOT proxy to any upstream: nginx's health must reflect nginx, not the frontend.
# The healthcheck used to be `curl -f http://localhost:80/`, and because there was
# no default_server that Host: localhost request fell through to the FIRST server
# block (simonrowe.dev), which proxies to `frontend`. So a stopped frontend made
# nginx report unhealthy; `pinggy` waits on nginx being service_healthy, so the
# tunnel never started and EVERY hostname - the site, api, Portainer, Langfuse and
# Dependency-Track - went offline. That is the exact failure the resolver change
# above was meant to end, in a new shape.
#
# Being default_server does not change which block serves the public
# hostnames below: nginx matches server_name first and only falls back to the
# default server when no server_name matches. This block has server_name _ (a
# name that cannot appear in a real Host header), so it only ever catches
# unmatched hosts.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Unrecognised Host header (scanners hitting the tunnel by IP, etc.): close the
    # connection without a response rather than serving a real vhost by accident.
    location / {
        return 444;
    }
}

# -----------------------------------------------------------------------------
# Maintenance and unavailable pages
# -----------------------------------------------------------------------------
# Two states, one flag file:
#
#   /var/run/deploy-state/maintenance.on EXISTS  -> themed 503 "update in progress"
#   flag absent, upstream down (502/504)         -> themed "temporarily unavailable"
#
# The flag lives in the `deploy-state` volume, mounted READ-ONLY here and
# read-write on `deployer`. The deployer touches it around the pull/recreate
# phases so the site never shows a half-updated frontend or a raw proxy error
# mid-deploy.
#
# Both pages are bind-mounted from ./config/nginx/maintenance and are entirely
# self-contained - no stylesheet, font, image or script is fetched, because the
# container that would serve them is the one that is down or being replaced.
#
# WHAT IS DELIBERATELY *NOT* BEHIND THE FLAG, and why each one matters:
#
#   /healthz                  the nginx container healthcheck. Failing it marks
#                             nginx unhealthy, and `pinggy` waits on nginx being
#                             service_healthy - which takes EVERY hostname,
#                             Portainer included, offline. It lives in the
#                             default_server block below, which gets no
#                             error_page and no flag check.
#   POST /webhooks/github     it is how this deploy was triggered and how the next
#                             one will be. A 503 would make GitHub retry into a
#                             wall. This is why the flag check sits inside
#                             `location /` and NOT at server level - at server
#                             level it would cover the exact-match webhook
#                             location too.
#   console/temporal/langfuse/dependency-track
#                             Portainer and the Temporal UI must stay reachable
#                             *especially* while a deploy is failing. They are how
#                             it gets fixed. Those server blocks are untouched.
#
# `error_page` and named locations are per-server-block and are NOT inherited, so
# the simonrowe.dev and api.simonrowe.dev blocks each carry their own copy below.
# Keep the two in step.

server {
    listen 80;
    server_name simonrowe.dev www.simonrowe.dev;

    # No `=` before the named location, deliberately. `error_page 503 = @maintenance`
    # rewrites the response status to whatever @maintenance returns, which for a
    # static file served by try_files is 200 - so the maintenance page would be
    # served as a success. That breaks two things at once: monitors and crawlers
    # would read a maintenance page as a healthy site, and restart-prod.sh's
    # verify-public phase (which treats 503 as a failure) would PASS while the page
    # was still up, so a failed `maintenance-off` would go unnoticed.
    error_page 503 @maintenance;
    error_page 502 504 @unavailable;

    location @maintenance {
        root /etc/nginx/maintenance;
        try_files /maintenance.html =503;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }

    location @unavailable {
        root /etc/nginx/maintenance;
        try_files /unavailable.html =502;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        # `if` is only reliably safe at location level with `return`, which is
        # exactly this usage - the "if is evil" warning is about `if` combined with
        # other directives.
        if (-f /var/run/deploy-state/maintenance.on) {
            return 503;
        }

        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately NO proxy_intercept_errors. It is not needed for the case
        # this exists for: when the upstream container is unreachable, nginx
        # generates the 502 itself and error_page above handles it. Turning it on
        # would additionally rewrite 502/504/503 responses produced *by* the
        # upstream, which would dress a real application error up as an outage
        # page and hide it.
    }
}

# Term Time, the school assistant, on its own hostname.
#
# Same `frontend` container as the main site — Term Time is a second Vite entry point in the
# same bundle, not a separate deployment. All this block does is map the root of this hostname
# onto the /school/ page inside that bundle.
#
# Why `location = /` and not a rewrite of everything: the two bundles SHARE /assets/, because a
# multi-page Vite build emits both into one directory. Rewriting every path to /school/... would
# send /assets/school-abc.js to /school/assets/school-abc.js, which does not exist, and the page
# would load as blank HTML with no styling and no error worth reading.
#
# Term Time has no client-side router, so exactly one path needs mapping. If it ever gains
# routes, this needs a try_files-style fallback rather than another rewrite.
server {
    listen 80;
    server_name term-time.simonrowe.dev;

    error_page 503 @maintenance;
    error_page 502 504 @unavailable;

    location @maintenance {
        root /etc/nginx/maintenance;
        try_files /maintenance.html =503;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }

    location @unavailable {
        root /etc/nginx/maintenance;
        try_files /unavailable.html =502;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
    }

    # The chat talks to the backend over these two paths. They must be routed here as well as
    # on api.simonrowe.dev: the browser calls them same-origin, so on this hostname they arrive
    # at this server block, and without these they would fall through to the frontend and 404.
    location /api/ {
        set $upstream_backend backend;
        # No URI part, deliberately, and this is NOT a style choice. When proxy_pass names
        # its upstream through a VARIABLE and also specifies a URI, nginx passes that URI
        # literally instead of substituting the matched prefix — so /api/school/chat arrived
        # at the backend as a bare /api/ and every Term Time call 404'd while the page itself
        # loaded perfectly. Every other proxy_pass in this file already omits the URI; these
        # two were the only ones that carried one, added with the term-time block. The
        # frontend's own nginx.conf keeps `/api/` because it names a STATIC host, where the
        # substitution does happen.
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $upstream_backend_ws backend;
        # Same reason as /api/ above: a variable upstream plus a URI passes the URI verbatim.
        proxy_pass http://$upstream_backend_ws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A streamed answer can pause while a tool runs; the default 60s would cut the socket
        # mid-conversation.
        proxy_read_timeout 300s;
    }

    location = / {
        if (-f /var/run/deploy-state/maintenance.on) {
            return 503;
        }
        set $upstream_frontend_root frontend;
        proxy_pass http://$upstream_frontend_root:80/school/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if (-f /var/run/deploy-state/maintenance.on) {
            return 503;
        }
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.simonrowe.dev;

    # A copy of the www block's page handling - error_page and named locations are
    # not inherited between server blocks. Keep the two in step.
    # See the www block above for why there is no `=` here.
    error_page 503 @maintenance;
    error_page 502 504 @unavailable;

    location @maintenance {
        root /etc/nginx/maintenance;
        try_files /maintenance.html =503;
        add_header Retry-After 120 always;
        add_header Cache-Control "no-store" always;
    }

    location @unavailable {
        root /etc/nginx/maintenance;
        try_files /unavailable.html =502;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
    }

    # GitHub sends the exact signed bytes to the software factory. This is an exact-match
    # location on purpose: it is the ONLY path on software-factory reachable from the
    # internet. Its manual trigger and status API (/api/reviews) must stay unrouted —
    # they are token-protected as well, but there is no reason to expose them.
    #
    # NOTE it carries no maintenance-flag check, and that is the reason the check
    # below lives inside `location /` rather than at server level: this endpoint is
    # how the running deploy was triggered and how the next one will be, so a 503
    # here would make GitHub retry into a wall for the length of the deploy.
    location = /webhooks/github {
        set $upstream_factory software-factory;
        proxy_pass http://$upstream_factory:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    # The STOMP endpoint, split out of `location /` for one directive: proxy_read_timeout.
    #
    # This is the block that carries EVERY chat WebSocket in production, including Term Time's.
    # The frontend image is built with VITE_API_BASE_URL=https://api.simonrowe.dev, so the
    # browser opens wss://api.simonrowe.dev/ws/chat even from term-time.simonrowe.dev — the
    # /ws/ block in the term-time server block below is same-origin only and is not the one a
    # released build uses. Keep the two in step.
    #
    # nginx's default proxy_read_timeout is 60s and it applies to an idle WebSocket exactly as
    # it does to a slow response, so before this block a conversation that paused for a minute
    # had its socket closed underneath it. The backend now sends STOMP heartbeats every 10s
    # (WebSocketConfig), which is the real fix — this is the headroom that keeps a single
    # missed heartbeat, or a tool call that runs long, from costing the connection.
    location /ws/ {
        if (-f /var/run/deploy-state/maintenance.on) {
            return 503;
        }

        set $upstream_backend_ws backend;
        # No URI part: with a variable upstream, nginx passes any URI here verbatim instead of
        # substituting the matched prefix. See the term-time block for the full account.
        proxy_pass http://$upstream_backend_ws:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        if (-f /var/run/deploy-state/maintenance.on) {
            return 503;
        }

        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retained for any WebSocket endpoint that is not under /ws/. The timeouts are
        # deliberately left at nginx's defaults here: this block also serves every ordinary
        # request, where a 300s ceiling on a backend that has stopped answering would hold
        # connections open for five minutes instead of failing.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name temporal.simonrowe.dev;

    location / {
        set $upstream_temporal_ui temporal-ui;
        proxy_pass http://$upstream_temporal_ui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name console.simonrowe.dev;

    location / {
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-API-Key, X-CSRF-TOKEN, cache-control' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        set $upstream_portainer portainer;
        proxy_pass http://$upstream_portainer:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Clear Origin header to prevent Portainer CSRF rejection behind reverse proxy
        proxy_set_header Origin "";

        # Add CORS response headers
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # WebSocket upgrade support (for container console and log streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name langfuse.simonrowe.dev;

    location / {
        set $upstream_langfuse langfuse;
        proxy_pass http://$upstream_langfuse:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name dependency-track.simonrowe.dev;

    # Single hostname split by path: the SPA is configured with
    # API_BASE_URL=https://dependency-track.simonrowe.dev, so its API calls come
    # back to this same origin and must be routed to the apiserver.
    #
    # Note /static/* deliberately falls through to the frontend below - the OIDC
    # callback is a static asset at /static/oidc-callback.html, not an API route.
    location /api/ {
        set $upstream_dt_api dependencytrack-apiserver;
        proxy_pass http://$upstream_dt_api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SBOM uploads from CI are multipart and can exceed nginx's 1m default.
        client_max_body_size 32m;
    }

    location / {
        set $upstream_dt_web dependencytrack-frontend;
        proxy_pass http://$upstream_dt_web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
