# -----------------------------------------------------------------------------
# Real client IP recovery
# -----------------------------------------------------------------------------
# All public traffic reaches this proxy through the pinggy tunnel, which connects
# from inside the Docker network and injects the originating client address in the
# X-Forwarded-For header. Without real_ip, $remote_addr is the tunnel/container
# address (e.g. 127.0.0.1) and every access log line looks the same.
#
# Trust the loopback + private Docker ranges (nginx publishes no host ports, so
# only the pinggy container can reach it) and take the client IP from XFF. This
# rewrites $remote_addr to the true client, which then flows downstream via the
# X-Real-IP / X-Forwarded-For headers already set on each proxy_pass below.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Access log format that surfaces the recovered client IP plus the raw XFF chain.
log_format real_ip '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'xff="$http_x_forwarded_for"';
access_log /var/log/nginx/access.log real_ip;

# -----------------------------------------------------------------------------
# Runtime upstream resolution
# -----------------------------------------------------------------------------
# nginx resolves static `proxy_pass http://name:port` targets once at startup and
# ABORTS if any fails to resolve. With several upstreams that made a single stopped
# container prevent nginx booting at all — which also took Portainer offline,
# since it is only reachable through this proxy.
#
# Using a variable in proxy_pass defers resolution to request time, so nginx
# always starts and returns 502 for whichever upstream is actually down.
# 127.0.0.11 is Docker's embedded DNS server.
resolver 127.0.0.11 valid=10s ipv6=off;

# -----------------------------------------------------------------------------
# Default server: container healthcheck + catch-all
# -----------------------------------------------------------------------------
# Self-contained health endpoint for the container healthcheck. Deliberately does
# NOT proxy to any upstream: nginx's health must reflect nginx, not the frontend.
# The healthcheck used to be `curl -f http://localhost:80/`, and because there was
# no default_server that Host: localhost request fell through to the FIRST server
# block (simonrowe.dev), which proxies to `frontend`. So a stopped frontend made
# nginx report unhealthy; `pinggy` waits on nginx being service_healthy, so the
# tunnel never started and EVERY hostname - the site, api, Portainer, Langfuse and
# Dependency-Track - went offline. That is the exact failure the resolver change
# above was meant to end, in a new shape.
#
# Being default_server does not change which block serves the public
# hostnames below: nginx matches server_name first and only falls back to the
# default server when no server_name matches. This block has server_name _ (a
# name that cannot appear in a real Host header), so it only ever catches
# unmatched hosts.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Unrecognised Host header (scanners hitting the tunnel by IP, etc.): close the
    # connection without a response rather than serving a real vhost by accident.
    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name simonrowe.dev www.simonrowe.dev;

    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.simonrowe.dev;

    # GitHub sends the exact signed bytes to the reviewer API. Keep this route
    # separate from the public backend and do not expose the reviewer's manual API.
    location = /webhooks/github {
        set $upstream_reviewer reviewer-api;
        proxy_pass http://$upstream_reviewer:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    location / {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support (for /ws/chat STOMP endpoint)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name temporal.simonrowe.dev;

    location / {
        set $upstream_temporal_ui temporal-ui;
        proxy_pass http://$upstream_temporal_ui:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name console.simonrowe.dev;

    location / {
        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-API-Key, X-CSRF-TOKEN, cache-control' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        set $upstream_portainer portainer;
        proxy_pass http://$upstream_portainer:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Clear Origin header to prevent Portainer CSRF rejection behind reverse proxy
        proxy_set_header Origin "";

        # Add CORS response headers
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # WebSocket upgrade support (for container console and log streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name langfuse.simonrowe.dev;

    location / {
        set $upstream_langfuse langfuse;
        proxy_pass http://$upstream_langfuse:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name dependency-track.simonrowe.dev;

    # Single hostname split by path: the SPA is configured with
    # API_BASE_URL=https://dependency-track.simonrowe.dev, so its API calls come
    # back to this same origin and must be routed to the apiserver.
    #
    # Note /static/* deliberately falls through to the frontend below - the OIDC
    # callback is a static asset at /static/oidc-callback.html, not an API route.
    location /api/ {
        set $upstream_dt_api dependencytrack-apiserver;
        proxy_pass http://$upstream_dt_api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SBOM uploads from CI are multipart and can exceed nginx's 1m default.
        client_max_body_size 32m;
    }

    location / {
        set $upstream_dt_web dependencytrack-frontend;
        proxy_pass http://$upstream_dt_web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
