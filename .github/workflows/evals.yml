name: Promptfoo Evals

on:
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      elasticsearch:
        image: elasticsearch:8.11.1
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200
      kafka:
        image: bitnami/kafka:3.5
        env:
          KAFKA_CFG_NODE_ID: 0
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: evals/package.json

      - name: Start Spring Boot Backend
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/simonrowe
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          ../gradlew bootRun &
          # Wait for backend to be ready
          timeout 120 bash -c 'while ! curl -s http://localhost:8080/actuator/health | grep "\"status\":\"UP\""; do sleep 5; done'
          
      - name: Seed Local Data
        run: |
          MONGO_CONTAINER=$(docker ps --filter "ancestor=mongo:6.0" -q | head -n 1)
          docker cp evals/seed-data.js $MONGO_CONTAINER:/seed-data.js
          docker exec $MONGO_CONTAINER mongosh simonrowe /seed-data.js
          curl -s -X POST http://localhost:8080/api/admin/data-operations/reembed
          # Wait for re-embed to finish
          timeout 120 bash -c 'while curl -s http://localhost:8080/api/admin/data-operations/status | grep "\"operationInProgress\":true"; do sleep 5; done'
        
      - name: Run Promptfoo Evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd evals
          npm install
          npm run eval
