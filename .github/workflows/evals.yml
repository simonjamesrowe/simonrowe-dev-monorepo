name: Promptfoo Evals

on:
  pull_request:
    branches: [ main ]
    # Advisory job with real cost: it boots the backend against Mongo/ES/Kafka, seeds data,
    # re-embeds, and calls OpenAI. Only run it when the change can plausibly move chat
    # behaviour. Safe as a filter because nothing on main is a required status check, so a
    # skipped run cannot block a PR.
    #
    # Known false negatives, accepted deliberately: chat also reads from blog, events,
    # aggregation, favourites, media and observability, so a retrieval-affecting change
    # there will not trigger these evals. The harness itself depends on the chat WebSocket
    # endpoint and the dataops reembed endpoint, so a change to either can break this job
    # without triggering it. The job is continue-on-error advisory, so a miss costs a signal
    # and never correctness. If that gap ever needs closing, add a scheduled nightly eval
    # run against main — do not grow this list until it matches everything.
    paths:
      - 'backend/src/main/java/com/simonrowe/chat/**'
      - 'backend/src/main/java/com/simonrowe/agents/**'
      - 'backend/src/main/java/com/simonrowe/websearch/**'
      - 'backend/src/main/java/com/simonrowe/webfetch/**'
      - 'backend/src/main/java/com/simonrowe/mcp/**'
      # Direct retrieval inputs, not transitive readers: EmbeddingConfig sets the
      # TokenTextSplitter chunking that produces the retrieved corpus, and SearchService
      # backs a chat tool via mcp/ProfileMcpTools.java.
      - 'backend/src/main/java/com/simonrowe/embedding/**'
      - 'backend/src/main/java/com/simonrowe/search/**'
      - 'backend/src/main/resources/application.yml'
      # Dependency manifests are in scope on purpose: a Spring AI or OpenAI SDK bump is the
      # change most likely to move chat behaviour, and paths: cannot read the diff to
      # distinguish that from a Jackson bump.
      - 'backend/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'evals/**'
      - '.github/workflows/evals.yml'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    # Optional signal only: the AI evals depend on external services and an OpenAI key,
    # so a failure here must not block the PR. Backend and frontend CI remain required.
    continue-on-error: true

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      elasticsearch:
        # Must match the app's ES client major version. Spring Boot 4.1.1 manages
        # elasticsearch-java 9.4.5, and a 9.x client against an 8.x server fails every
        # request with "status: 400 ... Expecting a response body, but none was sent".
        # Historic note from the 8.x days: on 8.11.1 the cluster-health response lacked
        # unassignedPrimaryShards, so the backend health indicator threw and
        # /actuator/health never reported UP.
        image: elasticsearch:9.4.5
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200
      kafka:
        # confluentinc/cp-kafka mirrors the local docker-compose stack; the previous
        # bitnami/kafka:3.5 tag was removed upstream and no longer pulls.
        image: confluentinc/cp-kafka:7.8.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: evals/package.json

      - name: Normalize OpenAI API key
        env:
          RAW_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # A trailing newline/whitespace in the secret yields "Illegal character(s) in
          # message header value" when the key is sent as a Bearer header. Strip whitespace
          # and export for every later step (Spring AI + Embabel + promptfoo all read it).
          CLEAN_KEY="$(printf '%s' "$RAW_OPENAI_API_KEY" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN_KEY"
          echo "OPENAI_API_KEY=$CLEAN_KEY" >> "$GITHUB_ENV"

      - name: Start Spring Boot Backend
        env:
          SPRING_MONGODB_URI: mongodb://localhost:27017/simonrowe
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          # OPENAI_API_KEY comes from the normalize step via $GITHUB_ENV. Both Spring AI
          # (application.yml ${OPENAI_API_KEY}) and the Embabel agent read it; the old
          # SPRING_AI_OPENAI_API_KEY name was consumed by nothing.
        run: |
          cd backend
          ../gradlew bootRun &
          # Wait for backend to be ready. Actuator runs on the management port 8082
          # (management.server.port), not the app port 8080; probing 8080 returns 404 and
          # never matches UP. Startup also runs all Mongock migrations plus Embabel init,
          # so allow a generous budget.
          timeout 300 bash -c 'while ! curl -s http://localhost:8082/actuator/health | grep "\"status\":\"UP\""; do sleep 5; done'
          
      - name: Seed Local Data
        run: |
          # Restore a lightweight slice of real production data (profile, jobs, skills,
          # skill groups, blogs, tags, etc.) so the chat has genuine content to answer
          # from. --drop replaces whatever the startup migrations seeded.
          MONGO_CONTAINER=$(docker ps --filter "ancestor=mongo:6.0" -q | head -n 1)
          docker cp evals/seed/simonrowe $MONGO_CONTAINER:/tmp/seed
          docker exec $MONGO_CONTAINER mongorestore --db simonrowe --drop /tmp/seed
          # Re-embed the restored content into Elasticsearch for retrieval.
          curl -s -X POST http://localhost:8080/api/admin/data-operations/reembed
          # Wait for re-embed to finish
          timeout 180 bash -c 'while curl -s http://localhost:8080/api/admin/data-operations/status | grep "\"operationInProgress\":true"; do sleep 5; done'
        
      - name: Run Promptfoo Evals
        # OPENAI_API_KEY inherited from the normalize step via $GITHUB_ENV.
        run: |
          cd evals
          npm install
          npm run eval
