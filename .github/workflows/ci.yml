name: CI

on:
  pull_request:
    branches: [main]
  # Not redundant with the pull_request trigger, and not here to gate merges — this is
  # what makes Gradle's build cache work at all. `setup-gradle` writes its cache only on
  # the default branch (`cache-read-only: true` everywhere else), and its key is scoped
  # per job id, so a cache written by Publish's `publish-backend` job is not one that
  # CI's `backend` job can read. With CI running on pull_request only, no run ever wrote
  # a cache these jobs could restore: the backend job was falling through its restore
  # keys to the 1.1MB `sbom` entry and recompiling everything from cold every time.
  #
  # Running the same workflow on main gives each job a warm cache of its own to restore,
  # which is what lets an unchanged module report `:backend:test` FROM-CACHE instead of
  # re-running the Testcontainers suite.
  push:
    branches: [main]

permissions:
  contents: read

# A PR that gets three pushes in a row should not leave three full runs racing; only the
# newest commit's result matters. Main is deliberately excluded via the ref in the group
# key — cancelling a main run would abandon the cache write that every PR then restores.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the jobs below a pull request needs; see scripts/changed-areas.sh for the
  # rules. A push to main always builds everything: that run is what writes the Gradle cache
  # every pull request restores, and what gives Static Analysis a whole-project baseline.
  #
  # The skipping is done with job-level `if:`, never with workflow-level `paths:`. Three of
  # these jobs are required checks, and a required check whose workflow never ran is reported
  # as missing, which blocks the merge for ever. A job skipped by `if:` reports as passed.
  #
  # That makes THIS job's failure the dangerous case: a module job skipped because its `needs`
  # failed would ALSO report as passed, and a broken detector would wave every pull request
  # through untested. So each module job runs whenever this job did not succeed - a broken
  # detector costs a full build, never a skipped one.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      factory: ${{ steps.areas.outputs.factory }}
      shell: ${{ steps.areas.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs the pull request's base commit, which a depth-1 checkout lacks.
          # With it missing the script builds everything rather than guessing, which is safe
          # but would quietly make this whole job pointless.
          fetch-depth: 0

      - name: Decide which jobs this change needs
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            scripts/changed-areas.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            printf '%s\n' backend=true frontend=true factory=true shell=true \
              "reason=a push to main builds everything" | tee -a "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Checkstyle
        run: ./gradlew :backend:checkstyleMain :backend:checkstyleTest

      - name: Run tests
        run: ./gradlew :backend:test

      - name: Generate JaCoCo report
        run: ./gradlew :backend:jacocoTestReport

      - name: Verify coverage
        run: ./gradlew :backend:jacocoTestCoverageVerification

      - name: Generate CycloneDX BOM
        run: ./gradlew cyclonedxBom

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/

      - name: Upload CycloneDX BOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-bom
          path: build/reports/

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci occasionally hits transient registry resets (ECONNRESET); retry so a
        # network blip does not fail a required check.
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      # Blocking, and deliberately without --max-warnings. The existing code exits 0
      # with 5 react-refresh/only-export-components warnings; --max-warnings 0 would
      # turn those into a red build, which is an ESLint cleanup, not this change.
      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Consumed by the `sonar` job via sonar.javascript.lcov.reportPaths. Paths in
      # upload-artifact are workspace-relative, so this is frontend/coverage/ despite
      # the job-level working-directory.
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # Two halves with separate triggers: the module's Gradle checks and image build, and the deploy
  # shell tests, which read files from all over the repository and so run for any change that
  # is not documentation. One job rather than two because both are inside the required
  # `Software Factory Build & Test` check, and the shell tests need the Docker daemon this
  # runner already has.
  software-factory:
    name: Software Factory Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.factory == 'true' || needs.changes.outputs.shell == 'true') }}
    env:
      RUN_FACTORY: ${{ needs.changes.result != 'success' || needs.changes.outputs.factory == 'true' }}
      RUN_SHELL: ${{ needs.changes.result != 'success' || needs.changes.outputs.shell == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        if: env.RUN_FACTORY == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: env.RUN_FACTORY == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run software factory checks
        if: env.RUN_FACTORY == 'true'
        run: ./gradlew :software-factory:check

      # Report only — this module has no coverage floor, deliberately. See
      # software-factory/build.gradle.kts and docs/runbooks/static-analysis.md.
      - name: Generate JaCoCo report
        if: env.RUN_FACTORY == 'true'
        run: ./gradlew :software-factory:jacocoTestReport

      - name: Upload software factory coverage report
        if: env.RUN_FACTORY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: software-factory-jacoco-report
          path: software-factory/build/reports/jacoco/

      # Also runs the AOT cache training at the end of Dockerfile.software-factory, which
      # refreshes the whole application context - so a bean that starts contacting a datastore
      # while being created fails HERE, on the pull request, rather than in Publish.
      - name: Build software factory container
        if: env.RUN_FACTORY == 'true'
        run: docker build -f Dockerfile.software-factory -t software-factory:test .

      # The shell side of auto-deploy: restart-prod.sh's phases, sync-config against
      # throwaway git clones, the nginx maintenance/unavailable pages, and the change
      # detector that decides which of these jobs run (scripts/changed-areas.sh).
      #
      # It needs a Docker daemon (the nginx tests run a real nginx:alpine, and sync-config
      # uses `docker compose config --hash`).
      #
      # run-tests.sh exports DRY_RUN=1 for every child, so no test can perform a real
      # restart even if it forgets to set it.
      - name: Run deploy shell tests
        if: env.RUN_SHELL == 'true'
        run: ./scripts/test/run-tests.sh

  # Static analysis for all three modules in one project. See
  # docs/runbooks/static-analysis.md.
  #
  # It is a separate job for two reasons: frontend coverage is only reachable from a
  # Gradle-driven analysis via a cross-job artifact, and this job must not re-run any
  # test suite — coverage arrives as artifacts from the three jobs above.
  #
  # It cannot fail CI, by two independent mechanisms. The step guard skips the
  # analysis while no secret exists, and continue-on-error absorbs any failure once
  # one does. Both matter: a tokenless `./gradlew sonar` was measured at ~10 minutes
  # followed by a hard failure, so a guard that fails open is expensive, not harmless.
  sonar:
    name: Static Analysis
    runs-on: ubuntu-latest
    # All three, not just backend and frontend: this job consumes software-factory's
    # coverage artifact too, and without the dependency it races the producing job.
    needs: [changes, backend, frontend, software-factory]
    # On a pull request, only the modules whose jobs ran produced coverage. That is enough:
    # a pull request analysis grades new code, and a module the change did not touch has none.
    # Skipped outright when nothing that has source changed, and when any job failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.factory == 'true') }}
    continue-on-error: true
    # Job level, NOT step level. A step's `if:` is evaluated before that step's own
    # `env:` block is applied, so the previous step-level form could never evaluate
    # true — which is why this analysis had never run once.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      HAS_BACKEND: ${{ needs.backend.result == 'success' }}
      HAS_FRONTEND: ${{ needs.frontend.result == 'success' }}
      HAS_FACTORY: ${{ needs.software-factory.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.factory == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar attributes new code by SCM blame. The default fetch-depth of 1 has no
          # blame data, which yields silently wrong new-code attribution rather than an
          # error.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # download-artifact restores an artifact's contents, not the path it was
      # uploaded from, so each `path:` reconstructs the location the sonar properties
      # in build.gradle.kts expect.
      - name: Download backend coverage
        if: env.HAS_BACKEND == 'true'
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco

      - name: Download software factory coverage
        if: env.HAS_FACTORY == 'true'
        uses: actions/download-artifact@v4
        with:
          name: software-factory-jacoco-report
          path: software-factory/build/reports/jacoco

      - name: Download frontend coverage
        if: env.HAS_FRONTEND == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Runs unconditionally, including when the analysis below is skipped, so a
      # broken artifact hand-off is visible in the log. A missing coverage report is
      # NOT an analysis error — Sonar reports 0% and carries on — so this is the only
      # thing standing between a silent hand-off breakage and a coverage number that
      # looks real and measures nothing.
      - name: Verify analysis inputs
        # Coverage is required from exactly the modules whose jobs ran: on a push to main that
        # is all three, so a broken hand-off there still fails loudly.
        run: |
          fail=0
          expected="frontend/tsconfig.app.json frontend/src frontend/tests"
          [ "$HAS_BACKEND" = "true" ] && expected="$expected backend/build/reports/jacoco/test/jacocoTestReport.xml"
          [ "$HAS_FACTORY" = "true" ] && expected="$expected software-factory/build/reports/jacoco/test/jacocoTestReport.xml"
          [ "$HAS_FRONTEND" = "true" ] && expected="$expected frontend/coverage/lcov.info"
          for p in $expected
          do
            if [ -s "$p" ] || [ -d "$p" ]; then
              echo "  ok   $p"
            else
              echo "  MISS $p"
              fail=1
            fi
          done
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "  MISS full git history - new-code attribution will be wrong"
            fail=1
          else
            echo "  ok   full git history"
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::A Sonar analysis input is missing. Coverage would silently report 0%."
            exit 1
          fi
          echo "All analysis inputs present."

      # `classes testClasses` is required and explicit: sonar-java analyses bytecode,
      # and the `sonar` task pulls in no compile tasks of its own (verified with
      # --dry-run). Never `./gradlew build sonar` — that re-runs the Testcontainers
      # suite, duplicating the slowest work in CI.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: ./gradlew classes testClasses sonar
