name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# One Publish at a time, never cancelled. An image left unchanged is published by re-tagging
# the previous commit's image (see the `changes` job), so a run must not start until the run
# for the commit before it has finished pushing. GitHub keeps at most one run pending per group
# and cancels an older pending one when a newer arrives; that is safe, because the newer run
# then finds no image for the cancelled commit and rebuilds rather than re-tags.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Decides which images this merge has to rebuild; see scripts/changed-areas.sh.
  #
  # Every image is still published under this commit's SHA on every run, because the deployer
  # pulls `:<sha>` for all three (restart-prod.sh's `pull` phase) and must keep doing so. An
  # unchanged image gets the tag by a registry-side re-tag of the previous commit's image -
  # seconds, no pull - and because its image id is unchanged, the deploy's `up -d` leaves that
  # container running. A frontend-only merge no longer restarts the backend.
  #
  # The comparison is with the commit before this push (`github.event.before`), and a re-tag
  # needs that commit's image to exist. When it does not - its Publish failed or was cancelled
  # - the job rebuilds instead, which is what makes skipping safe: an image is only ever reused
  # from a commit whose own Publish produced it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.image_backend }}
      frontend: ${{ steps.areas.outputs.image_frontend }}
      factory: ${{ steps.areas.outputs.image_factory }}
      reader: ${{ steps.areas.outputs.image_reader }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs the previous commit; a push can carry more than one.
          fetch-depth: 0

      - name: Decide which images this merge rebuilds
        id: areas
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/changed-areas.sh "$BEFORE" "$AFTER" | tee -a "$GITHUB_OUTPUT"

  publish-backend:
    name: Publish Backend Image
    runs-on: ubuntu-24.04-arm
    needs: changes
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-backend
      # Unknown when the detector itself failed, and an unknown answer means rebuild.
      CHANGED: ${{ needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' }}
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the previous commit's image
        id: retag
        if: env.CHANGED != 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/ci/retag-image.sh "$IMAGE" "$BEFORE" "$AFTER" | tee -a "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        if: env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true'
        uses: gradle/actions/setup-gradle@v4

      # Also performs the AOT cache training run: the buildpack starts the app with the
      # aot-training profile and -Dspring.context.exit=onRefresh. See backend/build.gradle.kts.
      - name: Build backend image
        if: env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true'
        run: ./gradlew :backend:bootBuildImage --imageName="$IMAGE:${{ github.sha }}"

      # The AOT training run activates the aot-training profile through the BUILD environment,
      # and that profile replaces the site's Elasticsearch vector store with an in-memory one.
      # Build-time variables are not persisted into a buildpack image, but this is the one
      # property where being wrong would silently empty site search in production, so it is
      # checked on the artifact rather than trusted. The cache itself is checked too: without
      # it the image still works, just slowly, and nothing else would notice.
      - name: Assert the image carries the AOT cache and not the training profile
        if: env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true'
        run: |
          set -euo pipefail
          if docker inspect "$IMAGE:${{ github.sha }}" --format '{{json .Config.Env}}' \
              | grep -q 'SPRING_PROFILES_ACTIVE'; then
            echo "::error::The backend image sets SPRING_PROFILES_ACTIVE; the aot-training profile must never reach a running container"
            exit 1
          fi
          docker run --rm --entrypoint test "$IMAGE:${{ github.sha }}" -s /workspace/application.aot \
            || { echo "::error::The backend image has no AOT cache at /workspace/application.aot"; exit 1; }

      - name: Push backend image
        if: env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  publish-frontend:
    name: Publish Frontend Image
    runs-on: ubuntu-24.04-arm
    needs: changes
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-frontend
      CHANGED: ${{ needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true' }}
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the previous commit's image
        id: retag
        if: env.CHANGED != 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/ci/retag-image.sh "$IMAGE" "$BEFORE" "$AFTER" | tee -a "$GITHUB_OUTPUT"

      # github.event.head_commit.timestamp is only populated for push events. This
      # workflow currently only triggers on push, but git log matches the backend
      # buildInfo block's semantics exactly (the commit time, not "when the event
      # fired") and keeps working if a workflow_dispatch trigger is ever added here.
      - name: Resolve build time
        id: build-time
        if: env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true'
        run: echo "value=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        if: env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-frontend:latest
            ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=https://api.simonrowe.dev
            VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
            VITE_AMPLITUDE_API_KEY=${{ secrets.VITE_AMPLITUDE_API_KEY }}
            VITE_COPARENT_AUTH0_CLIENT_ID=${{ secrets.VITE_COPARENT_AUTH0_CLIENT_ID }}
            VITE_COPARENT_AUTH0_AUDIENCE=https://api.simonrowe.dev
            VITE_COPARENT_CANONICAL_ORIGIN=https://coparents.simonrowe.dev
            VITE_GIT_SHA=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.build-time.outputs.value }}

  # software-factory and page-reader run on two hosts with different CPUs: the software factory
  # and page-reader on the amd64 NUC, the Pi's `deployer` (the same software-factory image) on
  # the arm64 Pi. So these two images are published as ONE multi-platform index under each tag,
  # and `docker pull <image>:<sha>` resolves the right platform on each host.
  #
  # Each platform is built NATIVELY on its own runner, never emulated or cross-built: the
  # software-factory image trains its Leyden AOT cache during the build (a cache trained on one
  # CPU is not valid on another; see aot-cache-class-data-only in CLAUDE.md), and
  # Dockerfile.page-reader keeps only the build machine's own Temporal native bridge and
  # Playwright's Chromium for it. An amd64 layer built on an arm64 runner would carry arm64
  # binaries.
  #
  # Three jobs per image:
  #   *-plan   decides ONCE whether to rebuild, re-tagging the previous commit's index when
  #            nothing changed. Deciding per platform could let one platform re-tag while the
  #            other rebuilds, and the two halves could not then be published as one index.
  #   *-build  one leg per platform, each pushing its image by digest only (no tag), and
  #            handing the digest on as an artifact.
  #   publish-* creates the index from both digests under `:<sha>` and `:latest`, then asserts
  #            that whatever is under `:<sha>` - built or re-tagged - serves both platforms.
  #            It keeps the job id the rest of the workflow `needs:`.
  #
  # The re-tag requires the previous image to be an index of BOTH platforms (the PLATFORMS
  # argument to retag-image.sh). Without that, the first merge after this change that did not
  # touch the factory would re-tag the last arm64-only image, and the NUC could not pull it.
  software-factory-plan:
    name: Plan Software Factory Image
    runs-on: ubuntu-latest
    needs: changes
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-software-factory
      PLATFORMS: linux/arm64,linux/amd64
      CHANGED: ${{ needs.changes.result != 'success' || needs.changes.outputs.factory == 'true' }}
    if: ${{ !cancelled() }}
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the previous commit's image
        id: retag
        if: env.CHANGED != 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/ci/retag-image.sh "$IMAGE" "$BEFORE" "$AFTER" "$PLATFORMS" | tee -a "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          BUILD: ${{ env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true' }}
        run: echo "build=$BUILD" | tee -a "$GITHUB_OUTPUT"

  software-factory-build:
    name: Build Software Factory Image (${{ matrix.arch }})
    needs: software-factory-plan
    if: ${{ !cancelled() && needs.software-factory-plan.result == 'success' && needs.software-factory-plan.outputs.build == 'true' }}
    strategy:
      # One platform's image alone cannot be published, so there is no point finishing the
      # other once one has failed.
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-software-factory
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .dockerignore excludes .git/ from the build context on purpose (shipping full repo
      # history into an image that gets published is the wrong trade), so
      # software-factory/build.gradle.kts's buildInfo block cannot read it from inside the
      # Docker build the way backend's bootBuildImage reads it directly on the runner. Resolve
      # it here instead and pass it in as build-args below. The delimited form for `subject`
      # guards against a commit subject containing characters that would otherwise break a
      # plain KEY=VALUE line written to GITHUB_OUTPUT. Both legs resolve the same commit, so
      # both platforms report the same build metadata.
      - name: Resolve commit metadata
        id: commit-meta
        run: |
          {
            echo "time=$(git log -1 --format=%ct)"
            echo "subject<<COMMIT_SUBJECT_EOF"
            git log -1 --format=%s
            echo "COMMIT_SUBJECT_EOF"
          } >> "$GITHUB_OUTPUT"

      # The docker-container builder this sets up is what can push by digest.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pushed by digest with no tag: `:<sha>` must only ever name the finished two-platform
      # index, never one half of it. `provenance`/`sbom` are off so each leg pushes a plain
      # image manifest, as the old single-runner build did, and the index carries exactly the
      # two platform images (the SBOMs Dependency-Track reads are generated by trivy below).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.software-factory
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_COMMIT_TIME=${{ steps.commit-meta.outputs.time }}
            GIT_COMMIT_SUBJECT=${{ steps.commit-meta.outputs.subject }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::The build reported no digest ('$DIGEST')"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: software-factory-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish-software-factory:
    name: Publish Software Factory Image
    runs-on: ubuntu-latest
    needs: [software-factory-plan, software-factory-build]
    # Runs when the plan re-tagged (the build legs are skipped) or both legs succeeded. A failed
    # plan or leg skips it, and with it everything that `needs:` this job.
    if: ${{ !cancelled() && needs.software-factory-plan.result == 'success' && (needs.software-factory-plan.outputs.build != 'true' || needs.software-factory-build.result == 'success') }}
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-software-factory
      BUILD: ${{ needs.software-factory-plan.outputs.build }}
    outputs:
      scan-digest: ${{ steps.assert.outputs.scan-digest }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download the digests
        if: env.BUILD == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: software-factory-digest-*
          merge-multiple: true

      # Copies manifests within the registry; no layers move. The digest files are named by
      # platform rather than by digest so the order in the index is fixed (arm64, then amd64)
      # and a missing leg fails here by name instead of producing a one-platform index.
      - name: Create the multi-platform index
        if: env.BUILD == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"
          docker buildx imagetools create \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$(cat arm64)" \
            "$IMAGE@$(cat amd64)"

      # Checked on the published artifact, on both paths: a re-tag that somehow carried one
      # platform, or an index assembled from one leg, would otherwise surface only as a pull
      # failure on one host at deploy time. Also hands the sbom job the amd64 manifest to scan.
      - name: Assert the image serves both platforms
        id: assert
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_SHA")"
          for arch in arm64 amd64; do
            jq -e --arg a "$arch" 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $a)' \
              <<<"$raw" >/dev/null \
              || { echo "::error::$IMAGE:$GITHUB_SHA has no linux/$arch image"; exit 1; }
          done
          digest="$(jq -r 'first(.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest)' <<<"$raw")"
          echo "scan-digest=$digest" | tee -a "$GITHUB_OUTPUT"

  # The page-reader: Node, Playwright's headless Chromium, and a Temporal activity worker. It
  # runs on the amd64 NUC; arm64 is still built so the Pi can run it until the move is proven.
  # Same three-job shape as the software-factory image above, for the same reasons. It carries
  # no build metadata yet, so the status page lists it as a floating `latest` image.
  page-reader-plan:
    name: Plan Page Reader Image
    runs-on: ubuntu-latest
    needs: changes
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-page-reader
      PLATFORMS: linux/arm64,linux/amd64
      CHANGED: ${{ needs.changes.result != 'success' || needs.changes.outputs.reader == 'true' }}
    if: ${{ !cancelled() }}
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag the previous commit's image
        id: retag
        if: env.CHANGED != 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: scripts/ci/retag-image.sh "$IMAGE" "$BEFORE" "$AFTER" "$PLATFORMS" | tee -a "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          BUILD: ${{ env.CHANGED == 'true' || steps.retag.outputs.retagged != 'true' }}
        run: echo "build=$BUILD" | tee -a "$GITHUB_OUTPUT"

  page-reader-build:
    name: Build Page Reader Image (${{ matrix.arch }})
    needs: page-reader-plan
    if: ${{ !cancelled() && needs.page-reader-plan.result == 'success' && needs.page-reader-plan.outputs.build == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-page-reader
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.page-reader
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::The build reported no digest ('$DIGEST')"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: page-reader-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish-page-reader:
    name: Publish Page Reader Image
    runs-on: ubuntu-latest
    needs: [page-reader-plan, page-reader-build]
    if: ${{ !cancelled() && needs.page-reader-plan.result == 'success' && (needs.page-reader-plan.outputs.build != 'true' || needs.page-reader-build.result == 'success') }}
    env:
      IMAGE: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-page-reader
      BUILD: ${{ needs.page-reader-plan.outputs.build }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download the digests
        if: env.BUILD == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: page-reader-digest-*
          merge-multiple: true

      - name: Create the multi-platform index
        if: env.BUILD == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/digests"
          docker buildx imagetools create \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$(cat arm64)" \
            "$IMAGE@$(cat amd64)"

      - name: Assert the image serves both platforms
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_SHA")"
          for arch in arm64 amd64; do
            jq -e --arg a "$arch" 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == $a)' \
              <<<"$raw" >/dev/null \
              || { echo "::error::$IMAGE:$GITHUB_SHA has no linux/$arch image"; exit 1; }
          done

  sbom:
    name: Publish SBOMs to Dependency-Track
    runs-on: ubuntu-latest
    needs: [publish-backend, publish-frontend, publish-software-factory]
    # Never block a deploy on Dependency-Track being reachable. It runs on a
    # Raspberry Pi behind a tunnel and may be down, rebooting, or saturated
    # mid-analysis; none of that should fail a production release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate backend SBOM
        run: ./gradlew cyclonedxBom

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend SBOM
        working-directory: frontend
        run: npm run sbom

      # The three image SBOMs are generated by TRIVY, not syft, and that is load-bearing -
      # do not "simplify" it back to anchore/sbom-action.
      #
      # Dependency-Track's Trivy analyzer resolves an OS package's *source* package from
      # the `aquasecurity:trivy:SrcName` component property, falling back to the purl's
      # (binary) name when it is absent (TrivyVulnAnalyzer.processOsPackage). Only Trivy
      # emits that property. syft records the same fact as an `upstream=` purl qualifier,
      # which Dependency-Track does not read - so with a syft SBOM every OS advisory is
      # looked up under `libssl3` instead of `openssl` and matches nothing.
      #
      # Measured against one trivy server, same image, 2026-08-31:
      #   trivy-generated SBOM -> 20 findings (2 HIGH), all with fixes
      #   syft-generated SBOM  ->  0 findings
      # It also drops ~93% of the components: syft emitted 1283 for the frontend image
      # (1211 of them purl-less `type: file` entries, unanalysable by anything) against
      # trivy's 72, while finding FEWER real packages (601 vs 301 jars on the backend
      # image). See docs/runbooks/dependency-track.md.
      #
      # Registry credentials go in TRIVY_USERNAME/TRIVY_PASSWORD - the action exposes no
      # input for them - because the ghcr packages are not necessarily public. The backend
      # and frontend images are single-manifest arm64 (built on ubuntu-24.04-arm) and this
      # job runs on amd64; no `--platform` is needed for them, because with no platform index
      # there is no choice to make, and trivy inspects the image via the registry rather than
      # running it. The software-factory image IS a two-platform index, so its step scans one
      # platform explicitly - see that step.
      # `version` is pinned to match the trivy-server in docker-compose.prod.yml.
      - name: Generate backend image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-backend:${{ github.sha }}
          format: cyclonedx
          output: backend-image-bom.json

      - name: Generate frontend image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-frontend:${{ github.sha }}
          format: cyclonedx
          output: frontend-image-bom.json

      # The software-factory image is an index of linux/arm64 and linux/amd64, and only ONE
      # platform is scanned: the linux/amd64 manifest, addressed by its own digest (handed on
      # by publish-software-factory, read from the published index). By digest rather than by
      # tag plus a platform option, so the choice is explicit in the reference itself and
      # trivy sees a single manifest exactly as it did before the image went multi-arch.
      # amd64 because that is where the software factory itself runs (the NUC); the arm64
      # half is the same Dockerfile from the same package snapshot, so its findings match
      # apart from per-architecture builds of the same versions. The Dependency-Track
      # project stays one project, `simonrowe-dev/software-factory-image`.
      - name: Generate software factory image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-software-factory@${{ needs.publish-software-factory.outputs.scan-digest }}
          format: cyclonedx
          output: software-factory-image-bom.json

      # Each upload is individually continue-on-error so that one unreachable upload does not
      # skip the remaining uploads - otherwise a single blip leaves later SBOMs never even
      # attempted, and the summary below can only report "skipped" for them. The job-level
      # continue-on-error above still guarantees none of this can fail a release.
      - name: Upload backend dependency SBOM
        id: upload-backend-dep
        continue-on-error: true
        uses: DependencyTrack/gh-upload-sbom@v4.1.0
        with:
          serverhostname: dependency-track.simonrowe.dev
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: simonrowe-dev/backend
          projectversion: main
          bomfilename: build/reports/bom.json
          autocreate: true

      - name: Upload frontend dependency SBOM
        id: upload-frontend-dep
        continue-on-error: true
        uses: DependencyTrack/gh-upload-sbom@v4.1.0
        with:
          serverhostname: dependency-track.simonrowe.dev
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: simonrowe-dev/frontend
          projectversion: main
          bomfilename: frontend/bom.json
          autocreate: true

      # Trivy emits CycloneDX **1.7** and has no flag to emit anything else, while
      # Dependency-Track 5.0.3 ingests 1.6 at most and rejects anything newer outright:
      #   PUT /api/v1/bom -> 400 {"title":"The uploaded BOM is invalid",
      #                           "detail":"Unrecognized specVersion 1.7"}
      # (1.7 ingest landed upstream in Dependency-Track 5.1.0, DependencyTrack/
      # dependency-track#6703; drop this step once production is past that version.)
      #
      # This is why the two dependency uploads above have always succeeded while all three
      # image uploads have 400'd on every run since they were added: `npm run sbom` pins
      # `--spec-version 1.6` and the Gradle plugin emits 1.6, so only the trivy-generated
      # BOMs are affected. Every image project in Dependency-Track therefore sat on its last
      # syft-era BOM - the very data the trivy switch exists to replace - while the run page
      # showed a green tick.
      #
      # The downgrade is lossless for everything Dependency-Track reads. Measured on this
      # repo's own images: identical component count, identical purls, all
      # `aquasecurity:trivy:SrcName` properties (the whole reason for using trivy) intact,
      # dependency graph and the `operating-system` component preserved. The only diff is
      # the version fields plus dropped empty `dependsOn: []` / `vulnerabilities: []` -
      # trivy populates no 1.7-only field at all, so nothing is lost in translation.
      - name: Convert the image SBOMs to CycloneDX 1.6
        run: |
          set -euo pipefail
          for f in backend-image-bom.json frontend-image-bom.json software-factory-image-bom.json; do
            # The output file keeps the .json extension on purpose: cyclonedx-cli infers the
            # output *format* from the filename and exits with "Unable to auto-detect output
            # format from output filename" for anything else.
            docker run --rm -v "$PWD:/w" cyclonedx/cyclonedx-cli:0.33.1 \
              convert --input-file "/w/$f" --output-file "/w/converted-$f" --output-version v1_6
            mv "converted-$f" "$f"
          done

      # An empty or `{}` BOM uploads successfully and reads as "the image has no
      # components", which on the Projects page is indistinguishable from a clean scan -
      # the exact class of silent failure this whole change is about. Fail here instead of
      # replacing good data with an empty BOM.
      #
      # Placed HERE, after the two dependency uploads and before the three image uploads,
      # rather than next to the generators: a failing step skips every step after it, so
      # asserting earlier would let a trivy hiccup also stale the Maven and npm data it has
      # nothing to do with. Deliberately NOT continue-on-error - stopping the image uploads
      # is the entire point. It runs after the conversion above for the same reason: a
      # conversion that silently emptied a BOM must not reach Dependency-Track either.
      - name: Assert the image SBOMs are not empty
        run: |
          set -euo pipefail
          for f in backend-image-bom.json frontend-image-bom.json software-factory-image-bom.json; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
            spec=$(jq -r '.specVersion' "$f")
            n=$(jq '[.components[]? | select(.purl)] | length' "$f")
            src=$(jq '[.components[]? | select(.properties[]? | .name == "aquasecurity:trivy:SrcName")] | length' "$f")
            echo "$f: CycloneDX $spec, $n components with a purl, $src with a trivy SrcName"
            [ "$spec" = "1.6" ] || { echo "::error::$f declares CycloneDX $spec; Dependency-Track 5.0.3 rejects anything above 1.6"; exit 1; }
            [ "$n" -ge 20 ] || { echo "::error::$f has only $n components with a purl"; exit 1; }
          done

      - name: Upload backend image SBOM
        id: upload-backend-image
        continue-on-error: true
        uses: DependencyTrack/gh-upload-sbom@v4.1.0
        with:
          serverhostname: dependency-track.simonrowe.dev
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: simonrowe-dev/backend-image
          projectversion: main
          bomfilename: backend-image-bom.json
          autocreate: true

      - name: Upload frontend image SBOM
        id: upload-frontend-image
        continue-on-error: true
        uses: DependencyTrack/gh-upload-sbom@v4.1.0
        with:
          serverhostname: dependency-track.simonrowe.dev
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: simonrowe-dev/frontend-image
          projectversion: main
          bomfilename: frontend-image-bom.json
          autocreate: true

      - name: Upload software factory image SBOM
        id: upload-software-factory-image
        continue-on-error: true
        uses: DependencyTrack/gh-upload-sbom@v4.1.0
        with:
          serverhostname: dependency-track.simonrowe.dev
          apikey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectname: simonrowe-dev/software-factory-image
          projectversion: main
          bomfilename: software-factory-image-bom.json
          autocreate: true

      # This job is continue-on-error, so the workflow shows a green tick even when every
      # upload failed. Without an explicit report, a silent failure is indistinguishable from
      # success at a glance. Write every upload outcome into the job summary so the
      # answer is visible on the run page without opening any logs.
      - name: Report SBOM upload outcomes
        if: always()
        env:
          BACKEND_DEP: ${{ steps.upload-backend-dep.outcome }}
          FRONTEND_DEP: ${{ steps.upload-frontend-dep.outcome }}
          BACKEND_IMAGE: ${{ steps.upload-backend-image.outcome }}
          FRONTEND_IMAGE: ${{ steps.upload-frontend-image.outcome }}
          FACTORY_IMAGE: ${{ steps.upload-software-factory-image.outcome }}
        run: |
          failed=0
          for outcome in "$BACKEND_DEP" "$FRONTEND_DEP" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$FACTORY_IMAGE"; do
            [ "$outcome" = "success" ] || failed=$((failed + 1))
          done

          if [ "$failed" -eq 0 ]; then
            verdict="✅ All 5 SBOMs uploaded to Dependency-Track."
          else
            verdict="⚠️ $failed of 5 SBOM uploads did NOT succeed. This job is continue-on-error, so the workflow still reports success - the release is fine, but Dependency-Track is now stale. See docs/runbooks/dependency-track.md (\"Manual SBOM upload\")."
          fi

          # Also log it, so it is greppable in the raw job output.
          echo "backend dependencies : $BACKEND_DEP"
          echo "frontend dependencies: $FRONTEND_DEP"
          echo "backend image        : $BACKEND_IMAGE"
          echo "frontend image       : $FRONTEND_IMAGE"
          echo "software factory img : $FACTORY_IMAGE"
          echo "$verdict"

          {
            echo "### Dependency-Track SBOM uploads"
            echo
            echo "| SBOM | Dependency-Track project | Outcome |"
            echo "| --- | --- | --- |"
            echo "| Backend dependencies | \`simonrowe-dev/backend\` | $BACKEND_DEP |"
            echo "| Frontend dependencies | \`simonrowe-dev/frontend\` | $FRONTEND_DEP |"
            echo "| Backend image | \`simonrowe-dev/backend-image\` | $BACKEND_IMAGE |"
            echo "| Frontend image | \`simonrowe-dev/frontend-image\` | $FRONTEND_IMAGE |"
            echo "| Software factory image | \`simonrowe-dev/software-factory-image\` | $FACTORY_IMAGE |"
            echo
            echo "$verdict"
            echo
            echo "An empty outcome means the step never ran (an earlier step in this job failed);"
            echo "\`skipped\` likewise means no upload was attempted."
          } >> "$GITHUB_STEP_SUMMARY"
