<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15120f" />
    <meta name="robots" content="noindex" />
    <title>Meals</title>
    <link rel="manifest" href="/meals.webmanifest" />
    <link rel="icon" href="/meals-logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/meals-favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/meals-apple-touch-icon.png" sizes="180x180" />
    <!--
      Applies the stored theme before first paint, as the main site and Term Time do, sharing
      their `theme-preference` key. Inline and duplicated rather than imported: a module runs
      after the first paint, which is the flash this exists to prevent.
    -->
    <script>
      (function() {
        var s = null;
        try { s = localStorage.getItem('theme-preference'); } catch (e) {}
        if (s !== 'light' && s !== 'dark') {
          s = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (s === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#faf6f1');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/meals/main.tsx"></script>
  </body>
</html>
