<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Term Time — Kilmorie Primary School questions</title>
    <meta
      name="description"
      content="Ask about term dates, INSET days, clubs and school arrangements at Kilmorie Primary School. Unofficial."
    />
    <link rel="icon" href="/favicon.ico" />
    <!--
      Applies the stored theme before first paint. Without this the page renders dark and then
      flips to light, which is the flash the main site's entry avoids the same way. Kept inline
      and duplicated rather than imported: a module would run after the first paint, which is
      exactly the thing this exists to prevent.
    -->
    <script>
      (function() {
        var s = localStorage.getItem('theme-preference');
        if (s !== 'light' && s !== 'dark') {
          if (s !== null) localStorage.removeItem('theme-preference');
          s = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (s === 'light') document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/school/main.tsx"></script>
  </body>
</html>
