server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly. The stock nginx:alpine image includes
    # ngx_http_gzip_module, so this needs no extra build steps or modules.
    # (Brotli would shave another ~15% but requires a brotli-enabled image.)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share links. The backend serves /s/{slug} as an Open Graph document to every
    # client — crawlers do not run JS, so this must not fall through to the SPA.
    #
    # NOTE: this file is bind-mounted from the deploy directory in production, not baked
    # into the frontend image, so pulling a new image alone does not apply this block.
    # A normal deploy picks it up (sync-config fast-forwards the checkout and frontend is
    # in the recreate allowlist), but verify with an explicit
    # `curl -i https://simonrowe.dev/s/<known-slug>` rather than assuming — getting the
    # SPA's HTML back means every link already shared is unfurling as the bare site title.
    location /s/ {
        proxy_pass http://backend:8080/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable-HTTP endpoint. The SPA route /mcp and the backend endpoint
    # share this path: a browser navigating to /mcp issues a GET for HTML, which
    # must serve the SPA, while the in-browser MCP client POSTs JSON-RPC to the
    # backend. Branch on method. Responses may be framed as text/event-stream, so
    # buffering is off to stream them through without stalling.
    location = /mcp {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8080/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames under /assets/, so they can be
    # cached forever. New deploys produce new hashes and bust the cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must revalidate so new deploys are picked up immediately.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
