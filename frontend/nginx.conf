# Resolve `backend` per request, not once at boot. nginx resolves a STATIC
# `proxy_pass http://backend:8080` a single time when it loads this file and keeps that IP
# for the life of the process. The backend gets a new IP whenever its container is
# recreated or restarted into a different address, so this container went on proxying to
# the old one: on 2026-09-29 the backend restarted at 04:14 UTC and every /uploads/, /api/
# and /s/ request through www 502'd — every image on the site, while api.simonrowe.dev,
# which the outer proxy already resolves at runtime (62d26cc), served the same files fine.
#
# Naming the upstream through a variable is what makes nginx consult the resolver. It
# changes one other thing, and it is why no proxy_pass below carries a URI: with a
# variable upstream a URI is passed LITERALLY instead of replacing the matched prefix, so
# `proxy_pass http://$upstream_backend:8080/api/;` would send every API call as a bare
# `/api/`. With no URI the original request path is passed unchanged, which is what every
# location here wants anyway (scripts/test/test-nginx-proxy-pass-uri.sh guards both).
# 127.0.0.11 is Docker's embedded DNS server.
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $spa_index {
    default /index.html;
    coparents.simonrowe.dev /coparent/index.html;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly. The stock nginx:alpine image includes
    # ngx_http_gzip_module, so this needs no extra build steps or modules.
    # (Brotli would shave another ~15% but requires a brotli-enabled image.)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    location /api/ {
        client_max_body_size 12m;
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share links. The backend serves /s/{slug} as an Open Graph document to every
    # client — crawlers do not run JS, so this must not fall through to the SPA.
    #
    # This file ships INSIDE the frontend image (Dockerfile.frontend), so this block
    # travels with the bundle it routes for. It did not always: production also
    # bind-mounted this file from the deploy checkout, which shadowed the image's copy,
    # and this route spent its first day live returning the SPA's 404 for every shared
    # link. The mount is gone; see the `frontend` service in docker-compose.prod.yml.
    #
    # Still worth an explicit `curl -i https://simonrowe.dev/s/<known-slug>` after a deploy:
    # getting the SPA's HTML back means every link already shared is unfurling as the bare
    # site title, and nothing else reports that.
    location /s/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable-HTTP endpoint. The SPA route /mcp and the backend endpoint
    # share this path: a browser navigating to /mcp issues a GET for HTML, which
    # must serve the SPA, while the in-browser MCP client POSTs JSON-RPC to the
    # backend. Branch on method. Responses may be framed as text/event-stream, so
    # buffering is off to stream them through without stalling.
    location = /mcp {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /ws/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /uploads/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames under /assets/, so they can be
    # cached forever. New deploys produce new hashes and bust the cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Term Time, the school assistant. A second Vite entry point in the same bundle, so it
    # ships in this image alongside the main site and needs no container of its own.
    #
    # This block exists purely because `location /` below ends in `try_files ... /index.html`,
    # which would serve the MAIN app's HTML for every /school/* path — the school app would
    # never load and the only symptom would be the portfolio site appearing at the wrong URL.
    #
    # No /school/assets/ rule is needed: a multi-page Vite build emits both bundles' hashed
    # files into the shared /assets/, which the immutable-cache block above already covers.
    # `location /school/` does NOT match a request for bare `/school` — nginx prefix matching
    # is literal, so without this redirect that path falls through to `location /` and serves
    # the MAIN site's index.html. A visitor typing simonrowe.dev/school would get the portfolio,
    # and more sharply: the Auth0 callback lands on this exact path, so sign-in would return to
    # the wrong application and appear to fail.
    location = /school {
        return 301 /school/;
    }

    location /school/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /school/index.html;
    }

    # Host-aware SPA entry point. CoParent owns the root of its production hostname,
    # while the same image continues to serve the portfolio from every other host.
    location = / {
        add_header Cache-Control "no-cache";
        try_files $spa_index =404;
    }

    location / {
        # index.html must revalidate so new deploys are picked up immediately.
        add_header Cache-Control "no-cache";
        try_files $uri $spa_index;
    }
}
