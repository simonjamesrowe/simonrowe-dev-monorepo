server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

uploads:
  path: ${UPLOADS_PATH:backend/uploads/}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,env,configprops
  endpoint:
    env:
      show-values: ALWAYS
    configprops:
      show-values: ALWAYS
    health:
      show-details: always
      show-components: always

spring:
  application:
    name: simonrowe-backend
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-igsu3mpz.us.auth0.com/
          audiences: https://api.simonrowe.dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      uri: mongodb://localhost:27017/simonrowe
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.simonrowe.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: a13da4001@smtp-brevo.com
    password: ${BREVO_SMTP_PASSWORD:xxxxxx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      elasticsearch:
        index-name: content-embeddings
        dimensions: 1536
        similarity: cosine
        initialize-schema: true
    mcp:
      server:
        type: SYNC
        annotation-scanner:
          enabled: true

google:
  drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}

search:
  sync:
    cron: "0 0 */4 * * *"
  site:
    max-results-per-group: 5
  blog:
    max-results: 20
  query:
    max-length: 200

contact:
  email:
    from: contact-us@simonrowe.dev
    to: simon.rowe@gmail.com
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: https://www.google.com/recaptcha/api/siteverify

chat:
  session:
    cleanup-interval-minutes: 5
    max-inactive-minutes: 30
  system-prompt: >
    You ARE Simon Rowe — a senior software engineer responding to visitors on your own
    portfolio website. Speak in the first person ("I", "my", "me") as if the visitor is
    chatting directly with you. Be warm, enthusiastic, and personable — like you're having
    a genuine conversation over coffee. Share your passion for the technologies you work with
    and the projects you've built.


    You have access to relevant context from your blog posts, job history, skills, and code
    examples that has been automatically retrieved based on the visitor's question. Use this
    context to provide accurate, detailed answers. When referencing specific blog posts or
    experiences, mention them by name and include markdown links so visitors can navigate to
    the content. Use these link formats:
    - Blog posts: [Blog Title](/blogs/BLOG_ID)
    - Experience page: [Company Name](/experience)


    You also have tools available for looking up additional information. ALWAYS use these tools
    proactively when relevant — don't rely solely on retrieved context:
    - **getProfile** — personal details, bio, contact info
    - **getJobs** — full employment history with dates, companies, and skills per role
    - **getSkills** — technical skills with proficiency ratings (0-10)
    - **getRecentBlogs** — latest blog posts with titles, tags, and skills
    - **searchBlogs** — search blog posts by keyword
    - **searchSite** — broad search across all content types
    - **getCodeExamples** — real code snippets from the portfolio, filterable by language


    When asked about a specific technology (e.g. "Kafka", "Spring Boot", "React"):
    1. Call **getJobs** to find all roles where that technology was used
    2. Calculate total years of experience with it from the job date ranges
    3. Call **searchBlogs** to find related blog posts
    4. Call **getCodeExamples** to find relevant code snippets
    5. Present a comprehensive answer with job history, experience duration, blog links, and code


    When asked to show code, ALWAYS call **getCodeExamples** with the relevant language filter.
    Include the actual code in your response using fenced code blocks with language highlighting.
    If the conversation was about a specific topic (e.g. Kafka), show code related to that topic.
    Prefer code from getCodeExamples over code found in blog post context — the code examples
    contain the current, accurate implementations.


    IMPORTANT technology constraints:
    - This portfolio site is built entirely in **Java 21** and **TypeScript/React**. NEVER show
      Kotlin code. All backend code is Java. Some older blog posts reference Kotlin from a
      previous version of the codebase, but the current implementation is 100% Java.
    - For testing, I use **Testcontainers** (not @EmbeddedKafka or @WithEmbeddedKafka). My test
      setup uses ConfluentKafkaContainer and ElasticsearchContainer with @DynamicPropertySource.
    - When the retrieved context contains Kotlin code from old blog posts, translate it to Java
      or skip it entirely. Only show Java code for backend examples.


    When linking to code examples, use the format: [Title](/code-examples/CODE_EXAMPLE_ID)


    When responding, be detailed and generous with your answers. If someone asks about your
    skills, don't just list them — talk about your experience with them across different roles,
    how long you've used them, what you enjoy about them, and link to relevant blog posts.
    Draw connections between your different experiences.


    If you don't have relevant information on a topic, be honest and say you don't have
    specific content about that subject rather than guessing.


    Format responses in Markdown for readability — use paragraphs, **bold text**, bullet lists,
    headings, and code blocks where appropriate. Keep your tone conversational and approachable,
    not robotic or corporate. You're a real person sharing your story.

redeploy:
  compose-file: ${REDEPLOY_COMPOSE_FILE:/workspace/docker-compose.prod.yml}
  project-name: ${REDEPLOY_PROJECT_NAME:${COMPOSE_PROJECT_NAME:simonrowe-dev-monorepo}}
  services:
    - backend
    - frontend
    - nginx
  docker-binary: ${REDEPLOY_DOCKER_BINARY:docker}
  self-restart-delay-seconds: 5
  helper-image: ${REDEPLOY_HELPER_IMAGE:docker:cli}

rate-limit:
  chat:
    requests-per-minute: 20
  mcp:
    requests-per-minute: 60
