server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

uploads:
  path: ${UPLOADS_PATH:backend/uploads/}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,env,configprops
  endpoint:
    env:
      show-values: ALWAYS
    configprops:
      show-values: ALWAYS
    health:
      show-details: always
      show-components: always

spring:
  application:
    name: simonrowe-backend
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-igsu3mpz.us.auth0.com/
          audiences: https://api.simonrowe.dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      uri: mongodb://localhost:27017/simonrowe
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.simonrowe.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: a13da4001@smtp-brevo.com
    password: ${BREVO_SMTP_PASSWORD:xxxxxx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    openai:
      api-key: ${GROQ_API_KEY:not-set}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: moonshotai/kimi-k2-instruct
    mcp:
      server:
        type: SYNC
        annotation-scanner:
          enabled: true

google:
  drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}

search:
  sync:
    cron: "0 0 */4 * * *"
  site:
    max-results-per-group: 5
  blog:
    max-results: 20
  query:
    max-length: 200

contact:
  email:
    from: contact-us@simonrowe.dev
    to: simon.rowe@gmail.com
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: https://www.google.com/recaptcha/api/siteverify

chat:
  session:
    cleanup-interval-minutes: 5
    max-inactive-minutes: 30
  system-prompt: >
    You ARE Simon Rowe — a senior software engineer responding to visitors on your own
    portfolio website. Speak in the first person ("I", "my", "me") as if the visitor is
    chatting directly with you. Be warm, enthusiastic, and personable — like you're having
    a genuine conversation over coffee. Share your passion for the technologies you work with
    and the projects you've built.


    ALWAYS use the available tools to look up accurate information before answering — never
    guess or assume facts from the conversation context alone. Use getProfile for personal
    details, getJobs for employment history, getSkills for technical skills and ratings,
    and searchBlogs or searchSite for blog posts and other content.


    When responding, be detailed and generous with your answers. If someone asks about your
    skills, don't just list them — talk about your experience with them, what you enjoy about
    them, and how you've used them. If asked about a job, paint a picture of what you did there
    and what you're proud of. Draw connections between your different experiences.


    Format responses in Markdown for readability — use paragraphs, **bold text**, bullet lists,
    and headings where appropriate. Keep your tone conversational and approachable, not robotic
    or corporate. You're a real person sharing your story.

redeploy:
  compose-file: ${REDEPLOY_COMPOSE_FILE:/workspace/docker-compose.prod.yml}
  project-name: ${REDEPLOY_PROJECT_NAME:${COMPOSE_PROJECT_NAME:simonrowe-dev-monorepo}}
  services:
    - backend
    - frontend
    - nginx
  docker-binary: ${REDEPLOY_DOCKER_BINARY:docker}
  self-restart-delay-seconds: 5
  helper-image: ${REDEPLOY_HELPER_IMAGE:docker:cli}

rate-limit:
  chat:
    requests-per-minute: 20
  mcp:
    requests-per-minute: 60
