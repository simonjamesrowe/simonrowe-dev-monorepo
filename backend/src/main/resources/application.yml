server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

uploads:
  path: ${UPLOADS_PATH:backend/uploads/}

# The public origin this site is reached on. Used to build absolute share URLs
# (`{base-url}/s/{slug}`) and, more importantly, absolute Open Graph image URLs.
#
# It must never be blank: a relative `og:image` is dropped silently by every crawler,
# which presents as "link previews don't work" with no error anywhere in the logs. The
# production default is deliberate rather than a placeholder — a share link is for
# sharing, so even a locally generated one should point at production.
site:
  base-url: ${SITE_BASE_URL:https://simonrowe.dev}

mongock:
  enabled: ${MONGOCK_ENABLED:true}
  migration-scan-package:
    - com.simonrowe.migration.changeunits

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,env,configprops
  endpoint:
    env:
      show-values: ALWAYS
    configprops:
      show-values: ALWAYS
    health:
      show-details: always
      show-components: always
  # Tracing: Spring AI (ChatClient/ChatModel) emits gen_ai observations via the Micrometer
  # Observation API. micrometer-tracing-bridge-otel turns those observations into OpenTelemetry
  # spans and this OTLP exporter ships them to Alloy (which forwards only the AI spans to
  # Langfuse — see config/alloy/config.alloy). Sample everything: chat volume is low and every
  # generation is worth capturing.
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Reuses the same collector endpoint as the OTel starter (Alloy gRPC :4317 in prod).
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
          transport: grpc

spring:
  application:
    name: simonrowe-backend
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-igsu3mpz.us.auth0.com/
          audiences: https://api.simonrowe.dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Boot 4 moved the Mongo CONNECTION settings out of spring.data.mongodb into their own
  # spring.mongodb namespace (spring-boot-mongodb); spring.data.mongodb.* now carries only
  # Spring Data specifics such as gridfs and repositories. The old key is not an error — it
  # is silently ignored, and the client falls back to localhost:27017.
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/simonrowe}
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.simonrowe.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # KafkaTemplate.send() is only asynchronous once the producer holds metadata for
        # the topic. Before that it blocks the calling thread inside waitOnMetadata for up
        # to max.block.ms, and the default is 60 SECONDS. Every publisher here is called
        # on a request thread behind a swallow-and-carry-on catch, so the default turns
        # "the broker is down" into a minute-long hang followed by success — favouriting
        # an article was doing exactly that. Five seconds is comfortably longer than a
        # healthy broker needs to answer a metadata request and short enough that a dead
        # one degrades visibly rather than silently.
        max.block.ms: 5000
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: a13da4001@smtp-brevo.com
    password: ${BREVO_SMTP_PASSWORD:xxxxxx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openaisdk.autoconfigure.OpenAiSdkEmbeddingAutoConfiguration
      - org.springframework.ai.model.openaisdk.autoconfigure.OpenAiSdkImageAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      embedding:
        options:
          model: text-embedding-3-small
      image:
        options:
          model: gpt-image-1
    openai-sdk:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          # gpt-5.4-nano: newer generation than gpt-5-mini, cheaper per token
          # ($0.20/$1.25 vs $0.25/$2.00 per 1M) and faster.
          #
          # Do NOT set reasoning-effort here. These defaults are merged into EVERY
          # per-call OpenAiChatOptions, and reasoning_effort 400s twice over:
          # OpenAI rejects function tools + reasoning_effort for gpt-5.4-nano on
          # /v1/chat/completions (breaking the tool-enabled portfolio chat), and
          # gpt-4o-mini (GuardrailAdvisor's classifier) rejects the argument
          # outright, silently disabling the topic gate.
          model: ${OPENAI_CHAT_MODEL:gpt-5.4-nano}
    vectorstore:
      elasticsearch:
        index-name: content-embeddings
        dimensions: 1536
        similarity: cosine
        initialize-schema: true
    mcp:
      server:
        type: SYNC
        # STREAMABLE exposes the modern Streamable-HTTP transport at /mcp (POST JSON-RPC).
        # The default (sse) serves /sse + /mcp/message instead. Tools are consumed
        # in-process by the chat client (ChatConfig.defaultTools), so this only affects
        # external HTTP MCP clients (the /mcp page and CLIs like Claude Code/Codex/Gemini).
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true
    tools:
      observations:
        # Bound to the SAME switch as langfuse.content-capture-enabled, deliberately.
        # Spring AI's ToolCallingContentObservationFilter writes spring.ai.tool.call.arguments as
        # a span attribute; Alloy keeps the span (it has spring.ai.kind) and Langfuse stores it as
        # observation metadata. Tool arguments include ProfileMcpTools.submitContactForm's
        # firstName/lastName/email/subject/message — third-party PII. If this stayed hardcoded
        # true, setting LANGFUSE_CONTENT_CAPTURE_ENABLED=false would only silence our own filter
        # and that PII would keep flowing. LANGFUSE_CONTENT_CAPTURE_ENABLED=false is therefore
        # the single, complete off-switch for ALL content capture, framework included.
        include-content: ${LANGFUSE_CONTENT_CAPTURE_ENABLED:true}
    # Observability content capture.
    #
    # NOTE: spring.ai.chat.observations.log-prompt / log-completion do NOT write span
    # attributes — verified in Spring AI 1.1.8 source, ChatModelPromptContentObservationHandler
    # only calls logger.info(). AiObservationAttributes has no prompt/completion constant, so
    # gen_ai.prompt / gen_ai.completion are never emitted by the framework at any 1.x or 2.x
    # version. Prompt and completion capture is therefore done by
    # com.simonrowe.observability.LangfuseContentObservationFilter, toggled with
    # langfuse.content-capture-enabled below — the same LANGFUSE_CONTENT_CAPTURE_ENABLED variable
    # that gates spring.ai.tools.observations.include-content above.
    #
    # Decision (2026-07-26): content capture is ON, reversing the 2026-07-17 decision. Visitor
    # chat text — including recruiter-pasted job specs and contact-form details — is stored in
    # Langfuse. See docs/superpowers/specs/2026-07-26-langfuse-sessions-content-evals-design.md.

google:
  drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
    # Read-only here: the backend lists this folder for the admin page, but the
    # capture and its retention live in scripts/backup-platform.sh (constitution
    # 2.0.0 - no Docker access in the container serving public traffic).
    #
    # Platform backups MUST NOT share a folder with the application backups above.
    # Retention keeps the newest N *.zip in a folder, so a shared folder would make
    # the two backup types evict each other and silently degrade today's "last 7
    # days" guarantee to roughly "last 3 days" of each.
    #
    # Leave this blank in normal operation: the platform folder is then resolved by
    # name (`simonrowe-platform-backups`). Set it only to pin a specific folder —
    # note that unlike folder-id above, leaving it blank does NOT fall back to the
    # application folder.
    platform-folder-id: ${GOOGLE_DRIVE_PLATFORM_FOLDER_ID:}

# On-demand narration is deliberately disabled unless the operator completes
# docs/setup/google-cloud-tts.md and explicitly enables it. Google Drive's OAuth
# credentials are unrelated; Text-to-Speech uses Application Default Credentials.
narration:
  enabled: ${NARRATION_ENABLED:false}
  project-id: ${GOOGLE_CLOUD_TTS_PROJECT_ID:}
  project-number: ${GOOGLE_CLOUD_TTS_PROJECT_NUMBER:}
  # Preferred where no credential file can be installed (the production Pi). When set it
  # replaces Application Default Credentials entirely, and project-number/bucket become
  # unnecessary because the Long Audio route they serve is never taken. Local development
  # leaves this blank and uses gcloud user ADC.
  api-key: ${GOOGLE_CLOUD_TTS_API_KEY:}
  location: ${GOOGLE_CLOUD_TTS_LOCATION:global}
  voice-name: ${GOOGLE_CLOUD_TTS_VOICE_NAME:en-AU-Chirp3-HD-Achird}
  language-code: ${GOOGLE_CLOUD_TTS_LANGUAGE_CODE:en-AU}
  bucket: ${GOOGLE_CLOUD_TTS_OUTPUT_BUCKET:}
  max-blog-characters: ${NARRATION_MAX_BLOG_CHARACTERS:50000}
  monthly-character-limit: ${NARRATION_MONTHLY_CHARACTER_LIMIT:1000000}
  poll-interval: ${NARRATION_POLL_INTERVAL:5s}
  operation-timeout: ${NARRATION_OPERATION_TIMEOUT:5m}
  lease-duration: ${NARRATION_LEASE_DURATION:2m}
  recovery-delay: ${NARRATION_RECOVERY_DELAY:30s}

search:
  sync:
    cron: "0 0 */4 * * *"
  site:
    max-results-per-group: 5
  blog:
    max-results: 20
  query:
    max-length: 200

contact:
  email:
    from: contact-us@simonrowe.dev
    to: simon.rowe@gmail.com
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: https://www.google.com/recaptcha/api/siteverify

chat:
  session:
    cleanup-interval-minutes: 5
    max-inactive-minutes: 30
  system-prompt: >
    You ARE Simon Rowe — a senior software engineer responding to visitors on your own
    portfolio website. Speak in the first person ("I", "my", "me") as if the visitor is
    chatting directly with you. Be warm, enthusiastic, and personable — like you're having
    a genuine conversation over coffee. Share your passion for the technologies you work with
    and the projects you've built.


    You have access to relevant context from your blog posts, job history, and skills
    that has been automatically retrieved based on the visitor's question. Use this
    context to provide accurate, detailed answers. When referencing specific blog posts or
    experiences, mention them by name and include markdown links so visitors can navigate to
    the content. Use these link formats:
    - Blog posts: [Blog Title](/blogs/BLOG_ID)
    - A specific role/job: [Company or Role Name](/experience?job=JOB_ID)
    - A specific skill group: [Skill Group Name](/experience?skillGroup=GROUP_ID)
    - The experience page in general: [Experience](/experience)


    WRITING STYLE: Write in clear, grammatically correct, complete sentences. Start every
    bullet point and every sentence with a capital letter. Keep list items parallel and
    well-formed. Do not output run-on or jumbled phrases.


    CRITICAL LINK FORMATTING: ALWAYS write links using markdown syntax [visible text](url).
    The visible text MUST be the human-readable name (the company, role, skill group, or blog
    title). NEVER paste a bare or raw URL into your prose — a bare URL like
    /experience?job=5eedd4803c8d74001e4497f5 is NOT clickable and looks broken. It must be
    written as [Y-Tree](/experience?job=5eedd4803c8d74001e4497f5). This applies to every link.


    IMAGES: When a tool result or context gives you an image URL (e.g. a blog's featured image
    or a news article image), you MAY embed it using markdown image syntax
    ![short alt text](IMAGE_URL). Only use an image URL you were explicitly given — never
    invent one. Do not embed images for skills or job cards (those have no images).


    CRITICAL RULE FOR BLOG LINKS: NEVER invent or guess blog titles or URLs. ONLY link to
    blogs that appear in the context section (use the URL from the [Source: ... | URL: ...]
    header) or in results returned by searchBlogs or getRecentBlogs tools. Blog URLs always
    contain a 24-character hex MongoDB ObjectId like /blogs/69d0e48ee3160e18f83d88bf — they
    NEVER use title slugs. If you find yourself writing a URL like /blogs/Some-Blog-Title,
    STOP — that format is wrong. If you cannot find a matching blog with a real URL, do not
    create a link — instead suggest the visitor check the blog page.


    You also have tools available for looking up additional information. ALWAYS use these tools
    proactively when relevant — don't rely solely on retrieved context. In particular, for ANY
    question about my blogs, jobs, skills, code, news, or events, CALL the matching tool below
    even if the retrieved context already seems to answer it: the tool is what renders the
    visual card the visitor sees, so answering from context alone leaves them with no card.
    - **getProfile** — personal details, bio, contact info
    - **getJobs** — employment history; pass a keyword to filter by technology/role, or null for all
    - **getSkills** — technical skills with proficiency ratings; pass a keyword to filter, or null for all
    - **getRecentBlogs** — latest blog posts with titles, tags, and skills
    - **searchBlogs** — search blog posts by keyword (blog-specific, ranked by title/tags relevance)
    - **searchSite** — broad search across all content types (blogs, jobs, skills, news, events)
    - **getCodeExamples** — real code snippets from the portfolio, filterable by language
    - **searchNews** — search tech news articles by keyword, or null for latest
    - **getUpcomingEvents** — upcoming events; pass a keyword to filter, or null for all
    - **webSearch** — search the live web for CURRENT information about a company I've worked at,
      a technology/skill I list, or a source in my content. Use it ONLY to enrich topics grounded
      in my profile/experience/skills — never for general or unrelated questions. Cite every
      result you use as an inline markdown link [title](url).
    - **fetchUrl** — read the contents of a specific web page the visitor references, most often
      a job posting a recruiter pastes. Use it to read the spec so you can assess my fit; if the
      page can't be read (some boards block it), say so and offer to search for the role instead.
    - **submitContactForm** — send a contact message to Simon on behalf of the visitor (one per session)


    When a visitor asks what I'm writing about lately (e.g. "what's he blogging about recently",
    "what does he write about"), call **getRecentBlogs** (and **searchBlogs** for a topic). When
    asked what's new in tech / AI / Spring news, call **searchNews**. These are on-topic — always
    answer them using these tools rather than deflecting.


    RECRUITERS & EMPLOYERS are welcome — treat hiring questions as on-topic and be genuinely
    helpful. When someone asks whether I'm a fit for a role, whether I'm available, about my
    notice/expectations, or for roles similar to what I do:
    1. Ground the answer in my real background — call **getJobs** and **getSkills** (and
       **getProfile** for contact) so the fit assessment reflects my actual experience, team
       sizes, and stack. Link to my current role with [Role at Company](/experience?job=JOB_ID).
    2. If they want comparable openings, use **webSearch** to find CURRENT UK job listings that
       match my profile — include a UK location term (e.g. "London", "UK") and target job
       platforms (LinkedIn, Indeed, Reed, Totaljobs, CV-Library, Glassdoor). Cite each listing
       as a markdown link [Job title — source](url); never invent a listing or URL.
    3. Offer next steps (share CV/availability, tailor a matching summary, or take a message via
       **submitContactForm**). Keep it honest — note genuine gaps rather than overselling.


    When a recruiter pastes a link to a job they're advertising (or references a specific
    posting):
    1. Call **fetchUrl** on that URL to read the spec. If it can't be read (LinkedIn/Indeed often
       block automated reads), say so plainly and either use **webSearch** to find the role or
       ask them to paste the job description text.
    2. Give an honest fit assessment of me against the actual spec — call **getJobs** and
       **getSkills** to ground it in my real experience, and be candid about genuine gaps.
    3. Then OFFER (do not auto-generate) a tailored cover letter and my CV: e.g. "Want me to draft
       a short cover letter for this role, or share Simon's CV?"
    4. Only if they say yes, draft a concise first-person cover letter (3-4 short paragraphs)
       tailored to the fetched role, and link my CV using the cvUrl from **getProfile** (or
       [Download CV](/api/resume) if no cvUrl is set). Never invent a CV link.


    When a visitor wants to contact you or send you a message:
    1. Collect their first name, last name, email address, subject, and message
    2. Confirm the details with the visitor before submitting
    3. Call **submitContactForm** with the collected details
    4. This tool can only be used once per chat session — if already used, let the visitor know


    When asked about a specific technology (e.g. "Kafka", "Spring Boot", "React"):
    1. Call **getJobs** with the technology name to find relevant roles
    2. Calculate total years of experience with it from the job date ranges
    3. Call **searchBlogs** to find related blog posts
    4. Call **getCodeExamples** to find relevant code snippets
    5. Present a comprehensive answer with job history, experience duration, blog links, and code


    When asked to show code or when a follow-up implies code is wanted (e.g. "show me",
    "can you give an example", "what does that look like"):
    1. ALWAYS call **getCodeExamples** with the relevant language filter — do NOT use code
       from the context section or from your training data. The context section does not
       contain complete code examples.
    2. If getCodeExamples returns relevant results, present the code using fenced code blocks
       with language highlighting. Include the title and a brief description.
    3. If getCodeExamples returns no relevant results, tell the visitor you don't have a
       code example for that specific topic rather than generating code.
    4. NEVER reconstruct or complete partial code snippets from the context section.
    5. When linking to code examples, use: [Title](/code-examples/CODE_EXAMPLE_ID)


    IMPORTANT technology constraints:
    - This portfolio site is built entirely in **Java 21** and **TypeScript/React**. NEVER show
      Kotlin code. All backend code is Java. Some older blog posts reference Kotlin from a
      previous version of the codebase, but the current implementation is 100% Java.
    - For testing, I use **Testcontainers** (not @EmbeddedKafka or @WithEmbeddedKafka). My test
      setup uses ConfluentKafkaContainer and ElasticsearchContainer with @DynamicPropertySource.
    - When the retrieved context contains Kotlin code from old blog posts, translate it to Java
      or skip it entirely. Only show Java code for backend examples.


    When responding, be detailed and generous with your answers. If someone asks about your
    skills, don't just list them — talk about your experience with them across different roles,
    how long you've used them, what you enjoy about them, and link to relevant blog posts.
    Draw connections between your different experiences.


    If you don't have relevant information on a topic, be honest and say you don't have
    specific content about that subject rather than guessing.


    Format responses in Markdown for readability — use paragraphs, **bold text**, bullet lists,
    headings, and code blocks where appropriate. Keep your tone conversational and approachable,
    not robotic or corporate. You're a real person sharing your story.

web-search:
  searxng:
    # Self-hosted SearXNG (no API key). Blank disables web search (graceful degradation);
    # set to the internal service URL (e.g. http://searxng:8080) to enable it.
    base-url: ${SEARXNG_URL:}
    max-results: 5

web-fetch:
  # Reading a recruiter-pasted job posting URL (no external service; uses jsoup).
  max-chars: 8000
  timeout-seconds: 8

rate-limit:
  chat:
    requests-per-minute: 20
  mcp:
    requests-per-minute: 60
  narration:
    requests-per-minute: ${NARRATION_RATE_LIMIT_REQUESTS_PER_MINUTE:10}
  # Lower than narration's: a summary request holds a thread for 15-30 seconds and
  # spends on the model, so the cap is about cost and thread pressure, not abuse alone.
  summary:
    requests-per-minute: ${SUMMARY_RATE_LIMIT_REQUESTS_PER_MINUTE:5}

aggregation:
  schedule:
    cron: "0 0 */6 * * *"
  digest:
    cron: "0 0 8 * * MON"
    model: ${DIGEST_MODEL:gpt-5.6-luna}
    window-days: 7
    duplicate-window-hours: 24
  summary:
    model: ${ARTICLE_SUMMARY_MODEL:gpt-5.6-luna}
    # Favouriting a news article requests an in-depth summary in the background. Audio is
    # deliberately not generated automatically — that is the expensive half and stays on
    # demand from the drawer.
    auto-on-favourite: ${SUMMARY_AUTO_ON_FAVOURITE:true}
    # How long a GENERATING summary may sit untouched before another caller is allowed
    # to conclude the generating process died and reclaim it.
    generation-timeout: 3m
    max-source-chars: 12000

backup:
  # Application data: MongoDB, uploaded media, Elasticsearch embeddings.
  #
  # The platform datastore backup (Postgres + ClickHouse) is NOT configured here.
  # It runs in the `deployer` container as scripts/backup-platform.sh on a Temporal
  # schedule, because constitution 2.0.0 forbids Docker access in this container.
  # See docs/runbooks/platform-backup-restore.md.
  schedule:
    cron: "0 0 22 * * *"
    zone: "Europe/London"
  retention:
    max-backups: 7

langfuse:
  host: ${LANGFUSE_HOST:https://langfuse.simonrowe.dev}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  environment: ${LANGFUSE_ENVIRONMENT:development}
  scores-enabled: ${LANGFUSE_SCORES_ENABLED:false}
  content-capture-enabled: ${LANGFUSE_CONTENT_CAPTURE_ENABLED:true}

# The /status page's changelog. Summaries are generated at INGEST — when a release record is
# created — never on view: a public endpoint that called an LLM per request would be both a
# cost problem and an abuse vector.
platform:
  releases:
    summaries:
      # A one-off backfill of 50 releases costs 50 small calls; steady state is one per merge.
      enabled: ${PLATFORM_RELEASE_SUMMARIES_ENABLED:true}
      # 3 per tick every 2 minutes clears a 50-release backfill in ~35 minutes without
      # holding a scheduler thread for long or spiking the OpenAI bill in one burst.
      batch-size: 3
      max-attempts: 3
      model: ${PLATFORM_RELEASE_SUMMARY_MODEL:gpt-5.6-luna}
  # The other first-party JVMs, asked over the Docker network. Neither is routed by nginx.
  # Note the port: software-factory serves on 8090, not 8080.
  services:
    factory-base-url: ${PLATFORM_FACTORY_URL:http://software-factory:8090}
    deployer-base-url: ${PLATFORM_DEPLOYER_URL:http://deployer:8090}
    # A status page must not be able to hang on a restarting sibling container.
    timeout: 1s
    cache-ttl: 60s

factory-admin:
  factory-base-url: ${PLATFORM_FACTORY_URL:http://software-factory:8090}
  deployer-base-url: ${PLATFORM_DEPLOYER_URL:http://deployer:8090}
  trigger-token: ${FACTORY_TRIGGER_TOKEN:}
  timeout: 2s
  owner: simonjamesrowe
  repository: simonrowe-dev-monorepo
