spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: false
  elasticsearch:
    uris: http://localhost:9200
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test.auth0.com/
          audiences: https://test-api
  ai:
    openai:
      api-key: test-dummy-key
  autoconfigure:
    # Three exclusions went with Spring AI 2.0's merge of the openai-sdk module into
    # spring-ai-openai: the two OpenAiSdk* ones (those classes no longer exist) and
    # OpenAiChatAutoConfiguration.
    #
    # That last one is the subtle one. Before the merge there were TWO OpenAI chat
    # autoconfigurations, and this list excluded the non-SDK one to stop them colliding —
    # so the SDK's chat model is what actually supplied the ChatModel bean in tests. After
    # the merge there is exactly one, and excluding it leaves the context with NO ChatModel
    # at all, which fails 356 tests at context startup. Keeping it enabled reproduces the
    # pre-upgrade behaviour; the api-key above is a dummy and nothing calls out.
    exclude:
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - com.embabel.agent.autoconfigure.models.openai.AgentOpenAiAutoConfiguration
      - com.embabel.agent.autoconfigure.platform.AgentPlatformAutoConfiguration
management:
  health:
    kafka:
      enabled: false
    elasticsearch:
      enabled: false
  # Keep the tracing bridge wired (so we can assert it works) but don't ship spans anywhere
  # in tests — there is no collector, and a live gRPC exporter would log noisy retries.
  tracing:
    export:
      otlp:
        enabled: false
uploads:
  path: target/test-uploads
narration:
  # Automated tests must never discover developer ADC and call a chargeable API.
  enabled: false
  project-id: narration-test-project
  project-number: "123456789012"
  location: global
  voice-name: en-GB-Chirp3-HD-Charon
  language-code: en-GB
  bucket: narration-test-output
  max-blog-characters: 50000
  monthly-character-limit: 1000000
  poll-interval: 10ms
  operation-timeout: 1s
  lease-duration: 1s
  recovery-delay: 10ms
mongock:
  enabled: false
rate-limit:
  # Buckets are keyed by client IP and live for the lifetime of the application context,
  # which tests share. With production values, one test class making a handful of requests
  # would exhaust the allowance and turn every later test in the context into a 429. The
  # limiter's own behaviour is covered by RateLimitInterceptorTest, which builds its own
  # config, so raising these here removes an incidental coupling rather than a real check.
  chat:
    requests-per-minute: 10000
  mcp:
    requests-per-minute: 10000
  narration:
    requests-per-minute: 10000
  summary:
    requests-per-minute: 10000
platform:
  releases:
    summaries:
      enabled: false
      model: test-model
