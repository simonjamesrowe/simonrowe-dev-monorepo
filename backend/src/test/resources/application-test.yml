spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
    listener:
      auto-startup: false
  elasticsearch:
    uris: http://localhost:9200
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test.auth0.com/
          audiences: https://test-api
  ai:
    openai:
      api-key: test-dummy-key
    openai-sdk:
      api-key: test-dummy-key
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openaisdk.autoconfigure.OpenAiSdkEmbeddingAutoConfiguration
      - org.springframework.ai.model.openaisdk.autoconfigure.OpenAiSdkImageAutoConfiguration
      - com.embabel.agent.autoconfigure.models.openai.AgentOpenAiAutoConfiguration
      - com.embabel.agent.autoconfigure.platform.AgentPlatformAutoConfiguration
management:
  health:
    kafka:
      enabled: false
    elasticsearch:
      enabled: false
  # Keep the tracing bridge wired (so we can assert it works) but don't ship spans anywhere
  # in tests — there is no collector, and a live gRPC exporter would log noisy retries.
  otlp:
    tracing:
      export:
        enabled: false
uploads:
  path: target/test-uploads
mongock:
  enabled: false
