services:
  mongodb:
    image: mongo:8
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~139MB (WiredTiger sizes its cache from the limit)
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: simonrowe
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Without a start_period the whole cold-start budget is retries x interval
      # (50s here), because failing probes during boot count against `retries`.
      # `backend` gates on `mongodb: service_healthy`, so if that budget expires
      # first, `up -d` aborts with "dependency failed to start" and leaves
      # backend - and therefore frontend - in `created`, i.e. a 502 on www.
      # Measured cold start on the Pi: ~20s to "waiting for connections". This is
      # the roomiest of the three gating stores, but it shares a 4-core Pi with
      # Kafka and Elasticsearch booting at the same time, so give it real headroom.
      # A start_period costs nothing when boot is fast: the first successful probe
      # ends it immediately and marks the container healthy.
      start_period: 60s

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~915MB
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-node broker, so every internal topic must be replication-factor 1.
      # Without these the defaults are 3, and __consumer_offsets can never be created
      # ("The target replication factor of 3 cannot be reached because only 1 broker(s)
      # are registered"). No offsets topic means no group coordinator, which means
      # FIND_COORDINATOR times out and *no consumer group can ever join* - producers keep
      # working, so the symptom is messages published and silently never consumed, with a
      # green healthcheck throughout. This was already fixed in docker-compose.yml and
      # never ported here, which left every @KafkaListener in prod inert.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Measured cold start on the Pi: ~75s from container start until the broker's
      # SocketServer acceptors are up. The old budget (retries x interval) was
      # *exactly* 75s, so this sat right on the cliff edge and only passed by luck -
      # any extra CPU contention tipped it into `unhealthy` and aborted the
      # `backend` dependency gate. See the mongodb note above for why that strands
      # frontend in `created` and 502s the site.
      start_period: 180s

  elasticsearch:
    # Pinned to the SAME version as the client Spring Boot manages
    # (elasticsearch-java 9.4.5). This moved from 8.17.0 with the Boot 4.1.1 upgrade,
    # and it was not optional: a 9.x client refuses an 8.x server outright, failing
    # every request with "status: 400 ... Expecting a response body, but none was sent".
    #
    # Upgrading this container is a one-way data operation — Elasticsearch will not
    # start 9.x against a data directory it has already opened as 8.x and then
    # downgraded. The indices here are derived: search documents are rebuilt from
    # MongoDB by IndexService/SearchIndexSyncScheduler, and the content-embeddings
    # vector index has its own capture in ElasticsearchBackupService. Take that
    # embeddings backup BEFORE recreating this service — regenerating it costs real
    # money in embedding calls.
    image: elasticsearch:9.4.5
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~727MB; heap is pinned at 512m via ES_JAVA_OPTS
    mem_limit: 1500m
    mem_reservation: 512m
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      path.repo: /usr/share/elasticsearch/backups
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-backups:/usr/share/elasticsearch/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # This is the one that actually broke a deploy on 2026-08-25. Elasticsearch
      # 8.17 with a 512m heap needs ~130s on this Pi before it binds 9200 (cluster
      # GREEN at ~132s), but with no start_period its entire budget was
      # retries x interval = 50s. Docker therefore marked it `unhealthy` roughly 80s
      # before it could possibly answer, `up -d` aborted the `backend` gate with
      # "dependency failed to start: container ... elasticsearch-1 is unhealthy",
      # and backend + frontend were left in `created` - a 502 on www and api until
      # someone re-ran the deploy once ES had finished booting. That is the real
      # cause of the "just run restart-prod.sh again and it works" folklore.
      #
      # The probe itself costs ~60ms once ES is up, so the timeout was never the
      # problem - the missing cold-start grace was. 300s is ~2x the measured boot
      # and is free when boot is fast.
      start_period: 300s

  temporal-db-init:
    image: postgres:15
    restart: "no"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      PGHOST: langfuse-db
      PGUSER: ${LANGFUSE_DB_USER:-postgres}
      PGPASSWORD: ${LANGFUSE_DB_PASSWORD:-postgres}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
    volumes:
      - ./scripts/temporal:/scripts/temporal:ro
    entrypoint: ["/bin/sh", "/scripts/temporal/init-database.sh"]

  temporal-schema-init:
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_SEEDS: langfuse-db
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
    volumes:
      - ./scripts/temporal:/scripts/temporal:ro
    entrypoint: ["/bin/sh", "/scripts/temporal/setup-postgres.sh"]

  temporal:
    image: temporalio/server:1.31.2
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~159MB
    mem_limit: 768m
    mem_reservation: 256m
    restart: unless-stopped
    depends_on:
      temporal-schema-init:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_SEEDS: langfuse-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
    ports:
      # The host worker needs gRPC; binding loopback keeps it off the public network.
      - "127.0.0.1:7233:7233"
    volumes:
      - ./config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.2
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_NAMESPACE_RETENTION: 30d
    volumes:
      - ./scripts/temporal:/scripts/temporal:ro
    entrypoint: ["/bin/sh", "/scripts/temporal/create-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:2.52.1
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~15MB
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_AUTH_ENABLED: "true"
      TEMPORAL_AUTH_TYPE: oidc
      TEMPORAL_AUTH_PROVIDER_URL: ${TEMPORAL_AUTH0_ISSUER:?set TEMPORAL_AUTH0_ISSUER in .env}
      TEMPORAL_AUTH_ISSUER_URL: ${TEMPORAL_AUTH0_ISSUER:?set TEMPORAL_AUTH0_ISSUER in .env}
      TEMPORAL_AUTH_CLIENT_ID: ${TEMPORAL_AUTH0_CLIENT_ID:?set TEMPORAL_AUTH0_CLIENT_ID in .env}
      TEMPORAL_AUTH_CLIENT_SECRET: ${TEMPORAL_AUTH0_CLIENT_SECRET:?set TEMPORAL_AUTH0_CLIENT_SECRET in .env}
      TEMPORAL_AUTH_CALLBACK_URL: https://temporal.simonrowe.dev/auth/sso/callback
      TEMPORAL_AUTH_SCOPES: openid,profile,email
      TEMPORAL_AUTH_REDIRECT_TO_PROVIDER: "true"
      TEMPORAL_CORS_ORIGINS: https://temporal.simonrowe.dev
      TEMPORAL_DISABLE_WRITE_ACTIONS: "true"
    healthcheck:
      # The image has no curl; wget is present and exits non-zero on any HTTP error.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  software-factory:
    image: ${FACTORY_IMAGE:-ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-software-factory:latest}
    # Memory cap. Measured steady-state PSS on the Pi is noted below; the limit
    # carries roughly 2x headroom. NOTE: INERT until the kernel memory cgroup is
    # enabled - see scripts/enable-memory-cgroup.sh.
    # Measured: ~264MB; also forks Claude Code and git, so leave real headroom
    mem_limit: 1500m
    mem_reservation: 384m
    # `missing`, not `always`. scripts/monitor-prod.sh runs a bare `docker compose up -d`
    # every minute whenever it sees anything unsettled, and that command resolves :latest
    # with no flag to stop it. With `always`, two things follow: a rollback cannot hold -
    # the watchdog re-pulls the broken :latest within 60 seconds and the site breaks again
    # with nothing in the deploy log to explain it - and the watchdog can silently upgrade
    # this service as a side effect of healing an unrelated container.
    #
    # With `missing`, pulling is something only the deployer and an explicit
    # restart-prod.sh run do. restart-prod.sh is unaffected: it runs `docker compose pull`
    # explicitly before `up -d`.
    pull_policy: missing
    restart: unless-stopped
    # Deliberately no `env_file: .env`. This container terminates untrusted internet
    # traffic (the GitHub webhook) and also holds the Claude and GitHub App credentials
    # now that the API and the Temporal worker share one JVM. Loading the whole file
    # would put every unrelated production secret in that process; declare what it
    # needs, and nothing else.
    environment:
      JAVA_TOOL_OPTIONS: "-Xshare:off"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      FACTORY_RUNTIME_ROLE: software-factory
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}
      FACTORY_TRIGGER_TOKEN: ${FACTORY_TRIGGER_TOKEN:?set FACTORY_TRIGGER_TOKEN in .env}
      # Narrower than the trigger token above: authorises only GET
      # /api/factory/flow/{nodeKey}. The deployer below is granted this one too, so it
      # can report deploy/platformbackup detail truthfully without also holding the
      # trigger token that starts a deploy.
      # DELIBERATELY `:-` WITH AN EMPTY DEFAULT, NOT `:?`. This variable does not exist
      # in production `.env` yet (unlike FACTORY_TRIGGER_TOKEN above), so a `:?` here
      # would make the WHOLE compose file fail to interpolate the moment this file
      # shipped - wedging `sync-config` and breaking `monitor-prod.sh`'s minutely
      # `up -d`, taking the self-healing watchdog down with it (see the identical
      # reasoning on trivy-server's --token below). With the value unset,
      # authenticateRead fails closed with 503 and the Factory Flow drawer degrades one
      # panel to "not available" - a far better failure than an un-interpolatable file.
      FACTORY_READ_TOKEN: ${FACTORY_READ_TOKEN:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?set GITHUB_APP_CLIENT_ID in .env}
      # Inside the container the PEM always lives here. Only the path is ever configured,
      # never the key itself. The bind-mount source below is a SEPARATE variable
      # (GITHUB_APP_PRIVATE_KEY_HOST_PATH) and the two must not be merged back into one.
      #
      # They were one name until it broke the deployer: that container sets this variable
      # to the container path, and it runs `docker compose` against this file, where
      # process environment beats `.env`. Its reconcile therefore resolved the mount
      # source to /run/secrets/github-app.pem - a path that does not exist on the host -
      # and the daemon creates a missing bind source as an empty DIRECTORY, so
      # software-factory would fail to start with "not a directory". One name meant two
      # different things depending on which side of the mount was reading it.
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN in .env}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-medium}
      # These three shadow the application.yml defaults, so they have to be bumped here too or
      # prod keeps the old, tighter limits no matter what the image ships.
      CLAUDE_MAX_TURNS: ${CLAUDE_MAX_TURNS:-60}
      CLAUDE_TIMEOUT: ${CLAUDE_TIMEOUT:-25m}
      # The ceiling that refused PR #106 (98 files) at its old value of 80. Declared here so it
      # is tunable from .env without a rebuild, since it is the limit most likely to need it.
      FACTORY_MAX_CHANGED_FILES: ${FACTORY_MAX_CHANGED_FILES:-250}
      FACTORY_FEEDBACK_ENABLED: ${FACTORY_FEEDBACK_ENABLED:-true}
      FACTORY_FEEDBACK_HARVEST_MODEL: ${FACTORY_FEEDBACK_HARVEST_MODEL:-haiku}
      FACTORY_FEEDBACK_DISTILL_MODEL: ${FACTORY_FEEDBACK_DISTILL_MODEL:-sonnet}
      # Issue-only scanning is on by default. It files one consolidated repository report in
      # Linear and never edits dependencies, pushes a branch, opens a PR or polls CI.
      FACTORY_CVEFIX_ENABLED: ${FACTORY_CVEFIX_ENABLED:-true}
      # The receiver half of auto-deploy: gates the `workflow_run` webhook branch and the
      # DeployWorkflowService client stub. It belongs HERE and not only on `deployer`,
      # because this is the container that terminates the signed webhook. Without this
      # line the variable reaches no process at all - this service deliberately has no
      # `env_file`, so setting it in .env alone is silently inert and the whole feature
      # does nothing with no error anywhere.
      FACTORY_DEPLOY_TRIGGER_ENABLED: ${FACTORY_DEPLOY_TRIGGER_ENABLED:-false}
      # Whether a successful deploy schedules a log scan five minutes later. It belongs HERE, next
      # to the trigger flag above and for the same reason: DeployWorkflowService runs in this
      # container - it is the one that terminates the signed webhook - and reads this flag to build
      # the DeployRequest. Setting it on `deployer` instead leaves it at the application.yml
      # `false` default here, so no scan is ever scheduled however the deployer is configured. The
      # deployer needs no copy: the workflow reads the value off the request.
      FACTORY_DEPLOY_LOG_WATCH_TRIGGER_ENABLED: ${FACTORY_DEPLOY_LOG_WATCH_TRIGGER_ENABLED:-false}
      # Needs VIEW_PORTFOLIO *and* VIEW_VULNERABILITY. The existing `CI Upload` key is not
      # sufficient. Read by a Java activity, never by the agent: ClaudeCliRunner strips it
      # from the child process because it sits outside SAFE_SECRET_ENVIRONMENT, which is
      # correct here. Defaulted rather than required (`:?`) so a missing key cannot break
      # every `docker compose` command against this file while the feature is disabled.
      DEPENDENCYTRACK_API_KEY: ${DEPENDENCYTRACK_API_KEY:-}
      # The container on the shared compose network, not the public hostname — this keeps the
      # call off the Cloudflare/pinggy path. Deliberately no `depends_on` for it: the workflow
      # fails cleanly when Dependency-Track is down, and coupling the webhook receiver's
      # startup to Dependency-Track would be a regression.
      DEPENDENCYTRACK_BASE_URL: ${DEPENDENCYTRACK_BASE_URL:-http://dependencytrack-apiserver:8080}
      FACTORY_MONGODB_URI: mongodb://mongodb:27017/software_factory
      # The issue sink. On by default. Deliberately NOT set on `deployer`, which runs this
      # same image: that container holds /var/run/docker.sock and must hold as few other
      # credentials as possible. See docs/runbooks/linear.md.
      FACTORY_LINEAR_ENABLED: ${FACTORY_LINEAR_ENABLED:-true}
      FACTORY_LINEAR_TEAM_KEY: ${FACTORY_LINEAR_TEAM_KEY:-}
      FACTORY_LINEAR_DRY_RUN: ${FACTORY_LINEAR_DRY_RUN:-false}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      # Log watch. OFF by default: its signature rules and occurrence thresholds are estimates
      # until they have been validated against real production log lines, and the first runs are
      # expected to be loud because WARN is in scope and the stack emits connection-retry
      # warnings while it boots. Turn it on, dry-run it, read what it *would* file, then let it
      # file for real.
      FACTORY_LOGWATCH_ENABLED: ${FACTORY_LOGWATCH_ENABLED:-false}
      # Deliberately NOT set on `deployer`, which runs this same image: that container holds
      # /var/run/docker.sock and must hold as few other credentials as possible. Enforced by
      # DeployerGrafanaCredentialTest, which fails the build if any variable whose name contains
      # GRAFANA appears under `deployer`. See docs/runbooks/log-shipping.md.
      #
      # This is the same read credential Alloy publishes with; the access policy carries both
      # logs:write and logs:read. Note reads keep working while ingest is refused, so a working
      # read proves nothing about the pipeline - which is what the source-health check is for.
      GRAFANA_CLOUD_LOKI_ENDPOINT: ${GRAFANA_CLOUD_LOKI_ENDPOINT:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:?set GITHUB_APP_PRIVATE_KEY_HOST_PATH in .env}:/run/secrets/github-app.pem:ro
      - software-factory-workspace:/workspace
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8091 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 4 cat <&3 | grep -q '\"status\":\"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # The executor half of auto-deploy on merge. Same image as software-factory, run a
  # second time with different module flags - the pattern FACTORY_CVEFIX_ENABLED already
  # establishes for turning parts of this JVM on and off.
  #
  # WHY A SECOND CONTAINER AND NOT JUST software-factory. This one holds
  # /var/run/docker.sock, which is root-equivalent on the host. software-factory
  # terminates untrusted internet traffic (the GitHub webhook), and that is the single
  # worst place in the system to put host-root capability. So the socket goes on a
  # container with NO ingress at all: its trigger arrives over Temporal, on an internal
  # network, from a service that has already verified an HMAC signature.
  #
  # WHY THE SAME IMAGE AND NOT A MINIMAL ONE. An alpine-plus-docker-CLI image would be
  # smaller, but it would have no Claude binary and no GitHub App key - and the failure
  # path needs both: on a bad deploy an agent reads the captured logs and writes up what
  # broke, and posting that write-up needs an installation token. Building a second image
  # to carry those two things would duplicate Dockerfile.software-factory almost exactly.
  #
  # IT NEVER RECREATES ITSELF, and therefore does not self-update. `deployer` is absent
  # from FACTORY_DEPLOY_SERVICES and from FACTORY_DEPLOY_RECREATABLE. Recreating the
  # container that is mid-orchestration is how the backend's old redeploy path went wrong
  # (it needed an ephemeral helper container to work around it). Updating this one is a
  # documented manual step:
  #
  #     docker compose -f docker-compose.prod.yml up -d --no-deps deployer
  #
  # That is an accepted staleness risk, the same shape as the bug that left
  # software-factory on an old image for months. It is in docs/runbooks/deploy.md AND in
  # the prod-deploy skill so it surfaces during a deploy rather than only in a runbook.
  deployer:
    image: ${FACTORY_IMAGE:-ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-software-factory:latest}
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits carry
    # roughly 2x headroom. NOTE: INERT until the kernel memory cgroup is enabled - see
    # scripts/enable-memory-cgroup.sh.
    # Same JVM as software-factory (~264MB) but forks Claude only on the failure path.
    mem_limit: 1g
    mem_reservation: 256m
    # `missing`, matching backend/frontend/software-factory below: pulling an image is
    # something only the deployer and an explicit restart-prod.sh run should do, so that
    # monitor-prod.sh's bare `up -d` cannot change which version is running.
    pull_policy: missing
    restart: unless-stopped
    # Deliberately no `env_file: .env`, carrying software-factory's prohibition forward.
    # This container holds the Docker socket, so the argument is stronger here, not
    # weaker: declare what it needs, and nothing else.
    #
    # Note what is absent: GITHUB_WEBHOOK_SECRET and FACTORY_TRIGGER_TOKEN. The deployer
    # receives nothing - no webhook, no HTTP trigger - so it needs neither, and granting
    # it the trigger token would expose every FactoryTokenAuthenticator-protected
    # endpoint on this socket-holding container, including the one that starts a deploy.
    # It DOES hold FACTORY_READ_TOKEN below - a separate, narrower credential that
    # authorises only GET /api/factory/flow/{nodeKey} (via authenticateRead, never
    # authenticate) - so the backend can read deploy/platformbackup's recent-run detail
    # from here truthfully, the same way it already reads their live counts from the
    # unauthenticated /api/factory/flow.
    environment:
      JAVA_TOOL_OPTIONS: "-Xshare:off"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      FACTORY_RUNTIME_ROLE: deployer
      # DELIBERATELY `:-` WITH AN EMPTY DEFAULT, NOT `:?` - same reasoning as the other
      # FACTORY_READ_TOKEN line above and trivy-server's --token below: this variable
      # does not exist in production `.env` yet, and a `:?` on an unset variable fails
      # interpolation for the WHOLE compose file, wedging `sync-config` and breaking
      # `monitor-prod.sh`'s minutely `up -d`. Unset, authenticateRead fails closed with
      # 503 and the console shows "not available" for one drawer panel instead.
      FACTORY_READ_TOKEN: ${FACTORY_READ_TOKEN:-}
      FACTORY_MONGODB_URI: mongodb://mongodb:27017/software_factory
      # MANDATORY, and the least obvious line in this service. Compose derives the project
      # name from the directory it runs in, and this container sees the deploy directory
      # mounted at /workspace/repo - so it would default to `repo`, not the running
      # project. Every `docker compose up -d` in the recreate phase would then build a
      # SECOND, parallel stack (repo-backend-1 alongside
      # simonrowe-dev-monorepo-backend-1) instead of recreating production, fight it for
      # ports and volumes, and report a successful deploy while the live site still ran
      # the old images.
      #
      # This variable used to sit on `backend`, which held the Docker socket before
      # 036-auto-deploy-on-merge moved it here. Moving the socket without moving this is
      # what left it behind.
      COMPOSE_PROJECT_NAME: simonrowe-dev-monorepo
      # Off by default. Turning it on registers DeployActivitiesImpl, which is the ONLY
      # thing that makes this container - rather than software-factory - the one that can
      # execute a deploy step. See docs/runbooks/deploy.md for the rollout order, and
      # assert a live poller on the `deploy` task queue afterwards: a container can be
      # healthy with no poller registered, in which case nothing ever deploys.
      FACTORY_DEPLOY_ENABLED: ${FACTORY_DEPLOY_ENABLED:-false}
      # The mirror image of the line above, and it must stay pinned rather than absent.
      # ReviewActivitiesImpl defaults ON, so absence here would leave this container polling the
      # code-review ACTIVITY queue - and it holds no GitHub App credential, so Temporal would keep
      # handing it about half the review activities to fail. That is not a clean error: it
      # surfaced as `GitHub App token request failed` wrapping a bare UnresolvedAddressException,
      # which reads as flaky DNS, appears only in THIS container's log, and can fail one review in
      # PUBLISHING and the next in REVIEWING because routing is per activity.
      #
      # A literal, not ${FACTORY_CODEREVIEW_ENABLED:-false}: this container runs `docker compose`
      # against this very file and compose gives the process environment precedence over `.env`,
      # so an interpolated form could be flipped by a stray variable - the trap the note below
      # records for FACTORY_DEPLOY_TRIGGER_ENABLED.
      FACTORY_CODEREVIEW_ENABLED: "false"
      # FACTORY_DEPLOY_TRIGGER_ENABLED IS DELIBERATELY ABSENT, and must stay absent. The
      # deployer must never start workflows - it is the executor, and the trigger belongs
      # on the container that receives the signed webhook. Absence achieves that on its
      # own: this service has no `env_file`, so the variable reaches no process here and
      # application.yml's `${FACTORY_DEPLOY_TRIGGER_ENABLED:false}` default applies.
      #
      # It used to be pinned here as "false", which was worse than useless. This container
      # runs `docker compose` against this very file, and compose gives the process
      # environment precedence over `.env` - so with the flag set true in `.env`, the
      # deployer's own reconcile would re-render `software-factory` with the trigger
      # FALSE. Auto-deploy would have worked exactly once and then quietly switched itself
      # off, on the deploy that was supposed to enable it.
      #
      # If you ever add `env_file: .env` to this service, this reasoning breaks.
      FACTORY_DEPLOY_SYNC_CONFIG: ${FACTORY_DEPLOY_SYNC_CONFIG:-true}
      FACTORY_DEPLOY_ROLLBACK_ENABLED: ${FACTORY_DEPLOY_ROLLBACK_ENABLED:-true}
      FACTORY_DEPLOY_SERVICES: ${FACTORY_DEPLOY_SERVICES:-backend,frontend,software-factory}
      # An allowlist, not a denylist: a service added to this file next year is held for a
      # human by default rather than silently recreated by the first deploy that touches
      # it. The absentees are absent for concrete reasons - recreating
      # dependencytrack-apiserver crash-loops it unless its KEK comes from env,
      # langfuse-clickhouse carries a pinned image and a lazy-materialisation workaround,
      # and mongodb, elasticsearch and kafka are the data. Widening this is a config change.
      # trivy-server is on this list from the day it was added, on purpose. It is
      # stateless (its only state is a re-downloadable DB cache in a named volume) and
      # holds no credential, so recreating it is safe - and leaving it off would make the
      # very merge that introduces it decline as `held-back`, which is the
      # self-perpetuating wedge that froze the deploy directory from #130 to #136.
      # pinggy is DELIBERATELY NOT on this list, and the "recreating pinggy collides with
      # its own still-live tunnel" caution above is kept because nobody has disproved it.
      # It is tempting to add it: `sysctls:` applies at container *creation*, not on
      # `docker compose restart`, so the IPv6 fix below only takes effect when something
      # recreates pinggy. But pinggy is the single point of ingress for every public
      # hostname, and one PINGGY_TOKEN admits one active tunnel (see the `+force` note in
      # CLAUDE.md). If a recreate can ever race its own outgoing session, putting pinggy
      # here converts a manual step into an unattended, automated outage of the whole site.
      #
      # The asymmetry decides it: leaving pinggy off costs one manual
      # `docker compose -f docker-compose.prod.yml up -d pinggy` after this merges - which
      # this change needs anyway, because the allowlist is read from the RUNNING deployer
      # ("A decline does not clear itself", docs/runbooks/deploy.md) and so would not have
      # applied to this deploy regardless. Adding it risks the site.
      #
      # To settle it properly: recreate pinggy by hand while watching its log for
      # "A tunnel with the same token is already active". If a clean recreate reconnects,
      # add pinggy here and cite that observation.
      FACTORY_DEPLOY_RECREATABLE: ${FACTORY_DEPLOY_RECREATABLE:-backend,frontend,software-factory,nginx,alloy,searxng,temporal-ui,dependencytrack-frontend,trivy-server}
      # All three are the HOST path, not a container-private one, and the mount below puts
      # the deploy directory at that same path inside this container. See the volume for
      # why anything else cannot work.
      FACTORY_DEPLOY_COMPOSE_FILE: ${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}/docker-compose.prod.yml
      FACTORY_DEPLOY_SCRIPT: ${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}/scripts/restart-prod.sh
      FACTORY_DEPLOY_REPO_DIR: ${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}
      FACTORY_DEPLOY_REPO_URL: ${FACTORY_DEPLOY_REPO_URL:-https://github.com/simonjamesrowe/simonrowe-dev-monorepo.git}
      FACTORY_DEPLOY_STATE_DIR: /var/run/deploy-state
      # git refuses to operate on a repository owned by another user ("detected dubious
      # ownership"). The deploy directory belongs to the host login (uid 1000) and this
      # container runs as `factory` (uid 10003), so without this every sync-config fails -
      # and it fails with the misleading message "<dir> is not a git checkout", because
      # the script only sees `git rev-parse HEAD` return non-zero.
      #
      # Set via GIT_CONFIG_COUNT rather than a `git config --global` in the image: it is
      # visible in the compose file next to the mount that causes it, and it needs no
      # rebuild. Scoped to the one directory rather than `*`.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}
      # For the failure-path agent and for posting the write-up. The agent itself gets no
      # Bash tool and ClaudeCliRunner strips everything outside its allowlist from the
      # child process, so the key below never reaches it.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?set GITHUB_APP_CLIENT_ID in .env}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN in .env}
      FACTORY_DEPLOY_MODEL: ${FACTORY_DEPLOY_MODEL:-sonnet}
      FACTORY_DEPLOY_EFFORT: ${FACTORY_DEPLOY_EFFORT:-medium}
      # Nightly platform datastore backup (Postgres x4 + ClickHouse). It lives here for
      # the same reason the deploy does: it needs `docker exec` into the datastores, and
      # constitution 2.0.0 keeps host-level container access off the container that
      # terminates public traffic.
      #
      # On by default. This registers PlatformBackupActivitiesImpl, which is the
      # only thing that lets a container execute the capture. A fresh schedule is active;
      # an existing operator pause remains preserved. Assert a live poller on the
      # `platform-backup` task queue afterwards - a healthy container with no poller
      # means the schedule fires and nothing runs. See
      # docs/runbooks/platform-backup-restore.md.
      FACTORY_PLATFORM_BACKUP_ENABLED: ${FACTORY_PLATFORM_BACKUP_ENABLED:-true}
      # HOST paths, like FACTORY_DEPLOY_SCRIPT/_REPO_DIR above. /workspace/repo no
      # longer exists in this container: the deploy directory is mounted at its own
      # host path on both sides so that compose's relative bind mounts resolve
      # identically inside and out. These two were authored against the old mount and
      # point at nothing, so keep these host and container paths identical.
      FACTORY_PLATFORM_BACKUP_SCRIPT: ${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}/scripts/backup-platform.sh
      FACTORY_PLATFORM_BACKUP_REPO_DIR: ${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}
      # No variable whose name contains LINEAR here, on purpose - not the key and not
      # FACTORY_LINEAR_ENABLED, which is what would register the sink in this JVM at all. This
      # container holds the Docker socket; the tracker credential lives only on
      # `software-factory`. DeployerLinearCredentialTest fails the build on either. See
      # docs/runbooks/linear.md.
    # The socket below is root:docker 0660 on the host, and this container runs as
    # `factory` (uid 10003) with no supplementary groups - so mounting it is not on its
    # own enough to be able to use it. Without this the container is healthy, registers
    # its poller, accepts the deploy, and then every `docker compose` call inside pull,
    # recreate and verify fails with "permission denied while trying to connect to the
    # Docker API".
    #
    # Numeric, because the groups have no name inside the image. Defaulted to this host's
    # gids and overridable from .env for a host that differs.
    #
    # The second entry is the group that OWNS .env (the host login's own group, `getent
    # group simonrowe`). `docker compose` interpolates .env on every call, so the deployer
    # must be able to read a 0640 host-owned file. Joining the owning group rather than
    # chgrp'ing .env to `factory` is deliberate and is the difference between a fix that
    # holds and one that does not: `sed -i`, and every editor that writes a temp file and
    # renames it, recreates .env with the host user's default group. A chgrp to `factory`
    # is silently undone by the next edit, and the failure surfaces much later as
    # "open .../.env: permission denied" in the middle of a deploy's recreate phase, after
    # the maintenance page is already up. Observed exactly that way.
    #
    # .env must still be group-readable (0640). It is NOT world-readable, so this does not
    # widen access to any other host user.
    group_add:
      - "${DOCKER_GID:-984}"
      - "${DEPLOY_ENV_GID:-1000}"
    volumes:
      # Root on the host. Unavoidable for anything that deploys; mitigated by this
      # container having no ingress, no published port and no public route.
      - /var/run/docker.sock:/var/run/docker.sock
      # The same mechanism, and the same reason, as the mount `backend` is losing: the
      # compose defaults are Linux paths, and macOS/OrbStack differs. See CLAUDE.md.
      - ${DOCKER_BINARY_PATH:-/usr/bin/docker}:/usr/local/bin/docker:ro
      - ${DOCKER_PLUGINS_PATH:-/usr/libexec/docker/cli-plugins}:/usr/local/lib/docker/cli-plugins:ro
      # The WHOLE deploy directory, READ-WRITE. This is the one genuinely new capability
      # in the feature: the deployer runs git in here, and the compose file, the nginx
      # conf, the maintenance pages and restart-prod.sh all live here.
      #
      # Not a privilege escalation - it already holds the Docker socket, which is root on
      # the host - but a wider blast radius for a bug. It is fenced by sync-config's
      # clean-tree check, its ancestor assertion against a pinned URL, and --ff-only,
      # which together bound it to "some commit on origin/main".
      #
      # It also picks up .env as part of the directory, which it needs because
      # `docker compose` interpolates it. That is not new access: it is the same file
      # `backend` mounts today and is losing.
      #
      # MOUNTED AT ITS OWN HOST PATH, ON BOTH SIDES. This looks redundant and is not: it
      # is the only arrangement that works. This container drives the HOST's Docker
      # daemon, and every bind-mount path in this file is interpreted by that daemon, in
      # the host's filesystem namespace. Compose resolves the nine `./...` relative binds
      # here against its project directory, so with the old `.:/workspace/repo` it asked
      # the daemon for `/workspace/repo/frontend/nginx.conf` - a path that exists only
      # inside this container. The daemon does not error on that: it CREATES the missing
      # path on the host as an empty directory, then fails the container with "not a
      # directory: Are you trying to mount a directory onto a file", and litters the host
      # root with /workspace/... while it is at it.
      #
      # Observed on the first real deploy: `frontend` was left in `Created`, the rollback
      # recreated it and hit the identical mount, and the run ended ROLLBACK_FAILED with
      # the maintenance page held up. The blast radius is wider than the frontend -
      # nginx's own proxy conf and the maintenance page directory are two of the nine.
      #
      # Keeping the paths identical means a relative bind resolves to the same absolute
      # path whether compose is run by a human on the host or by this container.
      - ${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}:${DEPLOY_DIR:-/home/simonrowe/workspace/simonjamesrowe/simonrowe-dev-monorepo}
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:?set GITHUB_APP_PRIVATE_KEY_HOST_PATH in .env}:/run/secrets/github-app.pem:ro
      # Read-write here, read-only on nginx. The maintenance flag and the recorded
      # rollback image ids.
      - deploy-state:/var/run/deploy-state
      # Scratch space for the failure-path evidence directory.
      - deployer-workspace:/workspace/scratch
    depends_on:
      temporal:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      deploy-state-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8091 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 4 cat <&3 | grep -q '\"status\":\"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  uploads-init:
    image: busybox
    volumes:
      - backend-uploads:/workspace/uploads
    command: ["sh", "-c", "chown -R 1002:1000 /workspace/uploads"]
    restart: "no"

  # Same pattern, same reason as uploads-init above. Docker creates a named volume
  # root:root 0755 when the image has no such path to copy ownership from, and `deployer`
  # runs as `factory` (uid 10003). Without this, maintenance-on cannot create
  # maintenance.on and pull cannot write rollback-images, so a deploy fails on its second
  # phase having already been accepted. nginx mounts the same volume read-only and runs as
  # root, so it is unaffected either way.
  deploy-state-init:
    image: busybox
    volumes:
      - deploy-state:/var/run/deploy-state
    command: ["sh", "-c", "chown -R 10003:10003 /var/run/deploy-state"]
    restart: "no"

  backend:
    image: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-backend:latest
    # Memory cap. Measured steady-state PSS on the Pi is noted below; the limit
    # carries roughly 2x headroom. NOTE: INERT until the kernel memory cgroup is
    # enabled - see scripts/enable-memory-cgroup.sh.
    # Measured: ~842MB; the buildpack JVM has no explicit -Xmx and sizes from this limit
    mem_limit: 2g
    mem_reservation: 512m
    # `missing`, not `always`. scripts/monitor-prod.sh runs a bare `docker compose up -d`
    # every minute whenever it sees anything unsettled, and that command resolves :latest
    # with no flag to stop it. With `always`, two things follow: a rollback cannot hold -
    # the watchdog re-pulls the broken :latest within 60 seconds and the site breaks again
    # with nothing in the deploy log to explain it - and the watchdog can silently upgrade
    # this service as a side effect of healing an unrelated container.
    #
    # With `missing`, pulling is something only the deployer and an explicit
    # restart-prod.sh run do. restart-prod.sh is unaffected: it runs `docker compose pull`
    # explicitly before `up -d`.
    pull_policy: missing
    user: "0:0"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Disable Class Data Sharing to prevent G1GC SIGSEGV crash on aarch64 (JDK-21 bug)
      JAVA_TOOL_OPTIONS: "-Xshare:off"
      SPRING_MONGODB_URI: mongodb://mongodb:27017/simonrowe
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      CORS_ALLOWED_ORIGINS: https://simonrowe.dev,https://www.simonrowe.dev
      MANAGEMENT_SERVER_PORT: "8081"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      OTEL_SERVICE_NAME: simonrowe-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # Emit one-line JSON (Elastic Common Schema) to stdout so Alloy/Loki can
      # ingest and query structured fields (trace.id/span.id included for correlation).
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      UPLOADS_PATH: uploads/
      # The host credential file is mounted read-only below. The in-container path is
      # fixed so Application Default Credentials never depends on a host path.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-cloud-tts.json
      NARRATION_ENABLED: ${NARRATION_ENABLED:-false}
      NARRATION_MAX_BLOG_CHARACTERS: ${NARRATION_MAX_BLOG_CHARACTERS:-50000}
      NARRATION_MONTHLY_CHARACTER_LIMIT: ${NARRATION_MONTHLY_CHARACTER_LIMIT:-1000000}
      NARRATION_POLL_INTERVAL: ${NARRATION_POLL_INTERVAL:-5s}
      NARRATION_OPERATION_TIMEOUT: ${NARRATION_OPERATION_TIMEOUT:-5m}
      NARRATION_LEASE_DURATION: ${NARRATION_LEASE_DURATION:-2m}
      NARRATION_RECOVERY_DELAY: ${NARRATION_RECOVERY_DELAY:-30s}
      NARRATION_RATE_LIMIT_REQUESTS_PER_MINUTE: ${NARRATION_RATE_LIMIT_REQUESTS_PER_MINUTE:-10}
      GOOGLE_CLOUD_TTS_PROJECT_ID: ${GOOGLE_CLOUD_TTS_PROJECT_ID:-}
      GOOGLE_CLOUD_TTS_PROJECT_NUMBER: ${GOOGLE_CLOUD_TTS_PROJECT_NUMBER:-}
      # Preferred on this host: the Pi has no credential file, so narration
      # authenticates with a restricted API key instead of ADC. When set, the
      # credentials mount below is unused and may stay at its /dev/null default.
      GOOGLE_CLOUD_TTS_API_KEY: ${GOOGLE_CLOUD_TTS_API_KEY:-}
      GOOGLE_CLOUD_TTS_OUTPUT_BUCKET: ${GOOGLE_CLOUD_TTS_OUTPUT_BUCKET:-}
      GOOGLE_CLOUD_TTS_LOCATION: ${GOOGLE_CLOUD_TTS_LOCATION:-global}
      GOOGLE_CLOUD_TTS_LANGUAGE_CODE: ${GOOGLE_CLOUD_TTS_LANGUAGE_CODE:-en-AU}
      GOOGLE_CLOUD_TTS_VOICE_NAME: ${GOOGLE_CLOUD_TTS_VOICE_NAME:-en-AU-Chirp3-HD-Achird}
      # Self-hosted SearXNG web search (no API key). Points at the internal searxng container;
      # if searxng is down the tool degrades gracefully (returns "unavailable", never errors).
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    volumes:
      - backend-uploads:/workspace/uploads
      # NO DOCKER SOCKET, no docker CLI, no compose file and no .env copy. All five
      # mounts were removed with RedeployService: the admin-UI redeploy is gone, and
      # nothing else in backend/src/main/java shells out to a host process (there is a
      # test asserting no ProcessBuilder remains).
      #
      # This is the largest single security improvement in the auto-deploy change, and
      # it is a consequence of the feature rather than the point of it: the container
      # serving the public API no longer holds host-root capability, nor a copy of the
      # deployment configuration and every production secret. Deploys are performed by
      # the `deployer` service above, which has no ingress at all.
      #
      # DOCKER_BINARY_PATH / DOCKER_PLUGINS_PATH survive as variables - the deployer
      # uses them now - so the macOS/OrbStack note in CLAUDE.md stays true, pointed at
      # a different service.
      # /dev/null keeps a disabled deployment bootable before credentials are configured.
      # Once enabled, GOOGLE_CLOUD_TTS_CREDENTIALS_PATH must name the real host JSON file.
      - ${GOOGLE_CLOUD_TTS_CREDENTIALS_PATH:-/dev/null}:/run/secrets/google-cloud-tts.json:ro
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      # A bare TCP connect (the previous `echo > /dev/tcp` check) only proves the socket
      # accepts connections - it stays "healthy" even if Tomcat's accepted the connection
      # but the app is wedged and never sends a response. Send a real HTTP request over
      # /dev/tcp (no curl/wget in this buildpack image) and require an actual 200 OK with
      # an UP body, so a hung JVM is correctly reported unhealthy.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 20 cat <&3 | grep -q '\"status\":\"UP\"'",
        ]
      # /actuator/health aggregates Elasticsearch, Kafka, Mongo, mail and SSL, and the
      # Kafka indicator builds a fresh AdminClient on every call. On this Pi the whole
      # response measures ~9s while reporting {"status":"UP"} - so the old `timeout 4`
      # + `timeout: 5s` budget marked a perfectly healthy backend unhealthy, which is
      # what made `up -d` abort with "backend is unhealthy" and strand `frontend` in
      # `created` (a 502 on www until someone re-ran the deploy). The budget now has
      # real headroom over the measured cost.
      #
      # `interval` is 30s, not 10s: at 10s a 9s probe leaves almost no idle time and
      # each probe opens a Kafka AdminClient, so frequent probing made the thing it
      # was measuring slower.
      interval: 30s
      timeout: 25s
      retries: 5
      # The Pi needs ~90s to boot the backend, well past the old 10s+5x10s budget.
      # Compose then aborted `up -d` with "backend is unhealthy" — leaving frontend
      # in `created` and skipping the nginx restart — seconds before the app came up.
      start_period: 120s

  frontend:
    image: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-frontend:latest
    # Memory cap. Measured steady-state PSS on the Pi is noted below; the limit
    # carries roughly 2x headroom. NOTE: INERT until the kernel memory cgroup is
    # enabled - see scripts/enable-memory-cgroup.sh.
    # Measured: ~4MB (static nginx)
    mem_limit: 256m
    mem_reservation: 64m
    # `missing`, not `always`. scripts/monitor-prod.sh runs a bare `docker compose up -d`
    # every minute whenever it sees anything unsettled, and that command resolves :latest
    # with no flag to stop it. With `always`, two things follow: a rollback cannot hold -
    # the watchdog re-pulls the broken :latest within 60 seconds and the site breaks again
    # with nothing in the deploy log to explain it - and the watchdog can silently upgrade
    # this service as a side effect of healing an unrelated container.
    #
    # With `missing`, pulling is something only the deployer and an explicit
    # restart-prod.sh run do. restart-prod.sh is unaffected: it runs `docker compose pull`
    # explicitly before `up -d`.
    pull_policy: missing
    restart: unless-stopped
    # NO volumes, and specifically no bind mount over /etc/nginx/conf.d/default.conf.
    #
    # Dockerfile.frontend already copies frontend/nginx.conf into the image, so the routing
    # config and the bundle it routes for are built from one commit and ship together. This
    # service used to ALSO bind-mount `./frontend/nginx.conf` over the same path, which
    # silently won: the container ran whatever the deploy checkout's working tree happened
    # to hold, regardless of the image CI had just built and verified.
    #
    # That shipped broken twice. PR #65 added `location = /mcp` and every POST to it returned
    # 405 in production. PR #132 added `location /s/` and every share link - including ones
    # already pasted into other people's Slack channels - fell through to the SPA and rendered
    # its 404. Both times the image was right and the mount masked it, and both times the
    # deploy reported success: a deploy whose sync-config phase declines still pulls and
    # recreates images (SyncDecision.deployImagesAnyway), so the checkout can sit frozen
    # while :latest keeps moving. The mount turned that into silently wrong routing.
    #
    # Unlike the `nginx` proxy below - stock nginx:alpine, no image of its own, so its conf
    # HAS to come from a mount - this service builds an image, so the config belongs in it.
    # A routing change now ships the way every other frontend change does: rebuild, pull,
    # recreate. Guarded by scripts/test/test-frontend-nginx-shipping.sh.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # The themed maintenance and unavailable pages. Bind-mounted like the proxy conf, so
      # they come from the deploy directory rather than from an image - which matters
      # because the frontend image is exactly what is unavailable when they are served.
      - ./config/nginx/maintenance:/etc/nginx/maintenance:ro
      # READ-ONLY on purpose. The flag is written by `deployer` and only read here; nginx
      # decides what to serve, it never decides whether a deploy is in progress.
      - deploy-state:/var/run/deploy-state:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      portainer:
        condition: service_started
      langfuse:
        condition: service_started
    healthcheck:
      # Must hit the self-contained /healthz in the default_server block, NOT `/`.
      # `/` with Host: localhost falls through to the simonrowe.dev block and proxies
      # to `frontend`, so a stopped frontend would mark nginx unhealthy - and pinggy
      # waits on nginx being service_healthy, which would take every public hostname
      # (including Portainer) offline. See config/nginx/nginx-proxy.conf.
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  pinggy:
    image: pinggy/pinggy
    restart: unless-stopped
    # Outage 2026-09-06: a.pinggy.io resolves an IPv6 address first
    # (2a01:7e01::f03c:95ff:fefb:3443) and this host has no IPv6 default route -
    # `ip -6 route` shows only `fe80::/64` link-local, and `curl -6` to any IPv6
    # target fails outright. pinggy dialled it anyway, got
    # `Error: Tunnel disconnected before establishment: Could not connect:
    # Resource temporarily unavailable` (EAGAIN) on every attempt, and retried
    # forever (645 failed connects, 47,420 "Reconnecting" log lines over ~4
    # hours) while every public hostname - www, api, console, langfuse,
    # temporal, dependency-track, all behind this one tunnel - was dark. A raw
    # TCP connect to the same edge on IPv4 port 443 succeeded immediately, and a
    # plain `docker restart pinggy` (forcing fresh DNS resolution, which then
    # happened to pick IPv4) brought the whole site back with no other change.
    #
    # Disabling IPv6 in this container's network namespace removes AAAA from
    # what `getaddrinfo` can return under `AI_ADDRCONFIG` (the default for a
    # client with no local IPv6 configured), so pinggy's own resolver should
    # only ever see the IPv4 address and dial that.
    #
    # Honesty check: this is verified reasoning, not a fix proven in
    # production. The 2026-09-06 outage was cleared by a restart before this
    # sysctl existed, so nobody has watched IPv6 come back and get refused by
    # this setting - only watched a plain restart pick IPv4 by luck of
    # re-resolving. If a.pinggy.io's IPv6 route ever becomes reachable from
    # this host (e.g. an eventual IPv6 default route), the reasoning above no
    # longer holds and this should be revisited rather than assumed correct.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    command:
      - --token
      - ${PINGGY_TOKEN}
      - -l
      - nginx:80
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      # Cannot see a dead tunnel: this only proves PID 1 exists. A hung/looping
      # pinggy process (see the 2026-09-06 outage above) reports `healthy`
      # forever. A real replacement probe was deliberately not written here -
      # there is no way to verify one against the pinggy/pinggy image from this
      # workspace, and a guessed healthcheck that fails permanently would be
      # worse than none (Docker never restarts an `unhealthy` container either -
      # see docs/runbooks/prod-monitoring.md). `monitor-prod.sh` layer 1 is the
      # detector instead: it restarts pinggy whenever the public site check
      # fails, regardless of what this healthcheck reports.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  alloy:
    image: grafana/alloy:latest
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~263MB
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # --storage.path below. WITHOUT this volume it resolves to the container's
      # writable layer, so every recreate destroys the read cursors - see the
      # alloy-data comment in the volumes section.
      - alloy-data:/var/lib/alloy/data
    env_file:
      - .env
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  portainer:
    image: portainer/portainer-ce:2.39.2
    restart: unless-stopped
    command:
      - --host
      - unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    # Internal-only metasearch used by the backend's webSearch chat tool. No published host
    # ports and not an nginx upstream — reachable only in-cluster at http://searxng:8080.
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-searxng-internal-signing-key-change-me}
    volumes:
      # Not read-only: the SearXNG entrypoint substitutes $SEARXNG_SECRET into settings.yml.
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:8080/healthz' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  langfuse-db:
    image: postgres:15
    # Memory cap. Measured steady-state PSS on the Pi is noted below; the limit
    # carries roughly 2x headroom. NOTE: INERT until the kernel memory cgroup is
    # enabled - see scripts/enable-memory-cgroup.sh.
    # Measured: ~275MB; shared by the langfuse AND dtrack databases
    mem_limit: 1g
    mem_reservation: 256m
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${LANGFUSE_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:-postgres}
      - POSTGRES_DB=${LANGFUSE_DB_NAME:-langfuse}
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Chowns the langfuse-clickhouse-backups volume so ClickHouse can write its
  # BACKUP output there. NOT optional: /backups does not exist in the ClickHouse
  # image, so Docker creates the named volume empty and root-owned, while the
  # server below runs as 101:101 — every `BACKUP DATABASE default TO File(...)`
  # would fail on permissions. (langfuse-clickhouse-data does not need this
  # because /var/lib/clickhouse *does* exist in the image, so Docker seeds the
  # volume with the image's content and ownership.) Same pattern as uploads-init.
  #
  # One-shot: it exits 0 and stays `exited` for the life of the stack. That is
  # success, so it is registered in ONESHOT_SERVICES in scripts/monitor-prod.sh —
  # a one-shot missing from that list reads as a broken container on every cron
  # tick and makes the watchdog reconcile the whole stack once a minute forever.
  clickhouse-backups-init:
    image: busybox
    volumes:
      - langfuse-clickhouse-backups:/backups
    command: ["sh", "-c", "chown -R 101:101 /backups"]
    restart: "no"

  langfuse-clickhouse:
    # Pinned to the exact build the data directory was created with. The upstream Langfuse
    # compose file itself uses an unpinned tag; do NOT change this to a bare `latest` — 26.7
    # broke the scores.all query (langfuse/langfuse#14065), fixed only by the
    # CLICKHOUSE_DISABLE_LAZY_MATERIALIZATION env var below, not by the ClickHouse version.
    # Only move this pin forward deliberately, verifying scores.all still works afterward.
    image: clickhouse/clickhouse-server:26.7.1.1315
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~906MB
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    user: "101:101"
    depends_on:
      clickhouse-backups-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
      # Where `BACKUP DATABASE default TO File('...')` writes. Nothing else mounts
      # this: scripts/backup-platform.sh (in the `deployer`) extracts the archive with
      # `docker cp` and sweeps stale staging files with `docker exec`, so it needs the
      # Docker socket rather than the volume.
      - langfuse-clickhouse-backups:/backups
      # Declares /backups as an allowed backup path. Without it, BACKUP is
      # refused outright and no ClickHouse data is ever captured.
      - ./config/clickhouse/backup-disk.xml:/etc/clickhouse-server/config.d/backup-disk.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-redis:
    image: redis:7
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~16MB
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_AUTH}
      --maxmemory-policy noeviction
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~254MB
    mem_limit: 512m
    mem_reservation: 128m
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-worker:
    image: langfuse/langfuse-worker:3.212.0
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~510MB
    mem_limit: 1500m
    mem_reservation: 512m
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    env_file:
      - .env
    environment: &langfuse-env
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-postgres}:${LANGFUSE_DB_PASSWORD:-postgres}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH}
      # Works around a ClickHouse 26.x lazy-materialization bug that 500s the scores.all
      # query (langfuse/langfuse#14065, confirmed fix in #13809). Keep this set even if the
      # ClickHouse pin above is later upgraded, until upstream confirms it's no longer needed.
      CLICKHOUSE_DISABLE_LAZY_MATERIALIZATION: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    # Belongs to langfuse-worker (the block above); the env map it closes is the
    # &langfuse-env anchor that the langfuse web service merges in.
    healthcheck:
      # Same $$HOSTNAME bind caveat as the langfuse web service - localhost:3030 is refused.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$HOSTNAME:3030/api/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 180s

  langfuse:
    image: langfuse/langfuse:3.212.0
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~950MB
    mem_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    env_file:
      - .env
    environment:
      <<: *langfuse-env
      # Deterministic bootstrap: on startup Langfuse provisions the org, project, an admin
      # membership, and FIXED project keys — but only creates resources that do not already
      # exist, so this is idempotent and safe to leave in permanently. The project public/
      # secret keys are sourced from the same values Alloy uses as its OTLP basic-auth
      # credentials (config/alloy/config.alloy), so the exporter and the project agree by
      # construction and traces land in the provisioned project without manual key copying.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-simonrowe}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Simon Rowe}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-simonrowe-dev}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-simonrowe.dev}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@simonrowe.dev}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Simon Rowe}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    healthcheck:
      # Two probes, deliberately. `/api/public/ready` covers the backing services
      # (Postgres/ClickHouse/Redis), but it is a plain API route that does NOT exercise the
      # React server-render path. On 2026-08-14 Langfuse came up with a broken next-auth
      # module ("Failed to load external module .../react: SyntaxError"), so every *page*
      # 500'd - including the Auth0 sign-in - while the API routes stayed 200. Only a probe
      # of `/` catches that, and with no healthcheck at all the container simply read as
      # "Up" for 10 days.
      #
      # MUST target $$HOSTNAME, not localhost: Next.js standalone binds to the address in
      # HOSTNAME (the container id), so the port is open on the container IP only and
      # localhost:3000 is refused. `$$` escapes compose interpolation so the container's
      # own shell expands it. The image has no curl; wget exits non-zero on HTTP errors.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://$$HOSTNAME:3000/api/public/ready && wget -q -O /dev/null http://$$HOSTNAME:3000/ || exit 1",
        ]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 180s

  # One-shot: create the Dependency-Track database and role inside the existing
  # langfuse Postgres. The langfuse-db-data volume predates this service, so
  # Postgres' own /docker-entrypoint-initdb.d scripts will never run again -
  # this is the only way to add a database to an initialised cluster.
  # Idempotent: safe to re-run on every `docker compose up`.
  dependencytrack-db-init:
    image: postgres:15
    restart: "no"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      PGHOST: langfuse-db
      PGUSER: ${LANGFUSE_DB_USER:-postgres}
      PGPASSWORD: ${LANGFUSE_DB_PASSWORD:-postgres}
      DT_DB_PASSWORD: ${DEPENDENCYTRACK_DB_PASSWORD:?set DEPENDENCYTRACK_DB_PASSWORD in .env}
    # The ALTER ROLE is deliberately UNCONDITIONAL, while the CREATE stays guarded.
    # Reason: if this ever ran with DEPENDENCYTRACK_DB_PASSWORD empty, Postgres logs
    # "empty string is not a valid password, clearing password" and CREATE ROLE still
    # SUCCEEDS - the role exists with no password and this service exits 0, while the
    # apiserver then fails authentication forever. Because the pg_roles guard skips the
    # CREATE from then on, simply adding the variable and re-running would NOT repair it.
    # ALTER ROLE is idempotent, so running it every time both fixes that state and
    # re-syncs the role after a deliberate password rotation in .env.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='dtrack'" | grep -q 1 || \
          psql -c "CREATE ROLE dtrack LOGIN PASSWORD '$$DT_DB_PASSWORD'"
        psql -c "ALTER ROLE dtrack LOGIN PASSWORD '$$DT_DB_PASSWORD'"
        psql -tAc "SELECT 1 FROM pg_database WHERE datname='dtrack'" | grep -q 1 || \
          psql -c "CREATE DATABASE dtrack OWNER dtrack"
        echo "dependency-track database ready"

  dependencytrack-apiserver:
    image: dependencytrack/apiserver:5.0.3
    restart: unless-stopped
    depends_on:
      dependencytrack-db-init:
        condition: service_completed_successfully
    # The image sets -XX:MaxRAMPercentage=80.0 with no fixed -Xmx, so the heap
    # tracks this limit (~1.6GB here) and the remaining 20% covers off-heap
    # memory, thread stacks and the OS. Do not use EXTRA_JAVA_OPTIONS to set
    # -Xmx: it has a history of argument-parsing bugs, and a fixed heap equal to
    # the cgroup limit is an OOMKill recipe.
    #
    # 2g matches the upstream Helm chart default for v5. The old 4GB startup
    # gate was removed in 4.14.0; v5 documents 2GB as the starting point with a
    # 1GB floor, and the project's own quickstart runs at 1Gi.
    #
    # ⚠️ This limit is NOT enforced until the kernel memory cgroup is enabled: the Pi
    # boots with `cgroup_disable=memory` (prepended by the Raspberry Pi firmware, which
    # is why it appears in /proc/cmdline but in no file under /boot), so Docker accepts
    # the value and applies nothing - `docker stats` reports 0B/0B. Every other
    # mem_limit in this file has the same caveat.
    #
    # Fix it with `scripts/enable-memory-cgroup.sh --apply` plus a planned reboot; see
    # docs/runbooks/prod-monitoring.md. Until then, note the second-order effect: the
    # image sets -XX:MaxRAMPercentage=80.0, so with no enforced limit this JVM sizes its
    # heap against the *host* 15.84GiB (~12.7GiB) rather than the 2g declared here.
    # Measured steady-state PSS is ~595MB, so 2g remains the right cap once live.
    mem_limit: 2g
    mem_reservation: 512m
    volumes:
      # The image sets HOME=/data/, and /data holds the Lucene search indexes plus
      # analyzer working state. Without a volume every container recreation (image
      # pull, version bump, --force-recreate) wipes it and forces a full index rebuild
      # on four ARM cores. It also means that if DT_SECRET_MANAGEMENT_DATABASE_KEK were
      # ever empty, the fallback keyset file under /data would be ephemeral too - the
      # bug commit a3079b0 fixed. Persisting /data closes both.
      - dependencytrack-data:/data
    environment:
      DT_DATASOURCE_URL: jdbc:postgresql://langfuse-db:5432/dtrack
      DT_DATASOURCE_USERNAME: dtrack
      DT_DATASOURCE_PASSWORD: ${DEPENDENCYTRACK_DB_PASSWORD:?set DEPENDENCYTRACK_DB_PASSWORD in .env}
      # Cap the connection pool (v5 default is 30). langfuse-db is stock postgres:15 at
      # max_connections=100 and is now shared by the Langfuse app, the Langfuse worker
      # and this apiserver, which opens more than one pool. An unbounded-by-default
      # apiserver could exhaust the server's connection slots, and the visible symptom
      # would be LANGFUSE failing to connect - a confusing place to start debugging.
      # 10 is ample for a four-project portfolio.
      DT_DATASOURCE_POOL_MAX_SIZE: "10"
      # By default DT generates a key encryption key (KEK) and writes it to a
      # keyset file at ${user.home}/.dependency-track/keys/ - and the image sets
      # HOME=/data/. When nothing was mounted at /data, every container
      # recreation (image pull, version bump) generated a new KEK and then
      # permanently failed to start against the existing encrypted secrets in
      # Postgres. Setting the KEK explicitly is what actually makes it stable;
      # the dependencytrack-data volume above now also persists the fallback
      # keyset, but the pinned value in .env is the copy that gets backed up, so
      # it stays required (hence the :? guard).
      DT_SECRET_MANAGEMENT_DATABASE_KEK: ${DEPENDENCYTRACK_KEK:?set DEPENDENCYTRACK_KEK in .env}
      DT_OIDC_ENABLED: "true"
      DT_OIDC_ISSUER: ${DEPENDENCYTRACK_OIDC_ISSUER:?set DEPENDENCYTRACK_OIDC_ISSUER in .env, with a trailing slash}
      DT_OIDC_CLIENT_ID: ${DEPENDENCYTRACK_OIDC_CLIENT_ID:?set DEPENDENCYTRACK_OIDC_CLIENT_ID in .env}
      DT_OIDC_USERNAME_CLAIM: email
      DT_OIDC_TEAMS_CLAIM: https://simonrowe.dev/roles
      DT_OIDC_USER_PROVISIONING: "true"
      DT_OIDC_TEAM_SYNCHRONIZATION: "true"
    healthcheck:
      # MUST probe the API port (8080), not just the management port (9000).
      # /health/ready on 9000 only reports that the datasource is reachable, and it is
      # served by a different, earlier-started listener than the Jetty API server. On
      # 2026-08-14 the API server failed to start (NoClassDefFoundError while loading the
      # CEL policy engine) yet the JVM stayed alive, because the health listener and the
      # Hikari pool are non-daemon threads. The container therefore reported `healthy`
      # for 10 days while every /api/ request 502'd and Auth0 login was impossible -
      # `restart: unless-stopped` never fired, because the process never exited.
      # Probing /api/version proves the thing clients actually use is serving.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/health/ready >/dev/null && curl -fsS http://localhost:8080/api/version >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  dependencytrack-frontend:
    image: dependencytrack/frontend:5.0.3
    # Memory cap. Measured steady-state PSS on the Pi is noted per service; limits
    # carry roughly 2x headroom. NOTE: these are INERT until the kernel memory
    # cgroup is enabled - see scripts/enable-memory-cgroup.sh. Until then Docker
    # accepts them and enforces nothing (`docker stats` shows 0B / 0B).
    # Measured: ~2MB (static nginx)
    mem_limit: 256m
    mem_reservation: 64m
    restart: unless-stopped
    depends_on:
      dependencytrack-apiserver:
        condition: service_started
    environment:
      API_BASE_URL: https://dependency-track.simonrowe.dev
      OIDC_ISSUER: ${DEPENDENCYTRACK_OIDC_ISSUER:?set DEPENDENCYTRACK_OIDC_ISSUER in .env, with a trailing slash}
      OIDC_CLIENT_ID: ${DEPENDENCYTRACK_OIDC_CLIENT_ID:?set DEPENDENCYTRACK_OIDC_CLIENT_ID in .env}
      # MUST be set explicitly. The entrypoint assigns config via jq
      # unconditionally, and an unset variable becomes null - which silently
      # removes the OpenID login button with no error anywhere.
      OIDC_SCOPE: "openid profile email"
      OIDC_FLOW: "code"
      OIDC_LOGIN_BUTTON_TEXT: "Login with Auth0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # The only vulnerability source in this stack that can speak `pkg:apk/*` and `pkg:deb/*`.
  #
  # WHY IT EXISTS. Dependency-Track's `internal` analyzer matches OS packages through NVD
  # CPEs, and NVD names an Ubuntu/Alpine *source* package while an SBOM lists *binary*
  # packages - so `libssl3t64` never matches an `openssl` advisory. Measured 2026-08-31:
  # `frontend-image` reported Risk Score 0 while carrying 20 fixable Alpine findings (2
  # HIGH) on openssl, and `backend-image` showed 25 findings on the one Ubuntu package NVD
  # happened to match where a distro-aware scan finds 242. A
  # container project's `0` meant "no source can match these coordinates", not "clean", and
  # nothing anywhere said so. OSV's `Alpine`/`Ubuntu` ecosystems are only a partial answer
  # (they are keyed on the source package too, and 69 of 99 debs here have a source name
  # that differs from the binary name), which is why this is a Trivy server and not two
  # more entries in the OSV ecosystem list. See docs/runbooks/dependency-track.md.
  #
  # NO INGRESS, NO ROUTE. It is reachable only on the compose network; nginx does not know
  # it exists. It still runs with `--token` because Dependency-Track refuses to accept a
  # Trivy analyzer configuration that has no API token ("No API token provided" -
  # TrivyVulnAnalyzerFactory), so a token exists either way; giving the server the matching
  # value makes it mean something rather than being ignored, and is cheap insurance against
  # anything else on the bridge network.
  #
  # NOT a `depends_on` of dependencytrack-apiserver, deliberately. The analyzer degrades to
  # "this one scan failed, retry later" when the server is unreachable, so gating the
  # apiserver on it would trade a soft failure for a hard startup dependency - on the one
  # container in this file that is NOT in FACTORY_DEPLOY_RECREATABLE (its KEK makes
  # recreation risky), i.e. the worst possible place to add a new boot gate.
  trivy-server:
    image: aquasec/trivy:0.74.0
    restart: unless-stopped
    command:
      - server
      - --listen
      - 0.0.0.0:4954
      # DELIBERATELY `:-` WITH A DEFAULT, NOT `:?`. A required variable here would be a
      # foot-gun out of all proportion to what it protects: an unset `:?` makes the WHOLE
      # compose file fail to interpolate, which fails `sync-config`'s validation as
      # `missing-variable` (wedging the deploy directory - and a held-back checkout is
      # self-perpetuating) *and* breaks `monitor-prod.sh`'s bare `up -d` every minute,
      # taking the self-healing watchdog down with it. What it would protect is not really
      # a secret: this server has no ingress, holds only Aqua's public vulnerability DB,
      # and the token exists because DependencyTrack's analyzer refuses to be configured
      # without one, not because anything here is confidential. Override it in `.env` if
      # you want; the value must simply match the Dependency-Track secret.
      - --token
      - ${TRIVY_SERVER_TOKEN:-dependency-track}
    volumes:
      # The vulnerability DB is 1.27GiB on disk (measured, 0.74.0) and is re-downloaded
      # from scratch without this volume - on every container recreation, over the Pi's
      # link. Budget the disk before deploying (`df -h /`); see "Disk and database size"
      # in docs/runbooks/dependency-track.md.
      - trivy-cache:/root/.cache/trivy
    # Sized for the DB, not the process: a scan memory-maps the 1.27GiB database, so the
    # idle footprint is a poor guide. NOT measured on the Pi yet - revisit once `docker
    # stats` can report it, which today it cannot: this limit is inert until the kernel
    # memory cgroup is enabled (scripts/enable-memory-cgroup.sh), like every other limit
    # in this file.
    mem_limit: 2g
    mem_reservation: 256m
    healthcheck:
      # /healthz is a genuine READINESS probe, unusually for this stack: trivy downloads
      # and loads the DB *before* it binds the listener (verified against 0.74.0 - the
      # "Listening 0.0.0.0:4954" log line comes after "Artifact successfully downloaded"),
      # so a 200 here means it can actually answer a scan. Contrast
      # dependencytrack-apiserver, which reported healthy for 10 days with a dead API port.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4954/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      # A cold start must cover the full 1.27GiB DB download; 7s on a laptop, minutes on
      # the Pi. Free once warm - the first successful probe ends the start period early,
      # and the volume above means only the very first boot pays it.
      start_period: 900s

volumes:
  mongodb-data:
  kafka-data:
  elasticsearch-data:
  elasticsearch-backups:
  backend-uploads:
  portainer-data:
  langfuse-db-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  # Staging area for the nightly platform backup: langfuse-clickhouse writes its own
  # BACKUP output here (/backups), and scripts/backup-platform.sh pulls it out with
  # `docker cp`. Transient by design — the script removes the file once it is in the
  # archive, and sweeps orphans from crashed runs on the next pass.
  #
  # A named volume rather than a tmpfs so it survives a ClickHouse restart mid-capture,
  # and so the sweep has something stable to clean. Created root-owned at a path absent
  # from the image, hence clickhouse-backups-init's chown to 101:101.
  langfuse-clickhouse-backups:
  langfuse-redis-data:
  langfuse-minio-data:
  # Alloy's --storage.path, which holds loki.source.docker's positions.yml: one
  # cursor (a unix timestamp) per container, marking how far its logs have been
  # shipped.
  #
  # This volume is not an optimisation. Alloy is in FACTORY_DEPLOY_RECREATABLE, so
  # every deploy recreates it, and monitor-prod.sh's minutely `up -d` can too.
  # With the cursors in the container's writable layer they are destroyed each
  # time, and loki.source.docker re-tails every container FROM THE START - so a
  # deploy re-ships the whole accumulated history of the stack, and does it again
  # on the next deploy. Nothing logs an error; the cost lands as ingested bytes.
  #
  # That is how a 0.58 GB/month workload spent the 50 GB Grafana Cloud free-tier
  # logs allowance in August 2026. Once the allowance is gone the tenant's
  # ingestion limit becomes 0 bytes/sec, Alloy 429s on every batch and drops it,
  # and Loki holds NOTHING for the rest of the calendar month while both the
  # container and its healthcheck stay green. See
  # docs/runbooks/log-shipping.md.
  alloy-data:
  # Dependency-Track's /data (HOME): Lucene indexes and analyzer working state.
  # Persisted so container recreation does not trigger a full index rebuild.
  dependencytrack-data:
  # Trivy's vulnerability database - 1.27GiB, re-downloaded from mirror.gcr.io in full on
  # any recreation without this volume. trivy-server refreshes it in place on a 1-hour
  # ticker (hot-swapped, requests suspended for the swap), so nothing else needs to
  # schedule an update.
  trivy-cache:
  # Where the software factory clones pull-request branches. A named volume rather
  # than a host bind so contributor-authored code never lands on the host filesystem.
  software-factory-workspace:
  # Scratch space for the deployer's failure-path evidence directory.
  deployer-workspace:
  # The deploy flag file and the recorded rollback image ids. Read-write on `deployer`,
  # read-only on `nginx`.
  #
  # A named volume rather than a host bind deliberately: it keeps the flag off the host
  # filesystem, gives nginx a genuinely read-only view, and - found while testing - a host
  # bind mount on macOS does not propagate a delete into an already-running container, so
  # the maintenance page would appear stuck on forever. See
  # scripts/test/test-nginx-maintenance.sh.
  deploy-state:
