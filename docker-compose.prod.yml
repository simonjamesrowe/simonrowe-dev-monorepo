services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: simonrowe
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.17.0
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      path.repo: /usr/share/elasticsearch/backups
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-backups:/usr/share/elasticsearch/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  uploads-init:
    image: busybox
    volumes:
      - backend-uploads:/workspace/uploads
    command: ["sh", "-c", "chown -R 1002:1000 /workspace/uploads"]
    restart: "no"

  backend:
    image: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-backend:latest
    pull_policy: always
    user: "0:0"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Disable Class Data Sharing to prevent G1GC SIGSEGV crash on aarch64 (JDK-21 bug)
      JAVA_TOOL_OPTIONS: "-Xshare:off"
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/simonrowe
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      COMPOSE_PROJECT_NAME: simonrowe-dev-monorepo
      CORS_ALLOWED_ORIGINS: https://simonrowe.dev,https://www.simonrowe.dev
      MANAGEMENT_SERVER_PORT: "8081"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      OTEL_SERVICE_NAME: simonrowe-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      UPLOADS_PATH: uploads/
    volumes:
      - backend-uploads:/workspace/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_BINARY_PATH:-/usr/bin/docker}:/usr/local/bin/docker:ro
      - ${DOCKER_PLUGINS_PATH:-/usr/libexec/docker/cli-plugins}:/usr/local/lib/docker/cli-plugins:ro
      - ./docker-compose.prod.yml:/workspace/docker-compose.prod.yml:ro
      - ./.env:/workspace/.env:ro
    depends_on:
      uploads-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/simonjamesrowe/simonrowe-dev-monorepo-frontend:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      portainer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  pinggy:
    image: pinggy/pinggy
    restart: unless-stopped
    command:
      - --token
      - ${PINGGY_TOKEN}
      - -l
      - nginx:80
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  portainer:
    image: portainer/portainer-ce:2.39.2
    restart: unless-stopped
    command:
      - --host
      - unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongodb-data:
  kafka-data:
  elasticsearch-data:
  elasticsearch-backups:
  backend-uploads:
  portainer-data:
