[versions]
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
graalvmNative = "0.11.3"
opentelemetryInstrumentation = "2.30.0"
checkstyle = "10.21.4"
jacoco = "0.8.15"
cyclonedx = "3.4.1"
sonarqube = "7.4.0.8496"
openpdf = "2.0.3"
commonmark = "0.24.0"
springAi = "2.0.1"
embabel = "1.5.1"
bucket4j = "8.16.1"
thumbnailator = "0.4.20"
mongock = "5.5.1"
googleApiClient = "2.8.0"
googleApiServicesDrive = "v3-rev20250511-2.0.0"
googleAuthLibrary = "1.35.0"
googleHttpClient = "1.47.0"
temporal = "1.36.0"
bouncycastle = "1.85"

[libraries]
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-data-elasticsearch = { module = "org.springframework.boot:spring-boot-starter-data-elasticsearch" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-data-mongodb-test = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-test" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
opentelemetry-spring-boot-starter = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter", version.ref = "opentelemetryInstrumentation" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version = "2.0.5" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-elasticsearch = { module = "org.testcontainers:testcontainers-elasticsearch" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-ai-starter-model-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
spring-ai-starter-mcp-server-webmvc = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc" }
spring-ai-starter-vector-store-elasticsearch = { module = "org.springframework.ai:spring-ai-starter-vector-store-elasticsearch" }
spring-ai-vector-store-advisor = { module = "org.springframework.ai:spring-ai-vector-store-advisor" }
embabel-agent-starter = { module = "com.embabel.agent:embabel-agent-starter", version.ref = "embabel" }
embabel-agent-starter-openai = { module = "com.embabel.agent:embabel-agent-starter-openai", version.ref = "embabel" }
embabel-agent-test = { module = "com.embabel.agent:embabel-agent-test", version.ref = "embabel" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
mongock-bom = { module = "io.mongock:mongock-bom", version.ref = "mongock" }
mongock-springboot-v3 = { module = "io.mongock:mongock-springboot-v3" }
mongock-mongodb-springdata-v4 = { module = "io.mongock:mongodb-springdata-v4-driver" }
google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "googleApiClient" }
google-api-services-drive = { module = "com.google.apis:google-api-services-drive", version.ref = "googleApiServicesDrive" }
google-auth-library-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuthLibrary" }
google-http-client-apache-v5 = { module = "com.google.http-client:google-http-client-apache-v5", version.ref = "googleHttpClient" }
temporal-spring-boot-starter = { module = "io.temporal:temporal-spring-boot-starter", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
