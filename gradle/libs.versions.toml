[versions]
springBoot = "3.5.16"
springDependencyManagement = "1.1.7"
graalvmNative = "0.11.3"
opentelemetryInstrumentation = "2.30.0"
testcontainers = "1.20.4"
checkstyle = "10.21.4"
jacoco = "0.8.12"
cyclonedx = "2.1.0"
sonarqube = "6.0.1.5171"
openpdf = "2.0.3"
commonmark = "0.24.0"
springAi = "1.1.8"
bucket4j = "8.16.1"
thumbnailator = "0.4.20"
mongock = "5.5.1"
googleApiClient = "2.8.0"
googleApiServicesDrive = "v3-rev20250511-2.0.0"
googleAuthLibrary = "1.35.0"
googleHttpClient = "1.45.0"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-data-elasticsearch = { module = "org.springframework.boot:spring-boot-starter-data-elasticsearch" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-spring-boot-starter = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter", version.ref = "opentelemetryInstrumentation" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-mongodb = { module = "org.testcontainers:mongodb" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
testcontainers-elasticsearch = { module = "org.testcontainers:elasticsearch" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-ai-starter-model-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
spring-ai-starter-model-openai-sdk = { module = "org.springframework.ai:spring-ai-starter-model-openai-sdk" }
spring-ai-starter-mcp-server-webmvc = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc" }
spring-ai-starter-vector-store-elasticsearch = { module = "org.springframework.ai:spring-ai-starter-vector-store-elasticsearch" }
spring-ai-advisors-vector-store = { module = "org.springframework.ai:spring-ai-advisors-vector-store" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
mongock-bom = { module = "io.mongock:mongock-bom", version.ref = "mongock" }
mongock-springboot-v3 = { module = "io.mongock:mongock-springboot-v3" }
mongock-mongodb-springdata-v4 = { module = "io.mongock:mongodb-springdata-v4-driver" }
google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "googleApiClient" }
google-api-services-drive = { module = "com.google.apis:google-api-services-drive", version.ref = "googleApiServicesDrive" }
google-auth-library-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuthLibrary" }
google-http-client-apache-v5 = { module = "com.google.http-client:google-http-client-apache-v5", version.ref = "googleHttpClient" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvmNative" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
