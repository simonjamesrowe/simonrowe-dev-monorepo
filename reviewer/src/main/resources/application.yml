server:
  port: ${REVIEWER_SERVER_PORT:8090}

management:
  server:
    port: ${REVIEWER_MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  application:
    name: temporal-code-reviewer
  profiles:
    default: local
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:local}
    namespace: ${TEMPORAL_NAMESPACE:default}

reviewer:
  github:
    api-base-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    app-client-id: ${GITHUB_APP_CLIENT_ID:}
    app-private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    request-timeout: 30s
  agent:
    command: ${CLAUDE_COMMAND:claude}
    model: ${CLAUDE_MODEL:sonnet}
    effort: ${CLAUDE_EFFORT:medium}
    max-turns: ${CLAUDE_MAX_TURNS:12}
    timeout: ${CLAUDE_TIMEOUT:15m}
    workspace-root: ${REVIEWER_WORKSPACE_ROOT:${java.io.tmpdir}/temporal-code-reviewer}
    max-diff-bytes: ${REVIEWER_MAX_DIFF_BYTES:2097152}
    max-changed-files: ${REVIEWER_MAX_CHANGED_FILES:80}
    prompt-version: v1
  api:
    trigger-token: ${REVIEWER_TRIGGER_TOKEN:}
