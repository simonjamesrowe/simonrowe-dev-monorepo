<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simon.rowe — public site UI kit</title>
<link rel="icon" href="../../assets/favicon.ico">
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen-label="01 Public Site">
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="TopNav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="CareerTimeline.jsx"></script>
<script type="text/babel" src="BlogGrid.jsx"></script>
<script type="text/babel" src="ChatDrawer.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [theme, setTheme] = useState("dark");
  const [chatOpen, setChatOpen] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  useEffect(() => {
    if (window.location.hash === "#chat") setChatOpen(true);
  }, []);

  return (
    <>
      <TopNav theme={theme} setTheme={setTheme} onChat={() => setChatOpen(true)} />
      <main>
        <Hero onChat={() => setChatOpen(true)} />
        <About />
        <CareerTimeline />
        <BlogGrid />
      </main>
      <Footer />
      <ChatDrawer open={chatOpen} onClose={() => setChatOpen(false)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
