<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 22px; align-content: center; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-family: var(--font-main); font-size: 0.72rem; color: var(--on-surface-variant); }
  input, textarea { font-family: var(--font-main); font-size: 0.9rem; padding: 12px 14px; background: var(--surface-container); border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--on-surface); outline: none; transition: all .2s; }
  input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(119,209,255,0.15); }
  .pill-input { display: flex; align-items: center; gap: 10px; background: var(--surface-container); border: 1px solid var(--border-subtle); border-radius: 999px; padding: 8px 8px 8px 18px; }
  .pill-input input { background: transparent; border: 0; padding: 0; flex: 1; }
  .pill-input button { background: linear-gradient(135deg, #77d1ff, #a78bfa); color: #001b2e; border: 0; border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-weight: 700; }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
  <div class="field"><label>Name</label><input value="Simon Rowe"></div>
  <div class="field"><label>Email</label><input value="hello@simonrowe.dev"></div>
  <div class="full pill-input">
    <input placeholder="Ask me anything about Simon's experience…">
    <button>↑</button>
  </div>
</body>
</html>
