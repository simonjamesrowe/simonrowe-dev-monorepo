<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 24px; }
  button { font-family: var(--font-main); font-weight: 500; font-size: 0.875rem; border: 1px solid transparent; border-radius: 999px; padding: 10px 20px; cursor: pointer; transition: all .25s cubic-bezier(.4,0,.2,1); display: inline-flex; align-items: center; gap: 8px; }
  .primary { background: linear-gradient(135deg, #77d1ff, #a78bfa); color: #001b2e; font-weight: 600; }
  .secondary { background: var(--surface-container); color: var(--on-surface); border-color: var(--border-faint); }
  .ghost { background: transparent; color: var(--on-surface); border-color: var(--border-subtle); }
  .danger { background: rgba(255,180,171,0.12); color: #ffb4ab; border-color: rgba(255,180,171,0.30); }
  .icon { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <button class="primary">Let's connect <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
  <button class="secondary"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg> Download CV</button>
  <button class="ghost">View all posts</button>
  <button class="danger">Delete</button>
</body>
</html>
