<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-content: center; padding: 22px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shape { width: 70px; height: 50px; background: var(--surface-container-high); border: 1px solid var(--border-faint); }
  .nm { font-family: var(--font-heading); font-size: 0.7rem; font-weight: 600; color: var(--on-surface); }
  .lbl { font-family: var(--font-mono); font-size: 0.62rem; color: var(--on-surface-variant); }
  .r-sm { border-radius: 6px; } .r-md { border-radius: 12px; } .r-lg { border-radius: 16px; }
  .r-xl { border-radius: 24px; } .r-2xl { border-radius: 32px; } .r-full { border-radius: 999px; }
</style>
</head>
<body>
  <div class="item"><div class="shape r-sm"></div><div class="nm">sm</div><div class="lbl">6px · chips</div></div>
  <div class="item"><div class="shape r-md"></div><div class="nm">md</div><div class="lbl">12px · inputs</div></div>
  <div class="item"><div class="shape r-lg"></div><div class="nm">lg</div><div class="lbl">16px · cards</div></div>
  <div class="item"><div class="shape r-xl"></div><div class="nm">xl</div><div class="lbl">24px · panels</div></div>
  <div class="item"><div class="shape r-2xl"></div><div class="nm">2xl</div><div class="lbl">32px · hero</div></div>
  <div class="item"><div class="shape r-full"></div><div class="nm">full</div><div class="lbl">999px · pills</div></div>
</body>
</html>
