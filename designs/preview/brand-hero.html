<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; height: 320px; overflow: hidden; }
  .hero { position: relative; height: 100%; background: linear-gradient(135deg, #1c2029 0%, #2a1f3a 50%, #0f131c 100%); }
  .hero::after { content:''; position:absolute; inset:0; background: radial-gradient(circle at 70% 30%, rgba(119,209,255,0.20), transparent 50%), linear-gradient(to bottom, transparent 50%, var(--surface) 100%); }
  .content { position: relative; z-index: 2; padding: 36px 32px; display: flex; flex-direction: column; gap: 12px; max-width: 520px; }
  .eyebrow { font-family: var(--font-main); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-surface-variant); }
  .title { font-family: var(--font-heading); font-weight: 700; font-size: 3rem; line-height: 1.05; letter-spacing: -0.03em; }
  .title .accent { color: var(--primary); }
  .tag { font-family: var(--font-main); font-size: 0.95rem; line-height: 1.5; color: var(--on-surface-variant); max-width: 440px; }
  .ctas { display: flex; gap: 10px; margin-top: 6px; }
  .btn { font-family: var(--font-main); font-weight: 600; font-size: 0.85rem; padding: 10px 18px; border-radius: 999px; border: 0; cursor: pointer; }
  .btn.primary { background: linear-gradient(135deg, #77d1ff, #a78bfa); color: #001b2e; }
  .btn.ghost { background: transparent; color: var(--on-surface); border: 1px solid var(--border-faint); }
</style>
</head>
<body>
  <div class="hero">
    <div class="content">
      <div class="eyebrow">Engineering Leadership // AI-Native Systems</div>
      <h1 class="title">Simon <span class="accent">Rowe</span></h1>
      <p class="tag">Passionate about AI-native development, cloud-native architecture, and empowering engineering teams.</p>
      <div class="ctas">
        <button class="btn primary">Let's connect →</button>
        <button class="btn ghost">Download CV</button>
      </div>
    </div>
  </div>
</body>
</html>
