<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-content: center; }
  .swatch { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--border-faint); position: relative; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; }
  .swatch .name { font-family: var(--font-heading); font-size: 0.65rem; font-weight: 600; color: var(--on-surface); }
  .swatch .hex { font-family: var(--font-mono); font-size: 0.6rem; color: var(--on-surface-variant); }
  .lowest { background: #f5f6fa; } .surface { background: #f8f9fc; }
  .low { background: #f0f2f7; } .container { background: #ffffff; }
  .high { background: #e8eaf0; } .highest { background: #d8dbe3; } .bright { background: #dde0e7; }
</style>
</head>
<body>
  <div class="swatch lowest"><span class="name">lowest</span><span class="hex">#f5f6fa</span></div>
  <div class="swatch surface"><span class="name">surface</span><span class="hex">#f8f9fc</span></div>
  <div class="swatch low"><span class="name">low</span><span class="hex">#f0f2f7</span></div>
  <div class="swatch container"><span class="name">container</span><span class="hex">#ffffff</span></div>
  <div class="swatch high"><span class="name">high</span><span class="hex">#e8eaf0</span></div>
  <div class="swatch highest"><span class="name">highest</span><span class="hex">#d8dbe3</span></div>
  <div class="swatch bright"><span class="name">bright</span><span class="hex">#dde0e7</span></div>
</body>
</html>
