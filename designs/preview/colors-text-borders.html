<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: center; }
  .col { background: var(--surface-container-low); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 14px; }
  .col.light { background: #ffffff; border-color: rgba(0,0,0,0.06); color: #1a1d2b; }
  .col.light .muted { color: #4b5563; }
  .col h4 { font-family: var(--font-heading); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.65; margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 0.78rem; }
  .row .name { font-weight: 600; }
  .row .hex { font-family: var(--font-mono); font-size: 0.7rem; opacity: 0.7; }
  .chip { width: 38px; height: 16px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="col">
    <h4>Dark</h4>
    <div class="row"><div class="chip" style="background:#dfe2ef"></div><span class="name">on-surface</span><span class="hex">#dfe2ef</span></div>
    <div class="row"><div class="chip" style="background:#bec8cf"></div><span class="name">on-surface-variant</span><span class="hex">#bec8cf</span></div>
    <div class="row"><div class="chip" style="background:#889299"></div><span class="name">outline</span><span class="hex">#889299</span></div>
    <div class="row"><div class="chip" style="background:#3e484e"></div><span class="name">outline-variant</span><span class="hex">#3e484e</span></div>
    <div class="row"><div class="chip" style="background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.06)"></div><span class="name">border-faint</span><span class="hex">rgba w/0.10</span></div>
  </div>
  <div class="col light">
    <h4>Light</h4>
    <div class="row"><div class="chip" style="background:#1a1d2b"></div><span class="name">on-surface</span><span class="hex">#1a1d2b</span></div>
    <div class="row"><div class="chip" style="background:#4b5563"></div><span class="name">on-surface-variant</span><span class="hex">#4b5563</span></div>
    <div class="row"><div class="chip" style="background:#d1d5db"></div><span class="name">outline</span><span class="hex">#d1d5db</span></div>
    <div class="row"><div class="chip" style="background:#e5e7eb"></div><span class="name">outline-variant</span><span class="hex">#e5e7eb</span></div>
    <div class="row"><div class="chip" style="background:rgba(0,0,0,0.10);border:1px solid rgba(0,0,0,0.06)"></div><span class="name">border-faint</span><span class="hex">rgba k/0.10</span></div>
  </div>
</body>
</html>
