server:
  port: ${FACTORY_SERVER_PORT:${REVIEWER_SERVER_PORT:8090}}

management:
  server:
    port: ${FACTORY_MANAGEMENT_PORT:${REVIEWER_MANAGEMENT_PORT:8091}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  application:
    name: software-factory
  data:
    mongodb:
      uri: ${FACTORY_MONGODB_URI:mongodb://localhost:27017/software_factory}
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:local}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # The webhook API and the Temporal worker run in one JVM. They were once
    # separate deployables so the internet-facing receiver held no Claude or
    # GitHub App credential; that separation was given up deliberately to fit a
    # single Raspberry Pi, on the basis that the only route in from the internet
    # is the signature-verified webhook. See docs/runbooks/software-factory.md.
    workers-auto-discovery:
      enabled: true
      workflow-packages:
        - com.simonrowe.factory.codereview.workflow
        - com.simonrowe.factory.feedback.workflow
        # Without this entry no worker polls the cve-fix task queue and CveFixActivitiesImpl's
        # @ActivityImpl is never registered: the container is healthy, the schedule fires, and
        # nothing ever runs.
        - com.simonrowe.factory.cvefix.workflow
        # Same for the deploy queue. Note what this does NOT gate: classpath scanning for
        # @WorkflowImpl is unconditional (WorkersTemplate creates a worker for every task queue
        # a discovered class names), and both `software-factory` and `deployer` run this image —
        # so both register a deploy *workflow*-task poller. That is harmless: a workflow
        # implementation is deterministic orchestration that only schedules activities.
        #
        # The executor gate is DeployActivitiesImpl's @ConditionalOnProperty on
        # factory.deploy.enabled, which is true only on `deployer`. Only that container holds an
        # implementation of any side-effecting step, which is what confines the Docker socket to
        # the container with no ingress. See specs/036-auto-deploy-on-merge/research.md §11.
        - com.simonrowe.factory.deploy.workflow
        # NOTE: the issue sink adds no entry here. This list drives @WorkflowImpl classpath
        # scanning only, and the `linear` queue has no @WorkflowImpl — its worker comes from
        # LinearActivitiesImpl's @ActivityImpl(taskQueues = ...) alone. `linear` is this
        # application's first ACTIVITY-ONLY task queue: every other queue above has a
        # corresponding workflow package; this one deliberately does not. Temporal's Spring
        # Boot starter (temporal-spring-boot-starter 1.36.0) discovers activity beans
        # independently of workflow-packages: WorkersTemplate.configureActivityBeansByTaskQueue
        # walks every @ActivityImpl bean's task queues and calls tryGetWorker, creating one when
        # none exists for that queue. Verified in specs/037-linear-issue-sink/research.md item
        # 7. Adding com.simonrowe.factory.linear.workflow here would do nothing but falsely
        # imply a workflow lives in that package. The other half of the gate for THIS queue is
        # `register-activity-beans: true` below — the setting that turns discovered
        # @ActivityImpl beans into pollers at all; research item 7 names it as the second thing
        # that must hold alongside LinearActivitiesImpl's own @ConditionalOnProperty. If either
        # one stops holding, the failure is the usual quiet one: the container is healthy, a
        # producer schedules fileIssue, and the activity sits in the queue until its
        # schedule-to-close timeout.
      register-activity-beans: true

factory:
  codereview:
    github:
      api-base-url: ${GITHUB_API_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
      app-client-id: ${GITHUB_APP_CLIENT_ID:}
      app-private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
      request-timeout: 30s
    agent:
      command: ${CLAUDE_COMMAND:claude}
      model: ${CLAUDE_MODEL:sonnet}
      effort: ${CLAUDE_EFFORT:medium}
      # A 12-turn budget was exhausted by an ordinary 27-file change before the agent could
      # emit a verdict, which surfaced as a bare non-zero exit and no comment on the pull
      # request. Keep enough headroom that turns bound runaway loops, not real reviews.
      # Raised 40 -> 60 alongside max-changed-files 80 -> 250: turns, not wall clock, are what
      # actually bound review cost, so lifting the file ceiling without lifting this one just
      # moves the truncation from "exceeds changed-file limit" to a silent turn exhaustion.
      max-turns: ${CLAUDE_MAX_TURNS:60}
      # 25m, not 15m: a 250-file review reads far more than an 80-file one, on a Pi. The
      # activity's start-to-close timeout in CodeReviewWorkflowImpl must stay comfortably
      # above this — it also has to cover the clone, checkout and diff around the agent run.
      timeout: ${CLAUDE_TIMEOUT:25m}
      # FACTORY_* is the current name; REVIEWER_* is accepted for one release so a
      # stale deploy .env cannot break the boot. Remove the fallbacks after that.
      workspace-root: ${FACTORY_WORKSPACE_ROOT:${REVIEWER_WORKSPACE_ROOT:${java.io.tmpdir}/software-factory}}
      max-diff-bytes: ${FACTORY_MAX_DIFF_BYTES:${REVIEWER_MAX_DIFF_BYTES:2097152}}
      # 250, not 80. 80 refused PR #106 outright (98 files) with "Review exceeds changed-file
      # limit", which is what this repo's spec-driven changes routinely look like once specs,
      # backend, frontend and docs move together. This guard exists to refuse a PR that is
      # pointless to review — a regenerated lockfile, a vendored directory, a mass rename —
      # and 250 still catches those while passing every real change seen so far.
      # max-diff-bytes above is the tighter guard in practice: 2 MiB of diff already exceeds
      # what the agent can hold, so raise that one only with a plan for chunking the diff.
      max-changed-files: ${FACTORY_MAX_CHANGED_FILES:${REVIEWER_MAX_CHANGED_FILES:250}}
      prompt-version: v1
    api:
      trigger-token: ${FACTORY_TRIGGER_TOKEN:${REVIEWER_TRIGGER_TOKEN:}}
    # Deep-linked from failure comments on pull requests. Blank drops the link and keeps the
    # bare workflow id, so an unconfigured URL never costs the reader the failure reason.
    temporal-ui-base-url: ${TEMPORAL_UI_URL:https://temporal.simonrowe.dev}
  feedback:
    enabled: ${FACTORY_FEEDBACK_ENABLED:false}
    repos: ${FACTORY_FEEDBACK_REPOS:}
    skip-label: agent-feedback
    agent-setup-repo: simonjamesrowe/agent-setup
    git-author-name: simonrowe-code-reviewer[bot]
    git-author-email: simonrowe-code-reviewer[bot]@users.noreply.github.com
    workspace-root: ${FACTORY_WORKSPACE_ROOT:${java.io.tmpdir}/software-factory}
    harvest:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_FEEDBACK_HARVEST_MODEL:haiku}
      effort: ${FACTORY_FEEDBACK_HARVEST_EFFORT:low}
      max-turns: ${FACTORY_FEEDBACK_HARVEST_MAX_TURNS:8}
      timeout: ${FACTORY_FEEDBACK_HARVEST_TIMEOUT:5m}
    distill:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_FEEDBACK_DISTILL_MODEL:sonnet}
      effort: ${FACTORY_FEEDBACK_DISTILL_EFFORT:medium}
      max-turns: ${FACTORY_FEEDBACK_DISTILL_MAX_TURNS:24}
      timeout: ${FACTORY_FEEDBACK_DISTILL_TIMEOUT:15m}
  cvefix:
    enabled: ${FACTORY_CVEFIX_ENABLED:false}
    owner: simonjamesrowe
    repository: simonrowe-dev-monorepo
    branch: chore/dependency-cve-fixes
    base-branch: main
    # No installation-id key: the activity resolves it from
    # GitHubCredentials.installationId(owner, repository) at run time. A configured-but-empty
    # value would make accessToken(null) fall back to the static GITHUB_TOKEN, which this
    # service does not set — anonymous clone, 403 on push.
    git-author-name: simonrowe-code-reviewer[bot]
    git-author-email: simonrowe-code-reviewer[bot]@users.noreply.github.com
    workspace-root: ${FACTORY_WORKSPACE_ROOT:${java.io.tmpdir}/software-factory}
    dependency-track:
      # The container on the shared compose network, not the public hostname: this keeps the
      # call off the Cloudflare/pinggy path entirely.
      base-url: ${DEPENDENCYTRACK_BASE_URL:http://dependencytrack-apiserver:8080}
      api-key: ${DEPENDENCYTRACK_API_KEY:}
      projects:
        - simonrowe-dev/backend
        - simonrowe-dev/frontend
      request-timeout: 30s
    agent:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_CVEFIX_MODEL:sonnet}
      effort: ${FACTORY_CVEFIX_EFFORT:medium}
      max-turns: ${FACTORY_CVEFIX_MAX_TURNS:40}
      timeout: ${FACTORY_CVEFIX_TIMEOUT:15m}
    ci:
      # 3m keeps unauthenticated GitHub API use near 20 req/hour, inside the 60/hour per-IP
      # limit. Do not lower without moving CiStatusGateway to the installation token.
      poll-interval: ${FACTORY_CVEFIX_POLL_INTERVAL:3m}
      repair-budget: ${FACTORY_CVEFIX_REPAIR_BUDGET:3}
      # 3h, not 45m: repair-budget + 1 iterations, each up to agent.timeout plus a full CI
      # cycle, do not fit in 45 minutes. A shorter cap silently truncates the budget.
      max-wait: ${FACTORY_CVEFIX_MAX_WAIT:3h}
      # Check runs that may never make the build RED. The promptfoo evals job is
      # continue-on-error advisory: if it ever reports conclusion: failure, every run would
      # burn the whole repair budget on it and end CI_UNRESOLVED, blocking all later runs.
      advisory-checks:
        - evaluate
  deploy:
    # TWO flags, deliberately separate, both off. The receiver and the executor must be
    # switchable independently so a broken deployer can be silenced without also silencing
    # code review.
    #
    # `enabled` registers DeployActivitiesImpl. It is true only on the `deployer` service, and
    # it is the only thing that keeps the Docker socket out of the JVM that terminates untrusted
    # internet traffic. `trigger-enabled` gates the workflow_run webhook branch and the client
    # stub; it is true only on `software-factory`.
    enabled: ${FACTORY_DEPLOY_ENABLED:false}
    trigger-enabled: ${FACTORY_DEPLOY_TRIGGER_ENABLED:false}
    # The repository allowlist, and it is a set of exactly one. There is no shared allowlist to
    # reuse: factory.feedback.repos is feedback-only and factory.cvefix pins owner/repository as
    # scalars, which is the pattern followed here.
    owner: simonjamesrowe
    repository: simonrowe-dev-monorepo
    # The Publish workflow's completion is the ONLY event that means the three images exist.
    # pull_request `closed` fires on merge, minutes before the ARM builds finish, so deploying
    # on that would pull the previous :latest and report success.
    workflow-name: Publish
    branch: main
    compose-file: ${FACTORY_DEPLOY_COMPOSE_FILE:/workspace/repo/docker-compose.prod.yml}
    script: ${FACTORY_DEPLOY_SCRIPT:/workspace/repo/scripts/restart-prod.sh}
    repo-dir: ${FACTORY_DEPLOY_REPO_DIR:/workspace/repo}
    # Pinned rather than read from the checkout's remote: sync-config asserts the target commit
    # is an ancestor of what this URL serves, so a tampered remote must not be able to redirect
    # it. The repository is public, so the fetch needs no credential and no write access.
    repo-url: ${FACTORY_DEPLOY_REPO_URL:https://github.com/simonjamesrowe/simonrowe-dev-monorepo.git}
    # The images to pull. Tunable without a rebuild, like FACTORY_MAX_CHANGED_FILES.
    services: ${FACTORY_DEPLOY_SERVICES:backend,frontend,software-factory}
    # An allowlist of services the automation may recreate, not a denylist of ones it may not:
    # a service added to compose next year is held for a human by default. `deployer` is
    # deliberately absent — it excludes itself. Widening this is a config change, not a code
    # change.
    recreatable: ${FACTORY_DEPLOY_RECREATABLE:backend,frontend,software-factory,nginx,alloy,searxng,temporal-ui,dependencytrack-frontend}
    # An escape hatch for the case where rollback itself is the problem.
    rollback-enabled: ${FACTORY_DEPLOY_ROLLBACK_ENABLED:true}
    # Turns the git fast-forward off without disabling the whole deployer, leaving images-only
    # deploys working.
    sync-config: ${FACTORY_DEPLOY_SYNC_CONFIG:true}
    # Shared with nginx as the `deploy-state` volume — read-write here, read-only there.
    state-dir: ${FACTORY_DEPLOY_STATE_DIR:/var/run/deploy-state}
    # Ceiling for one shell phase. `pull` fetches three ARM images to a Pi and `verify` allows
    # the script's own 420s settle budget, so this has to be generous; the activity's
    # start-to-close timeout in DeployWorkflowImpl must stay above it.
    phase-timeout: ${FACTORY_DEPLOY_PHASE_TIMEOUT:30m}
    agent:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_DEPLOY_MODEL:sonnet}
      effort: ${FACTORY_DEPLOY_EFFORT:medium}
      # Modest on purpose: the agent has no Bash tool and reads a handful of captured text
      # files, so there is nothing for a large turn budget to buy.
      max-turns: ${FACTORY_DEPLOY_MAX_TURNS:12}
      timeout: ${FACTORY_DEPLOY_TIMEOUT:10m}
  linear:
    # The issue sink. Off by default like every other module: with this false nothing polls the
    # `linear` task queue, no Mongo index is touched, and no credential is read.
    #
    # True on `software-factory` ONLY. The `deployer` runs the same image and must stay false —
    # that is what keeps a tracker credential out of the JVM holding the Docker socket.
    enabled: ${FACTORY_LINEAR_ENABLED:false}
    api-key: ${LINEAR_API_KEY:}
    api-base-url: ${LINEAR_API_URL:https://api.linear.app/graphql}
    # The human team key (e.g. SIM), not a UUID. Resolved to a team id lazily on first filing
    # and cached — never at boot, for the reason CveFixScheduleInitializer documents: an
    # unreachable third party must not fail the context and take the webhook receiver down with
    # it.
    team-key: ${FACTORY_LINEAR_TEAM_KEY:}
    # Synthetic and deliberately non-resolving. This is the dedup key, not a link: it is
    # stamped on the issue as an attachment and looked up with attachmentsForURL.
    fingerprint-base-url: https://factory.simonrowe.dev/fingerprint
    # Reads Linear and writes linear_issues; performs no issueCreate/attachmentCreate/
    # commentCreate. Proves the lookup and the decision table against the real tracker without
    # leaving anything in it.
    dry-run: ${FACTORY_LINEAR_DRY_RUN:false}
    request-timeout: 30s
    producers:
      deploy:
        label: "factory:deploy"
        priority: 1
      cvefix:
        label: "factory:cvefix"
        priority: 3
