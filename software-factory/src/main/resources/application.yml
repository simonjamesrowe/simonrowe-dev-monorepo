server:
  port: ${FACTORY_SERVER_PORT:${REVIEWER_SERVER_PORT:8090}}

management:
  server:
    port: ${FACTORY_MANAGEMENT_PORT:${REVIEWER_MANAGEMENT_PORT:8091}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  application:
    name: software-factory
  # The container's role is its Spring profile. Both containers run this image; the role decides
  # which workflows each one polls for (see workers-auto-discovery below and
  # application-deployer.yml). FACTORY_RUNTIME_ROLE is already set on both services in
  # docker-compose.prod.yml, so this needs no compose change - and a compose change to the
  # deployer's service definition is what holds a deploy back (#130).
  profiles:
    active: ${FACTORY_RUNTIME_ROLE:software-factory}
  # Boot 4 moved the Mongo connection settings to their own spring.mongodb namespace.
  mongodb:
    uri: ${FACTORY_MONGODB_URI:mongodb://localhost:27017/software_factory}
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:local}
    namespace: ${TEMPORAL_NAMESPACE:default}
    # The webhook API and the Temporal worker run in one JVM. They were once
    # separate deployables so the internet-facing receiver held no Claude or
    # GitHub App credential; that separation was given up deliberately to fit a
    # single Raspberry Pi, on the basis that the only route in from the internet
    # is the signature-verified webhook. See docs/runbooks/software-factory.md.
    workers-auto-discovery:
      enabled: true
      # Only the workflows whose activities run in THIS container. This list is the software-factory
      # role's; application-deployer.yml replaces it with deploy and platform-backup for the
      # deployer. Both containers once scanned all six, because @WorkflowImpl scanning is
      # unconditional, and so both polled every workflow queue. That is only harmless while both
      # run the same build, and the deployer is updated separately: on 2026-09-15 it took a
      # log-watch workflow task on an older build than the activity that fed it, and the run
      # wedged logwatch-daily for eleven days (see docs/runbooks/logwatch.md). The activity gates
      # (@ConditionalOnProperty on each *ActivitiesImpl) still decide where side effects run;
      # this decides where the orchestration runs, and the two now agree.
      # FactoryWorkflowWorkersTest fails if the two roles' lists stop covering every @WorkflowImpl
      # package exactly once - a package in neither is a queue nothing polls, which is the quiet
      # failure: a healthy container, a schedule that fires, and a run that never starts.
      workflow-packages:
        # The activity gate is ReviewActivitiesImpl's @ConditionalOnProperty on
        # factory.codereview.enabled, false only on `deployer`.
        - com.simonrowe.factory.codereview.workflow
        - com.simonrowe.factory.feedback.workflow
        # Without this entry no worker polls the cve-fix task queue and CveFixActivitiesImpl's
        # @ActivityImpl is never registered: the container is healthy, the schedule fires, and
        # nothing ever runs.
        - com.simonrowe.factory.cvefix.workflow
        # The activity gate is LogWatchActivitiesImpl's @ConditionalOnProperty on
        # factory.logwatch.enabled, which keeps the Grafana read credential out of the deployer.
        - com.simonrowe.factory.logwatch.workflow
        # NOTE: the issue sink adds no entry here. This list drives @WorkflowImpl classpath
        # scanning only, and the `linear` queue has no @WorkflowImpl — its worker comes from
        # LinearActivitiesImpl's @ActivityImpl(taskQueues = ...) alone. `linear` is this
        # application's first ACTIVITY-ONLY task queue: every other queue above has a
        # corresponding workflow package; this one deliberately does not. Temporal's Spring
        # Boot starter (temporal-spring-boot-starter 1.36.0) discovers activity beans
        # independently of workflow-packages: WorkersTemplate.configureActivityBeansByTaskQueue
        # walks every @ActivityImpl bean's task queues and calls tryGetWorker, creating one when
        # none exists for that queue. Verified in specs/039-linear-issue-sink/research.md item
        # 7. Adding com.simonrowe.factory.linear.workflow here would do nothing but falsely
        # imply a workflow lives in that package. The other half of the gate for THIS queue is
        # `register-activity-beans: true` below — the setting that turns discovered
        # @ActivityImpl beans into pollers at all; research item 7 names it as the second thing
        # that must hold alongside LinearActivitiesImpl's own @ConditionalOnProperty. If either
        # one stops holding, the failure is the usual quiet one: the container is healthy, a
        # producer schedules fileIssue, and the activity sits in the queue until its
        # schedule-to-close timeout.
      register-activity-beans: true

factory:
  runtime-role: ${FACTORY_RUNTIME_ROLE:software-factory}
  codereview:
    # Registers ReviewActivitiesImpl, and so decides which container executes a review step.
    # Set false only on `deployer`, which holds no GitHub App credential: without that, both
    # containers poll the code-review ACTIVITY queue and Temporal splits the work between them,
    # failing roughly half of all reviews on a missing credential that presents as flaky DNS.
    #
    # Defaults TRUE, unlike factory.deploy.enabled. That one guards the Docker socket, so opt-in
    # is the safe default; this one guards nothing, and the merge gate requires the `Code Review`
    # check — so a default of false would turn one missing variable into "no pull request can
    # merge", silently. Fail toward the visible problem.
    enabled: ${FACTORY_CODEREVIEW_ENABLED:true}
    # Arms GitHub squash auto-merge on a pull request whose review passed and whose every path
    # classifies auto-merge (MergeDisposition, the Java twin of scripts/classify-change.sh).
    # GitHub then merges once the main ruleset is satisfied. Off here so tests and local runs
    # arm nothing; production sets it on software-factory in docker-compose.prod.yml. Off still
    # withdraws the reviewer's own earlier arms on re-review, so switching it off cannot leave
    # an armed pull request to merge whatever is pushed next.
    auto-merge:
      enabled: ${FACTORY_CODEREVIEW_AUTO_MERGE_ENABLED:false}
    github:
      api-base-url: ${GITHUB_API_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
      app-client-id: ${GITHUB_APP_CLIENT_ID:}
      app-private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
      request-timeout: 30s
    agent:
      command: ${CLAUDE_COMMAND:claude}
      model: ${CLAUDE_MODEL:sonnet}
      effort: ${CLAUDE_EFFORT:medium}
      # A 12-turn budget was exhausted by an ordinary 27-file change before the agent could
      # emit a verdict, which surfaced as a bare non-zero exit and no comment on the pull
      # request. Keep enough headroom that turns bound runaway loops, not real reviews.
      # Raised 40 -> 60 alongside max-changed-files 80 -> 250: turns, not wall clock, are what
      # actually bound review cost, so lifting the file ceiling without lifting this one just
      # moves the truncation from "exceeds changed-file limit" to a silent turn exhaustion.
      max-turns: ${CLAUDE_MAX_TURNS:60}
      # 25m, not 15m: a 250-file review reads far more than an 80-file one, on a Pi. The
      # activity's start-to-close timeout in CodeReviewWorkflowImpl must stay comfortably
      # above this — it also has to cover the clone, checkout and diff around the agent run.
      timeout: ${CLAUDE_TIMEOUT:25m}
      # FACTORY_* is the current name; REVIEWER_* is accepted for one release so a
      # stale deploy .env cannot break the boot. Remove the fallbacks after that.
      workspace-root: ${FACTORY_WORKSPACE_ROOT:${REVIEWER_WORKSPACE_ROOT:${java.io.tmpdir}/software-factory}}
      max-diff-bytes: ${FACTORY_MAX_DIFF_BYTES:${REVIEWER_MAX_DIFF_BYTES:2097152}}
      # 250, not 80. 80 refused PR #106 outright (98 files) with "Review exceeds changed-file
      # limit", which is what this repo's spec-driven changes routinely look like once specs,
      # backend, frontend and docs move together. This guard exists to refuse a PR that is
      # pointless to review — a regenerated lockfile, a vendored directory, a mass rename —
      # and 250 still catches those while passing every real change seen so far.
      # max-diff-bytes above is the tighter guard in practice: 2 MiB of diff already exceeds
      # what the agent can hold, so raise that one only with a plan for chunking the diff.
      max-changed-files: ${FACTORY_MAX_CHANGED_FILES:${REVIEWER_MAX_CHANGED_FILES:250}}
      prompt-version: v1
    api:
      trigger-token: ${FACTORY_TRIGGER_TOKEN:${REVIEWER_TRIGGER_TOKEN:}}
      # Narrower than the trigger token: authorises only GET /api/factory/flow/{nodeKey}.
      # The deployer is granted this one, and never the trigger token above, so it can report
      # deploy/platformbackup detail truthfully without gaining the credential that starts a
      # deploy, a code review or a platform backup.
      read-token: ${FACTORY_READ_TOKEN:}
    # Deep-linked from failure comments on pull requests. Blank drops the link and keeps the
    # bare workflow id, so an unconfigured URL never costs the reader the failure reason.
    temporal-ui-base-url: ${TEMPORAL_UI_URL:https://temporal.simonrowe.dev}
  feedback:
    enabled: ${FACTORY_FEEDBACK_ENABLED:false}
    repos: ${FACTORY_FEEDBACK_REPOS:}
    skip-label: agent-feedback
    agent-setup-repo: simonjamesrowe/agent-setup
    git-author-name: simonrowe-code-reviewer[bot]
    git-author-email: simonrowe-code-reviewer[bot]@users.noreply.github.com
    workspace-root: ${FACTORY_WORKSPACE_ROOT:${java.io.tmpdir}/software-factory}
    harvest:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_FEEDBACK_HARVEST_MODEL:haiku}
      effort: ${FACTORY_FEEDBACK_HARVEST_EFFORT:low}
      max-turns: ${FACTORY_FEEDBACK_HARVEST_MAX_TURNS:8}
      timeout: ${FACTORY_FEEDBACK_HARVEST_TIMEOUT:5m}
    distill:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_FEEDBACK_DISTILL_MODEL:sonnet}
      effort: ${FACTORY_FEEDBACK_DISTILL_EFFORT:medium}
      max-turns: ${FACTORY_FEEDBACK_DISTILL_MAX_TURNS:24}
      timeout: ${FACTORY_FEEDBACK_DISTILL_TIMEOUT:15m}
  cvefix:
    enabled: ${FACTORY_CVEFIX_ENABLED:false}
    owner: simonjamesrowe
    repository: simonrowe-dev-monorepo
    branch: chore/dependency-cve-fixes
    base-branch: main
    # No installation-id key: the activity resolves it from
    # GitHubCredentials.installationId(owner, repository) at run time. A configured-but-empty
    # value would make accessToken(null) fall back to the static GITHUB_TOKEN, which this
    # service does not set — anonymous clone, 403 on push.
    git-author-name: simonrowe-code-reviewer[bot]
    git-author-email: simonrowe-code-reviewer[bot]@users.noreply.github.com
    workspace-root: ${FACTORY_WORKSPACE_ROOT:${java.io.tmpdir}/software-factory}
    dependency-track:
      # The container on the shared compose network, not the public hostname: this keeps the
      # call off the Cloudflare/pinggy path entirely.
      base-url: ${DEPENDENCYTRACK_BASE_URL:http://dependencytrack-apiserver:8080}
      api-key: ${DEPENDENCYTRACK_API_KEY:}
      projects:
        - simonrowe-dev/backend
        - simonrowe-dev/frontend
      request-timeout: 30s
    agent:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_CVEFIX_MODEL:sonnet}
      effort: ${FACTORY_CVEFIX_EFFORT:medium}
      max-turns: ${FACTORY_CVEFIX_MAX_TURNS:40}
      timeout: ${FACTORY_CVEFIX_TIMEOUT:15m}
    ci:
      # 3m keeps unauthenticated GitHub API use near 20 req/hour, inside the 60/hour per-IP
      # Legacy issue-only request compatibility; no CI polling occurs in the current workflow.
      poll-interval: ${FACTORY_CVEFIX_POLL_INTERVAL:3m}
      repair-budget: ${FACTORY_CVEFIX_REPAIR_BUDGET:3}
      # 3h, not 45m: repair-budget + 1 iterations, each up to agent.timeout plus a full CI
      # cycle, do not fit in 45 minutes. A shorter cap silently truncates the budget.
      max-wait: ${FACTORY_CVEFIX_MAX_WAIT:3h}
      # Check runs that may never make the build RED. The promptfoo evals job is
      # continue-on-error advisory: if it ever reports conclusion: failure, every run would
      # burn the whole repair budget on it and end CI_UNRESOLVED, blocking all later runs.
      advisory-checks:
        - evaluate
  deploy:
    # TWO flags, deliberately separate, both off. The receiver and the executor must be
    # switchable independently so a broken deployer can be silenced without also silencing
    # code review.
    #
    # `enabled` registers DeployActivitiesImpl. It is true only on the `deployer` service, and
    # it is the only thing that keeps the Docker socket out of the JVM that terminates untrusted
    # internet traffic. `trigger-enabled` gates the workflow_run webhook branch and the client
    # stub; it is true only on `software-factory`.
    enabled: ${FACTORY_DEPLOY_ENABLED:false}
    # Whether a successful deploy schedules a log scan five minutes later. Deployer-side, and
    # deliberately separate from factory.logwatch.enabled: a single flag would have registered a
    # Loki-querying activity poller inside the container holding the Docker socket. Same shape,
    # and same reason, as factory.deploy.enabled against trigger-enabled.
    log-watch-trigger-enabled: ${FACTORY_DEPLOY_LOG_WATCH_TRIGGER_ENABLED:false}
    trigger-enabled: ${FACTORY_DEPLOY_TRIGGER_ENABLED:false}
    # The repository allowlist, and it is a set of exactly one. There is no shared allowlist to
    # reuse: factory.feedback.repos is feedback-only and factory.cvefix pins owner/repository as
    # scalars, which is the pattern followed here.
    owner: simonjamesrowe
    repository: simonrowe-dev-monorepo
    # The Publish workflow's completion is the ONLY event that means the three images exist.
    # pull_request `closed` fires on merge, minutes before the ARM builds finish, so deploying
    # on that would pull the previous :latest and report success.
    workflow-name: Publish
    branch: main
    compose-file: ${FACTORY_DEPLOY_COMPOSE_FILE:/workspace/repo/docker-compose.prod.yml}
    script: ${FACTORY_DEPLOY_SCRIPT:/workspace/repo/scripts/restart-prod.sh}
    repo-dir: ${FACTORY_DEPLOY_REPO_DIR:/workspace/repo}
    # Pinned rather than read from the checkout's remote: sync-config asserts the target commit
    # is an ancestor of what this URL serves, so a tampered remote must not be able to redirect
    # it. The repository is public, so the fetch needs no credential and no write access.
    repo-url: ${FACTORY_DEPLOY_REPO_URL:https://github.com/simonjamesrowe/simonrowe-dev-monorepo.git}
    # The images to pull. Tunable without a rebuild, like FACTORY_MAX_CHANGED_FILES.
    services: ${FACTORY_DEPLOY_SERVICES:backend,frontend,software-factory}
    # An allowlist of services the automation may recreate, not a denylist of ones it may not:
    # a service added to compose next year is held for a human by default. `deployer` is
    # deliberately absent — it excludes itself. Widening this is a config change, not a code
    # change.
    recreatable: ${FACTORY_DEPLOY_RECREATABLE:backend,frontend,software-factory,nginx,alloy,searxng,temporal-ui,dependencytrack-frontend}
    # An escape hatch for the case where rollback itself is the problem.
    rollback-enabled: ${FACTORY_DEPLOY_ROLLBACK_ENABLED:true}
    # Turns the git fast-forward off without disabling the whole deployer, leaving images-only
    # deploys working.
    sync-config: ${FACTORY_DEPLOY_SYNC_CONFIG:true}
    # Shared with nginx as the `deploy-state` volume — read-write here, read-only there.
    state-dir: ${FACTORY_DEPLOY_STATE_DIR:/var/run/deploy-state}
    # Ceiling for one shell phase. `pull` fetches three ARM images to a Pi and `verify` allows
    # the script's own 420s settle budget, so this has to be generous; the activity's
    # start-to-close timeout in DeployWorkflowImpl must stay above it.
    phase-timeout: ${FACTORY_DEPLOY_PHASE_TIMEOUT:30m}
    agent:
      command: ${CLAUDE_COMMAND:claude}
      model: ${FACTORY_DEPLOY_MODEL:sonnet}
      effort: ${FACTORY_DEPLOY_EFFORT:medium}
      # Modest on purpose: the agent has no Bash tool and reads a handful of captured text
      # files, so there is nothing for a large turn budget to buy.
      max-turns: ${FACTORY_DEPLOY_MAX_TURNS:12}
      timeout: ${FACTORY_DEPLOY_TIMEOUT:10m}
  linear:
    # The issue sink. Off by default like every other module: with this false nothing polls the
    # `linear` task queue, no Mongo index is touched, and no credential is read.
    #
    # True on `software-factory` ONLY. The `deployer` runs the same image and must stay false —
    # that is what keeps a tracker credential out of the JVM holding the Docker socket.
    enabled: ${FACTORY_LINEAR_ENABLED:false}
    api-key: ${LINEAR_API_KEY:}
    api-base-url: ${LINEAR_API_URL:https://api.linear.app/graphql}
    # The human team key (e.g. SIM), not a UUID. Resolved to a team id lazily on first filing
    # and cached — never at boot, for the reason CveFixScheduleInitializer documents: an
    # unreachable third party must not fail the context and take the webhook receiver down with
    # it.
    team-key: ${FACTORY_LINEAR_TEAM_KEY:}
    # Synthetic and deliberately non-resolving. This is the dedup key, not a link: it is
    # stamped on the issue as an attachment and looked up with attachmentsForURL.
    fingerprint-base-url: https://factory.simonrowe.dev/fingerprint
    # Reads Linear and writes linear_issues; performs no issueCreate/attachmentCreate/
    # commentCreate. Proves the lookup and the decision table against the real tracker without
    # leaving anything in it.
    dry-run: ${FACTORY_LINEAR_DRY_RUN:false}
    # 15s, and this number is arithmetic, not taste. One filing on a cold team cache is four
    # sequential Linear calls (fingerprint lookup, team/label/triage resolution, issueCreate,
    # attachmentCreate) and both producers give fileIssue a 90s startToCloseTimeout. Temporal
    # does not interrupt a non-heartbeating activity, so an attempt that outlives that timeout
    # keeps running while attempt 2 starts, sees an empty lookup and files a SECOND ticket.
    # 4 x 15s = 60s fits inside 90s; 4 x 30s = 120s did not. Raising this means raising the
    # activity timeout in DeployWorkflowImpl and CveFixWorkflowImpl too.
    request-timeout: 15s
    producers:
      deploy:
        label: "factory:deploy"
        priority: 1
      cvefix:
        label: "factory:cvefix"
        priority: 3
      feedback:
        label: "factory:feedback"
        priority: 3
      logwatch:
        label: "factory:logwatch"
        priority: 2
  logwatch:
    # Off by default like every other module. True on `software-factory` ONLY: `deployer` runs
    # the same image and must stay false, which is what keeps the Grafana read credential out of
    # the JVM holding the Docker socket.
    enabled: ${FACTORY_LOGWATCH_ENABLED:false}
    # Two, not one: a single occurrence of anything is noise at this volume. Provisional - the
    # spec flags this and max-per-run as estimates until they have been checked against real
    # production log lines, which needs Loki to have been ingesting for long enough to sample.
    minimum-occurrences: ${FACTORY_LOGWATCH_MIN_OCCURRENCES:2}
    # The cap is applied AFTER sorting most-severe-first, so what it drops is the least severe
    # and least frequent. Every run reports how many it dropped; a truncated report that does not
    # say so is the failure mode this guards.
    max-per-run: ${FACTORY_LOGWATCH_MAX_PER_RUN:5}
    default-window: ${FACTORY_LOGWATCH_WINDOW:24h}
    line-budget: ${FACTORY_LOGWATCH_LINE_BUDGET:5000}
    # The coverage floor for the fallback tier of the source-health check, used only when Alloy's
    # component API cannot be reached. Steady-state shipping is ~20MB/day across ~18 containers,
    # so three producing nothing over a full day means something is wrong with the pipeline
    # rather than with the stack.
    minimum-containers: ${FACTORY_LOGWATCH_MIN_CONTAINERS:3}
    # Close the tickets this module filed for problems it no longer sees, with a comment saying
    # so. Defaults ON, unlike every other flag in this file: filing without resolving is half an
    # automation, and the half it leaves out is the one a human has to do by hand every week.
    #
    # It is safe to leave on because the workflow refuses to sweep unless the scan can stand
    # behind its own silence: the source must be healthy, the read untruncated, nothing dropped by
    # the per-run cap, and the window at least an hour. And it is safe to get wrong because a
    # closed ticket keeps its fingerprint attachment, so a recurrence files a linked regression
    # rather than disappearing.
    resolve-when-clear: ${FACTORY_LOGWATCH_RESOLVE_WHEN_CLEAR:true}
    # Seven consecutive nightly scans. Short enough that a fixed problem's ticket does not
    # loiter, long enough that a weekly-cadence problem is not closed and re-filed on a cycle -
    # which is the duplicate-ticket disease 046 exists to cure.
    resolve-after: ${FACTORY_LOGWATCH_RESOLVE_AFTER:7d}
    # Third-party log noise. Each rule mutes a group only when EVERY distinct message in it
    # matches, and only when none were hidden by the variant cap, so a real fault emitted by the
    # same logger still files. Every run says how many groups each rule muted; nothing here is
    # silent. See docs/runbooks/logwatch.md ("Muting third-party noise").
    #
    # Curated in this file rather than driven by an environment variable on purpose. A rule is a
    # statement that a class of log line belongs to somebody else, which is a code-review
    # decision and wants the `reason` beside it in the diff - not something to be changed on a
    # host at 2am while the thing it hides is the outage.
    #
    # The six below are the entire "not fixed, deliberately" backlog: SIM-28, SIM-31, SIM-32,
    # SIM-40, SIM-41 and SIM-42, all filed repeatedly, none with a line in this repository to
    # change. Muted, their tickets stop being refreshed and the absence sweep closes them after
    # resolve-after, exactly as it would for a problem that was fixed.
    #
    # A group is muted when every one of its distinct messages is claimed by SOME rule here, not
    # when one rule claims all of them. Three of these six exist because Temporal phrases one
    # incident several ways inside a single logger.
    ignore:
      # Temporal logs the teardown of its own long-poll and persistence calls at ERROR, with a
      # full Go stack. `context canceled` is a worker disconnecting or a poll timing out - both
      # routine, both several times a day. Scoped to the container as well as the phrase because
      # `context canceled` is generic enough that a first-party log could legitimately say it.
      - reason: "Temporal shutdown/cancel churn (context canceled)"
        container: temporal
        contains: "context canceled"
      # The same thing seen from Postgres: Temporal cancels a visibility query and the driver
      # reports the cancellation as a statement error.
      - reason: "Temporal visibility query cancelled by Temporal itself"
        container: temporal
        contains: "canceling statement due to user request"
      # The same cancellation reaching the SQL driver a moment later. Temporal's matching
      # service loses a task-queue transaction while its workers are being replaced, and the
      # driver reports the connection it was using as already finished with. Both of these sit
      # in the SAME group as `context canceled` above - one logger, one incident, several
      # phrasings - which is why muting is decided across the whole rule list rather than one
      # rule at a time. Without them SIM-28 was re-filed nightly with three of its five messages
      # already disowned.
      #
      # The evidence for calling these third-party: across 14 days to 2026-09-14 every
      # occurrence of both phrases (16 and 10 respectively) landed inside a minute of a
      # container recreate - 09-06 09:00, 09-10 06:00, 09-13 18:30 and 20:04, all deploys - and
      # none at any other time. Temporal retries and recovers; nothing downstream noticed.
      # Delete these two if they ever appear away from a deploy, because then they are saying
      # something about langfuse-db rather than about a restart.
      - reason: "Temporal SQL transaction torn down while its workers were replaced"
        container: temporal
        contains: "transaction has already been committed or rolled back"
      - reason: "Temporal losing a Postgres connection during a container recreate"
        container: temporal
        contains: "database connection lost: driver: bad connection"
      # Alloy tails containers discovered from the Docker socket. A container that exits between
      # discovery and the read - every one-shot, and every service a deploy recreates - produces
      # one of these. It is Alloy correctly noticing a race it cannot avoid, and it does not
      # indicate lost logs for any container that is still running.
      - reason: "Alloy tailing a container that was being removed"
        container: alloy
        contains: "can not get logs from container which is dead or marked for removal"
      # Dependency-Track mirrors OSV, and OSV carries pypi ranges with malformed versions in them
      # (`2.7.0rrc0`). DT says so, once per range, and falls back to generic version comparison -
      # which is the correct handling, logged. 195 lines in two seconds during one mirror sync,
      # about an ecosystem this portfolio has no components in.
      - reason: "Dependency-Track parsing malformed OSV pypi version ranges"
        container: dependencytrack-apiserver
        contains: "[BovModelConverter] Range"
    loki:
      # NOTE this is the *push* URL and already contains /loki/api/v1. LokiClient strips the
      # trailing /push to get the query base; appending /api/v1 to the raw value yields
      # /loki/api/v1/api/v1/... and a bare `404 page not found` with no hint what is wrong.
      endpoint: ${GRAFANA_CLOUD_LOKI_ENDPOINT:}
      user: ${GRAFANA_CLOUD_LOKI_USER:}
      api-key: ${GRAFANA_CLOUD_API_KEY:}
      request-timeout: 30s
    alloy:
      # Alloy publishes no host port and nginx routes nothing to it; this works because both
      # containers share the compose network. Best-effort: when it cannot be reached the health
      # check falls back to inferring from container coverage, which is strictly less
      # informative but never absent.
      base-url: ${FACTORY_LOGWATCH_ALLOY_URL:http://alloy:12345}
      request-timeout: 5s
  platform-backup:
    # Off by default, and true only on the `deployer` service. This flag registers
    # PlatformBackupActivitiesImpl, which is the only thing that lets a container execute the
    # capture - and the capture needs the Docker socket, so it must stay on the container with
    # no ingress. Same shape, and same reason, as factory.deploy.enabled above.
    #
    # Turning it on does NOT start backing up: PlatformBackupScheduleInitializer creates the
    # schedule paused, and an operator unpauses it after watching a manual --dry-run. Assert a
    # live poller on the `platform-backup` task queue afterwards - a container can be healthy
    # with no poller registered, in which case the schedule fires and nothing ever runs.
    enabled: ${FACTORY_PLATFORM_BACKUP_ENABLED:false}
    script: ${FACTORY_PLATFORM_BACKUP_SCRIPT:/workspace/repo/scripts/backup-platform.sh}
    # The deploy directory, which is also where the script reads .env from.
    working-directory: ${FACTORY_PLATFORM_BACKUP_REPO_DIR:/workspace/repo}
    # Generous on purpose: the ClickHouse archive is unbounded, the Pi has four cores, and a
    # premature kill is indistinguishable from a real failure.
    timeout: ${FACTORY_PLATFORM_BACKUP_TIMEOUT:6h}
