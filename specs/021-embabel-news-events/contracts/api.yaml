openapi: 3.0.3
info:
  title: News & Events Aggregation API
  version: 1.0.0
  description: Public and admin endpoints for aggregated news articles and events

paths:
  # ── Public Endpoints ──────────────────────────────────────────

  /api/news:
    get:
      summary: List aggregated news articles
      description: Returns visible aggregated articles in reverse chronological order
      tags: [News - Public]
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Filter by source name
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Page number (zero-based)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Page size
      responses:
        '200':
          description: Paginated list of articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'

  /api/news/{id}:
    get:
      summary: Get a single aggregated article
      tags: [News - Public]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'
        '404':
          description: Article not found

  /api/events:
    get:
      summary: List aggregated events
      description: Returns visible events, upcoming first then past
      tags: [Events - Public]
      parameters:
        - name: upcoming
          in: query
          required: false
          schema:
            type: boolean
          description: Filter to upcoming only (true) or past only (false)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'

  /api/events/{id}:
    get:
      summary: Get a single aggregated event
      tags: [Events - Public]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Event not found

  # ── Admin Endpoints ─────���─────────────────────────────────────

  /api/admin/news:
    get:
      summary: List all aggregated articles (including hidden)
      tags: [News - Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArticleResponse'

  /api/admin/news/{id}/visibility:
    put:
      summary: Toggle article visibility
      tags: [News - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visible:
                  type: boolean
              required: [visible]
      responses:
        '200':
          description: Updated article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleResponse'

  /api/admin/news/{id}:
    delete:
      summary: Delete an aggregated article
      tags: [News - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Article deleted

  /api/admin/events:
    get:
      summary: List all aggregated events (including hidden)
      tags: [Events - Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventResponse'

  /api/admin/events/{id}/visibility:
    put:
      summary: Toggle event visibility
      tags: [Events - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visible:
                  type: boolean
              required: [visible]
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'

  /api/admin/events/{id}:
    delete:
      summary: Delete an aggregated event
      tags: [Events - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Event deleted

  /api/admin/content-sources:
    get:
      summary: List configured content sources
      tags: [Content Sources - Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All content sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentSourceResponse'

  /api/admin/content-sources/{id}:
    put:
      summary: Update content source configuration
      tags: [Content Sources - Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSourceUpdate'
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSourceResponse'

  /api/admin/aggregation/trigger:
    post:
      summary: Manually trigger content aggregation
      tags: [Aggregation - Admin]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Aggregation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Content aggregation triggered"

  /api/admin/digest/trigger:
    post:
      summary: Manually trigger weekly digest generation
      tags: [Aggregation - Admin]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Digest generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Weekly digest generation triggered"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ArticleResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        sourceName:
          type: string
        originalUrl:
          type: string
        summary:
          type: string
        author:
          type: string
          nullable: true
        publishedDate:
          type: string
          format: date-time
          nullable: true
        fetchedAt:
          type: string
          format: date-time
        visible:
          type: boolean
        imageUrl:
          type: string
          nullable: true

    ArticlePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ArticleResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    EventResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        sourceName:
          type: string
        originalUrl:
          type: string
        summary:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        eventDate:
          type: string
          format: date-time
        eventEndDate:
          type: string
          format: date-time
          nullable: true
        venue:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        fetchedAt:
          type: string
          format: date-time
        visible:
          type: boolean

    EventPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EventResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer

    ContentSourceResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        feedUrl:
          type: string
          nullable: true
        sitemapUrl:
          type: string
          nullable: true
        sourceType:
          type: string
          enum: [BLOG, NEWS, EVENTS]
        scrapeStrategy:
          type: string
          enum: [RSS, SITEMAP_HTML, HTML]
        active:
          type: boolean
        lastFetchedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true

    ContentSourceUpdate:
      type: object
      properties:
        active:
          type: boolean
        feedUrl:
          type: string
        sitemapUrl:
          type: string
