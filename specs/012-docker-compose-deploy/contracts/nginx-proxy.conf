# Nginx Reverse Proxy Configuration
# Routes traffic based on Host header to frontend or backend containers
# Sits between Pinggy tunnel and application services

# Frontend: simonrowe.dev and www.simonrowe.dev
server {
    listen 80;
    server_name simonrowe.dev www.simonrowe.dev;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API: api.simonrowe.dev
server {
    listen 80;
    server_name api.simonrowe.dev;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support (for /ws/chat STOMP endpoint)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
