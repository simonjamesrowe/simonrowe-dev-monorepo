<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoParent · Documents — straw-man mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#dfe5ea;color:#0f172a;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- mockup chrome (not part of the product) ---------- */
.mock-bar{height:56px;display:flex;align-items:center;gap:22px;padding:0 20px;background:#0b1220;color:#e2e8f0;font-size:13px;position:relative;z-index:100}
.mock-bar__brand{font-weight:600;display:flex;align-items:center;gap:8px}
.mock-bar__tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#1e293b;color:#94a3b8}
.mock-group{display:flex;align-items:center;gap:8px}
.mock-group__label{color:#94a3b8}
.mock-seg{display:inline-flex;background:#1e293b;border-radius:9px;padding:3px}
.mock-seg button{border:0;background:transparent;color:#cbd5e1;padding:5px 11px;border-radius:7px}
.mock-seg button.is-on{background:#0d9488;color:#fff}
.stage{height:calc(100vh - 56px);display:flex;justify-content:center;align-items:stretch}
.stage--mobile{align-items:center;padding:18px}

/* ---------- product ---------- */
.app{
  --bg:#f5f7f9;--surface:#fff;--surface-2:#f8fafc;--surface-3:#f1f5f9;--border:#e2e8f0;--border-strong:#cbd5e1;
  --text:#0f172a;--text-2:#334155;--muted:#64748b;
  --teal:#0d9488;--teal-strong:#0f766e;--teal-soft:#ccfbf1;--teal-tint:#f0fdfa;--teal-line:#5eead4;
  --rose-text:#be123c;--rose-soft:#ffe4e6;
  --amber-text:#92400e;--amber-soft:#fef3c7;
  --violet-text:#5b21b6;--violet-soft:#ede9fe;
  --sky-text:#0369a1;--sky-soft:#e0f2fe;
  --emerald-text:#047857;--emerald-soft:#d1fae5;
  --orange-text:#c2410c;--orange-soft:#ffedd5;
  --slate-soft:#e2e8f0;--slate-text:#334155;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.25);
  position:relative;overflow:hidden;width:100%;height:100%;display:flex;background:var(--bg);color:var(--text);font-size:15px
}
.app.theme-dark{
  --bg:#0a1120;--surface:#0f172a;--surface-2:#111b2e;--surface-3:#16223a;--border:#1e293b;--border-strong:#334155;
  --text:#e2e8f0;--text-2:#cbd5e1;--muted:#94a3b8;
  --teal:#14b8a6;--teal-strong:#2dd4bf;--teal-soft:rgba(20,184,166,.18);--teal-tint:rgba(20,184,166,.08);--teal-line:rgba(94,234,212,.35);
  --rose-text:#fda4af;--rose-soft:rgba(244,63,94,.18);
  --amber-text:#fcd34d;--amber-soft:rgba(245,158,11,.18);
  --violet-text:#c4b5fd;--violet-soft:rgba(139,92,246,.2);
  --sky-text:#7dd3fc;--sky-soft:rgba(14,165,233,.2);
  --emerald-text:#6ee7b7;--emerald-soft:rgba(16,185,129,.18);
  --orange-text:#fdba74;--orange-soft:rgba(249,115,22,.18);
  --slate-soft:#1e293b;--slate-text:#cbd5e1;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 24px 48px -12px rgba(0,0,0,.6)
}
.stage--mobile .app{width:390px;height:min(844px,calc(100vh - 92px));border-radius:42px;border:11px solid #0b1220;box-shadow:0 30px 60px -20px rgba(15,23,42,.5)}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.side{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px;gap:4px}
.side__logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--teal-strong);padding:0 10px 22px}
.side__mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#14b8a6,#f43f5e);display:grid;place-items:center;color:#fff}
.side__label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 12px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--text-2);font-weight:500;font-size:14px;text-align:left}
.nav.is-on{background:var(--teal-tint);color:var(--teal-strong)}
.nav__badge{margin-left:auto;background:var(--teal);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side__spacer{flex:1}

.main{flex:1;overflow:auto;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 60px}
.m-head{display:none}
.is-mobile .side{display:none}
.is-mobile .m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.is-mobile .wrap{padding:18px 16px 90px}

.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font-size:28px;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.ph__actions{margin-left:auto;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-strong);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--text)}
.btn--primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn--ghost{border-color:transparent;background:none;color:var(--muted)}
.btn--sm{padding:6px 10px;font-size:13px}
.btn__count{background:var(--teal);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}

.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.attn__item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--amber-text);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.attn__item--school{border-left-color:var(--teal)}
.attn__item strong{display:block;font-size:14px}
.attn__item span{font-size:13px;color:var(--muted)}
.attn__ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:8px 12px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip.is-on{background:var(--text);border-color:var(--text);color:var(--surface)}
.dot{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.dot--mia{background:#ec4899}.dot--leo{background:#6366f1}.dot--fam{background:#0d9488}

.sec{margin-bottom:26px}
.sec__h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sec__h small{font-weight:500;text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--teal-line)}
.card__top{display:flex;gap:12px;align-items:flex-start}
.thumb{width:42px;height:52px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted);position:relative}
.thumb small{position:absolute;bottom:3px;font-size:8px;font-weight:700;letter-spacing:.04em}
.card__title{font-weight:600;font-size:14px;line-height:1.3}
.card__sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.card__foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
.tag--amber{background:var(--amber-soft);color:var(--amber-text)}
.tag--rose{background:var(--rose-soft);color:var(--rose-text)}
.tag--teal{background:var(--teal-soft);color:var(--teal-strong)}
.tag--slate{background:var(--slate-soft);color:var(--slate-text)}
.tag--violet{background:var(--violet-soft);color:var(--violet-text)}
.tag svg.ic{width:12px;height:12px}
.who{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.who svg.ic{width:13px;height:13px}

.empty{background:var(--surface);border:1px dashed var(--border-strong);border-radius:16px;padding:40px;text-align:center}
.empty h2{margin:10px 0 6px}
.empty p{color:var(--muted);max-width:520px;margin:0 auto 18px}
.starter{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;max-width:760px;margin:18px auto 0;text-align:left}
.starter div{border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13px;background:var(--surface-2)}
.starter strong{display:block;margin-bottom:2px}

/* drawer */
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:20}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.is-mobile .drawer{top:40px;border-radius:20px 20px 0 0;width:100%}
.drawer__h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--border)}
.drawer__h h2{margin:0;font-size:19px}
.drawer__h p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.x{margin-left:auto;border:0;background:none;color:var(--muted);padding:4px}
.drawer__b{flex:1;overflow:auto;padding:20px 22px}
.drawer__f{border-top:1px solid var(--border);padding:14px 22px;display:flex;gap:8px;flex-wrap:wrap}

.preview{border:1px solid var(--border);border-radius:12px;background:var(--surface-3);height:220px;display:grid;place-items:center;margin-bottom:18px;position:relative;overflow:hidden}
.paper{width:150px;height:196px;background:#fff;border-radius:4px;box-shadow:0 6px 20px rgba(15,23,42,.18);padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.paper i{display:block;height:5px;border-radius:3px;background:#e2e8f0}
.paper b{display:block;height:9px;width:60%;border-radius:3px;background:#94a3b8;margin-bottom:6px}
.paper--passport{background:#7f1d1d;width:136px;height:186px;align-items:center;justify-content:center;color:#fbbf24;font-size:10px;letter-spacing:.12em;font-weight:700;text-align:center}
.preview__pages{position:absolute;bottom:10px;right:12px;font-size:12px;color:var(--muted);background:var(--surface);border-radius:6px;padding:2px 8px;border:1px solid var(--border)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;font-size:14px;margin:0 0 20px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500}
.callout{display:flex;gap:10px;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:18px}
.callout--amber{background:var(--amber-soft);color:var(--amber-text)}
.callout--teal{background:var(--teal-tint);color:var(--teal-strong);border:1px solid var(--teal-line)}
.callout--slate{background:var(--surface-3);color:var(--text-2)}
.h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:0 0 8px}
.log{list-style:none;padding:0;margin:0 0 18px;font-size:13.5px}
.log li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.log time{color:var(--muted);margin-left:auto;font-size:12.5px;white-space:nowrap}

/* add flow */
.drop{border:2px dashed var(--teal-line);background:var(--teal-tint);border-radius:14px;padding:30px;text-align:center;color:var(--teal-strong)}
.drop p{margin:6px 0 14px;color:var(--muted)}
.drop__btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.reading{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;background:var(--surface-3);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--teal-line);border-top-color:var(--teal);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.form{display:grid;gap:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:9px;padding:8px 10px}
.field--ai input,.field--ai select{border-color:var(--teal-line);background:var(--teal-tint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13px}
.seg button.is-on{background:var(--teal);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

/* school suggestions */
.sugg{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.sugg__h{display:flex;gap:10px;align-items:flex-start}
.sugg__h strong{display:block;font-size:14.5px}
.sugg__meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.sugg__why{font-size:13px;color:var(--text-2);background:var(--surface-3);border-radius:9px;padding:8px 10px;margin:10px 0}
.sugg__acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sugg__acts select{border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;background:var(--surface);font-size:13px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;box-shadow:var(--shadow-lg)}
.fab{display:none}
.is-mobile .fab{display:grid;position:absolute;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;background:var(--teal);color:#fff;border:0;place-items:center;box-shadow:var(--shadow-lg);z-index:6}
.is-mobile .ph__actions .btn--primary{display:none}
.is-mobile .grid{grid-template-columns:1fr}
.is-mobile .dl{grid-template-columns:120px 1fr}
.is-mobile .row2{grid-template-columns:1fr}
</style>
</head>
<body>
<div class="mock-bar">
  <div class="mock-bar__brand">CoParent · Documents <span class="mock-bar__tag">straw man — for discussion</span></div>
  <div class="mock-group"><span class="mock-group__label">Data</span><div class="mock-seg" data-ctl="data"><button data-v="full">Populated</button><button data-v="empty">First visit</button></div></div>
  <div class="mock-group"><span class="mock-group__label">Signed in as</span><div class="mock-seg" data-ctl="me"><button data-v="alex">Alex</button><button data-v="sam">Sam</button></div></div>
  <div class="mock-group"><span class="mock-group__label">Device</span><div class="mock-seg" data-ctl="device"><button data-v="desktop">Desktop</button><button data-v="mobile">Mobile</button></div></div>
  <div class="mock-group"><span class="mock-group__label">Theme</span><div class="mock-seg" data-ctl="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
</div>
<div class="stage" id="stage"><div class="app" id="app"></div></div>

<script>
(() => {

  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',

  cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
  steth: '<path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 12 0V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 12 0v-4"/><circle cx="20" cy="10" r="2"/>',

function attention() {
  const items = [];
  visible().forEach((d) => {
    if (d.expires && months(d.expires) <= 6) items.push({ kind: 'expiry', doc: d, title: `${CHILDREN[d.child].name}'s passport expires in ${months(d.expires)} months`, sub: `${fmt(d.expires)}. We've emailed you both.` });
    if (d.review && months(d.review) <= 2) items.push({ kind: 'expiry', doc: d, title: `${CHILDREN[d.child].name}'s ${d.title.toLowerCase()} is due for review`, sub: `Review by ${fmt(d.review)}` });
  });
  if (suggestions.length) items.unshift({ kind: 'school', title: `${suggestions.length} letter${suggestions.length > 1 ? 's' : ''} from school to file`, sub: 'Choose which to keep for Mia and Leo' });
  return items;
}

function card(d) {
  const tags = [];
  if (d.expires) { const m = months(d.expires); tags.push(m <= 6 ? `<span class="tag tag--amber">${ic('clock')}Expires ${fmt(d.expires)}</span>` : `<span class="tag tag--slate">Valid to ${fmt(d.expires)}</span>`); }
  if (d.review) tags.push(`<span class="tag tag--amber">${ic('clock')}Review ${fmt(d.review)}</span>`);
  if (d.source === 'school') tags.push(`<span class="tag tag--teal">${ic('mail')}From school</span>`);
  if (d.archived) tags.push(`<span class="tag tag--slate">Archived ${fmt(d.archived.on)}</span>`);
  const orig = d.versions ? `<span class="who">${d.versions} versions</span>` : '';
  return `<button class="card" data-act="open" data-id="${d.id}">
    <div class="card__top"><span class="thumb">${ic(d.kind === 'passport' ? 'id' : 'file')}<small>${d.pages}p</small></span>
      <div><div class="card__title">${d.title}</div><div class="card__sub">${childDot(d.child)} ${childName(d.child)} · ${fmt(d.issued)}</div></div></div>
    <div class="card__foot">${tags.join('')}${orig}</div></button>`;
}

}

function toast(msg) { ui.toast = msg; render(); setTimeout(() => { ui.toast = null; render(); }, 2600); }

document.addEventListener('click', (e) => {
  const ctl = e.target.closest('[data-ctl] button');
  if (ctl) { ui[ctl.parentElement.dataset.ctl] = ctl.dataset.v; ui.open = null; ui.add = null; ui.school = false; return render(); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'q') return;
  if (act === 'open' && el.dataset.id) { ui.open = el.dataset.id; }
  else if (act === 'close') { ui.open = null; ui.add = null; ui.school = false; }
  else if (act === 'child') { ui.child = el.dataset.v; }
  else if (act === 'school') { ui.school = true; }
  else if (act === 'add') { ui.add = { step: 'pick' }; }
  else if (act === 'manual') { ui.add = { step: 'review', manual: true }; }
  else if (act === 'report-add') { suggestions = suggestions.filter((x) => x.id !== el.dataset.id); ui.school = false; ui.add = { step: 'review', prefill: { child: 'leo', cat: 'school', title: 'Autumn report 2026/27', issued: '24/11/2026', expires: '' } }; }
  else if (act === 'read') { ui.add = { step: 'reading' }; setTimeout(() => { if (ui.add) { ui.add = { step: 'review' }; render(); } }, 1400); }
  else if (act === 'save') { ui.add = null; ui.data = 'full'; return toast(`Saved. ${PARENTS[other()]} will get an email.`); }
  else if (act === 'archived') { ui.archived = !ui.archived; }
  else if (act === 'archive') { docs.find((d) => d.id === el.dataset.id).archived = { by: ui.me, on: '2026-11-28' }; ui.open = null; return toast(`Archived. ${PARENTS[other()]} will get an email, and either of you can restore it.`); }
  else if (act === 'restore') { delete docs.find((d) => d.id === el.dataset.id).archived; ui.open = null; return toast('Restored to the library.'); }
  else if (act === 'keep') {
    const s = suggestions.find((x) => x.id === el.dataset.id);
    suggestions = suggestions.filter((x) => x.id !== s.id);
    (s.child === 'both' ? ['mia', 'leo'] : [s.child]).forEach((c, i) => docs.push({ id: `k${s.id}${i}`, title: s.title, child: c, cat: s.cat, issued: s.sent, addedBy: ui.me, added: '2026-11-28', pages: 1, source: 'school' }));
    return toast('Kept and shared with ' + PARENTS[other()] + '.');
  }
  else if (act === 'dismiss') { suggestions = suggestions.filter((x) => x.id !== el.dataset.id); }
  render();
});
document.addEventListener('input', (e) => { if (e.target.dataset.act === 'q') { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const i = document.querySelector('[data-act="q"]'); i.focus(); i.setSelectionRange(pos, pos); } });
render();
})();
</script>
</body>
</html>
